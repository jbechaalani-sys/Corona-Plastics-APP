      const r = await window.storage.get(lmhKey());
      if(r && r.value) lmh = JSON.parse(r.value);
    } else if(memo[lmhKey()]) lmh = JSON.parse(memo[lmhKey()]);
  }catch(e){ /* nothing logged yet */ }
  if(!Array.isArray(lmh.rolls)) lmh.rolls = [];
  if(!Array.isArray(lmh.down))  lmh.down  = [];
  if(!Array.isArray(lmh.status)) lmh.status = [];
  // settings used to be one note per day — move it onto the rolls
  if(typeof lmh.settings === 'string' && lmh.settings.trim() && lmh.rolls.length){
    lmh.rolls.forEach(r => { if(!r.set) r.set = lmh.settings; });
    lmh.settings = '';
    saveLmh();                           // queued, not awaited — UI shouldn't wait
  }

async function allLmh(mac){
  const out = [];
  const take = (key, val) => {
    const [, id, m, date] = key.split(':');
    const name = nameOf(id);
    if(mac && m !== mac) return;
    let r; try{ r = JSON.parse(val); }catch(e){ return; }
    if(!r) return;
    (r.rolls || []).forEach(x => out.push({kind:'roll', name, mac:m, date, ...x}));
    (r.down  || []).forEach(x => out.push({kind:'down', name, mac:m, date, ...x}));
    if(Array.isArray(r.status) && r.status.length)
      out.push({kind:'status', name, mac:m, date, events:r.status});
  };
  try{
    if(window.storage){
      const list = await window.storage.list('lmh:');
      for(const k of (list && list.keys) || []){
        try{ const g = await window.storage.get(k); if(g) take(k, g.value); }catch(e){}
      }
    }
  }catch(e){}
  const seen = new Set(out.map(r => r.name + r.mac + r.date));
  Object.keys(memo).filter(k => k.startsWith('lmh:')).forEach(k => {
    const [, id, m, date] = k.split(':');
    if(!seen.has(nameOf(id) + m + date)) take(k, memo[k]);
  });
  return out.sort((a,b) => a.date.localeCompare(b.date) || (a.t||'').localeCompare(b.t||''));
}

function exportLmh(m, rolls, downs, upDays, statusRecs){
  if(!rolls.length && !downs.length && !(upDays || []).length){
    alert('Nothing to export for this month.'); return;
  }
  const rSheet = [['Date','Operator','Machine','Roll #','Time','Material','Result','Machine settings','Comments']];
  rolls.forEach(r => rSheet.push([r.date, r.name, m.label, r.roll, r.t, r.mat || '',
                                  normRes(r.result), r.set || '', r.note || '']));

  const dSheet = [['Date','Operator','Machine','Reason','Minutes','Hours','Comments']];
  downs.forEach(d => dSheet.push([d.date, d.name, m.label, d.reason,
                                  num(d.mins), Math.round(num(d.mins)/60*100)/100, d.note || '']));

  const uSheet = [['Date','Operator','Machine','Online (h)','Offline (h)','Availability %']];
  (upDays || []).forEach(d => uSheet.push([d.date, d.name, m.label,
    Math.round(d.up/60*100)/100, Math.round(d.down/60*100)/100,
    (d.up+d.down) ? Math.round(d.up/(d.up+d.down)*1000)/10 : '']));

  // per-day roll pass rate
  const byDay = {};
  const blank = () => ({n:0, pass:0, rej:0, q:0, down:0});
  rolls.forEach(r => {
    byDay[r.date] = byDay[r.date] || blank();
    const v = byDay[r.date]; v.n++;
    const res = normRes(r.result);
    if(res === 'Pass') v.pass++;
    else if(res === 'Rejected') v.rej++;
    else if(res === 'Questionable') v.q++;
  });
  downs.forEach(d => {
    byDay[d.date] = byDay[d.date] || blank();
    byDay[d.date].down += num(d.mins);
  });
  const sum1 = [['Date','Rolls','Passed','Rejected','Questionable','Pass rate %','Downtime (min)']];
  Object.keys(byDay).sort().forEach(d => {
    const v = byDay[d];
    sum1.push([d, v.n, v.pass, v.rej, v.q,
               v.n ? Math.round(v.pass / v.n * 1000)/10 : '', v.down]);
  });

  const tag = lmhWho === 'ALL' ? 'all' : lmhWho.replace(/[^\w]+/g,'-').toLowerCase();
  const base = 'corona-lmh-' + m.id + '-' + tag + '-' + lmhMonth;

  if(window.XLSX){
    const wb = XLSX.utils.book_new();
    const sh = (aoa, cols, name) => {
      const s = XLSX.utils.aoa_to_sheet(aoa);
      s['!cols'] = cols.map(w => ({wch:w}));
      XLSX.utils.book_append_sheet(wb, s, name);
    };
    sh(sum1,   [12,8,9,10,14,12,15],        'Daily summary');
    sh(uSheet, [12,20,11,11,11,14],         'Uptime');
    sh(statusSheet(statusRecs, m.label), statusCols(true), 'Status log');
    sh(rSheet, [12,20,11,9,8,14,9,40,40],   'Rolls');
    sh(dSheet, [12,20,11,22,10,9,40],       'Downtime');
    XLSX.writeFile(wb, base + '.xlsx');
    return;
  }
  const q = v => /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g,'""') + '"' : v;
  const csv = [...sum1, [], ...uSheet, [], ...statusSheet(statusRecs, m.label), [], ...rSheet, [], ...dSheet]
                .map(r => r.map(q).join(',')).join('\r\n');
  const url = URL.createObjectURL(new Blob(['\ufeff' + csv], {type:'text/csv;charset=utf-8'}));
  const a = document.createElement('a');
  a.href = url; a.download = base + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

/* ── Machine online / offline tracking ────── */
let statusTick = null;

// each toggle appends {state, at}; durations are the gaps between them
function segments(events, dateStr){
  if(!events || !events.length) return [];
  const today = iso(now);
  const cap = dateStr === today
    ? new Date()
    : new Date(dateStr + 'T23:59:59');
  const out = [];
  events.forEach((e,i) => {
    const from = new Date(e.at);
    const to   = events[i+1] ? new Date(events[i+1].at) : cap;
    const mins = Math.max(0, Math.floor((to - from) / 60000));
    out.push({state: e.state, from, to, mins, open: !events[i+1]});
  });
  return out;
}
const minsIn = (segs, state) =>
  segs.filter(s => s.state === state).reduce((a,s) => a + s.mins, 0);
const stateNow = events => events && events.length
  ? events[events.length-1].state : 'unknown';

function statusPanel(evs, dateStr){
  evs = evs || [];
  const segs = segments(evs, dateStr);
  const cur  = stateNow(evs);
  const up   = minsIn(segs, 'online');
  const down = minsIn(segs, 'offline');
  const span = up + down;
  const last = segs[segs.length-1];

  const lampCls = cur === 'online' ? 'up' : cur === 'offline' ? 'down' : '';
  const label   = cur === 'unknown' ? 'Not set' : cur === 'online' ? 'Online' : 'Offline';
  const since   = last
    ? (last.open ? 'Since ' + hhmm(last.from.toISOString()) + ' \u00b7 ' + asHrs(last.mins)
                 : 'Last change ' + hhmm(last.from.toISOString()))
    : 'No status recorded today';

  return '<div class="st-panel">' +
    '<div class="st-lamp ' + lampCls + '"><i></i><b>' + label + '</b></div>' +
    '<div class="st-since" id="st-since">' + since + '</div>' +

    (cur === 'online'
      ? '<button class="st-btn go-off" id="st-toggle">Set offline</button>'
      : '<button class="st-btn go-on"  id="st-toggle">Set online</button>') +

    '<div class="st-split">' +
      '<div class="st-cell up"><div class="cap">Online</div>' +
        '<div class="val" id="st-up">' + asHrs(up) + '</div></div>' +
      '<div class="st-cell down"><div class="cap">Offline</div>' +
        '<div class="val" id="st-down">' + asHrs(down) + '</div></div>' +
    '</div>' +

    (span
      ? '<div class="st-bar">' +
          '<i class="up" style="width:' + (up/span*100) + '%"></i>' +
          '<i class="down" style="width:' + (down/span*100) + '%"></i>' +
        '</div>'
      : '') +

    (segs.length
      ? '<div class="st-log">' +
          segs.map(s => hhmm(s.from.toISOString()) + '  <b>' +
            (s.state === 'online' ? 'Online' : 'Offline') + '</b>  ' +
            asHrs(s.mins) + (s.open ? ' \u2026' : '')).join('<br>') +
          '<button class="st-undo" id="st-undo">Undo last</button>' +
        '</div>'
      : '') +
  '</div>';
}

function wireStatus(ctx){
  const btn = document.getElementById('st-toggle');
  if(btn) btn.addEventListener('click', async () => {
    const cur = stateNow(ctx.get() || []);
    const next = cur === 'online' ? 'offline' : 'online';
    ctx.set((ctx.get() || []).concat([{state: next, at: new Date().toISOString()}]));
    await ctx.save(); ctx.redraw();
  });

  const undo = document.getElementById('st-undo');
  if(undo) undo.addEventListener('click', async () => {
    const a = (ctx.get() || []).slice(); a.pop(); ctx.set(a);
    await ctx.save(); ctx.redraw();
  });

  clearInterval(statusTick);
  if((ctx.get() || []).length && ctx.date === iso(now)){
    statusTick = setInterval(() => {
      const segs = segments(ctx.get() || [], ctx.date);
      const last = segs[segs.length-1];
      const u = document.getElementById('st-up'), d = document.getElementById('st-down'),
            s = document.getElementById('st-since');
      if(!u || !d){ clearInterval(statusTick); return; }
      u.textContent = asHrs(minsIn(segs,'online'));
      d.textContent = asHrs(minsIn(segs,'offline'));
      if(s && last && last.open)
        s.textContent = 'Since ' + hhmm(last.from.toISOString()) + ' \u00b7 ' + asHrs(last.mins);
    }, 1000);
  }
}


// Every online/offline change, one row per segment
function statusSheet(recs, machineLabel){
  const head = ['Date','Operator'];
  if(machineLabel) head.push('Machine');
  head.push('State','From','To','Minutes','Hours','Still open');
  const aoa = [head];
  (recs || []).forEach(r => {
    segments(r.events, r.date).forEach(s => {
      const row = [r.date, r.name];
      if(machineLabel) row.push(machineLabel);
      row.push(s.state === 'online' ? 'Online' : 'Offline',
               hhmm(s.from.toISOString()), hhmm(s.to.toISOString()),
               s.mins, Math.round(s.mins/60*100)/100, s.open ? 'yes' : '');
      aoa.push(row);
    });
  });
  return aoa;
}

// length of a stoppage from its clock times; wraps past midnight
function gapMins(start, end){
  if(!start || !end) return 0;
  const [sh,sm] = start.split(':').map(Number);
  const [eh,em] = end.split(':').map(Number);
  let m = (eh*60 + em) - (sh*60 + sm);
  if(m < 0) m += 1440;
  return m;
}

async function loadDwn(){
  dwn = {rows:[]};
  try{
    if(window.storage){
      const r = await window.storage.get(dwnKey());
      if(r && r.value) dwn = JSON.parse(r.value);
    } else if(memo[dwnKey()]) dwn = JSON.parse(memo[dwnKey()]);
  }catch(e){ /* nothing logged yet */ }
  if(!Array.isArray(dwn.rows)) dwn.rows = [];
  dwn.rows.forEach(d => {
    if(!d.start && d.t){                       // older row: one time plus a length
      d.start = d.t;
      const [hh,mm] = d.t.split(':').map(Number);
      const e = (hh*60 + mm + num(d.mins)) % 1440;
      d.end = String(Math.floor(e/60)).padStart(2,'0') + ':' + String(e%60).padStart(2,'0');
    }
  });

  // downtime used to live inside each machine sheet — pull it across
  let moved = false;
  for(const mc of MACHINES){
    const k = lmhKey(opId, mc.id, dwnDate || iso(now));
    let raw = memo[k];
    if(!raw && window.storage){
      try{ const g = await window.storage.get(k); raw = g && g.value; }catch(e){}
    }
    if(!raw) continue;
    try{
      const sheet = JSON.parse(raw);
      if(Array.isArray(sheet.down) && sheet.down.length){
        sheet.down.forEach(d => dwn.rows.push({...d, mac: mc.id}));
        sheet.down = [];
        const blob = JSON.stringify(sheet);
        await put(k, blob);
        moved = true;
      }
    }catch(e){}
  }
  if(moved) saveDwn();
}
async function saveDwn(){ return put(dwnKey(), JSON.stringify(dwn)); }

function seenReasons(){
  const out = new Set();
  Object.keys(memo).forEach(k => {
    if(!k.startsWith('dwn:') && !k.startsWith('snd:')) return;
    try{
      const r = JSON.parse(memo[k]);
      (r.rows || []).forEach(d => d.reason && out.add(d.reason));
      (r.down || []).forEach(d => d.reason && out.add(d.reason));
    }catch(e){}
  });
  return [...out].sort();
}

let dwnMonth = iso(now).slice(0,7), dwnWho = 'ALL';

async function allDwn(){
  const out = [];
  const take = (key, val) => {
    const [, id, date] = key.split(':');
    const name = nameOf(id);
    let r; try{ r = JSON.parse(val); }catch(e){ return; }
    (r.rows || []).forEach(d => out.push({name, date, ...d}));
  };
  try{
    if(window.storage){
      const list = await window.storage.list('dwn:');
      for(const k of (list && list.keys) || []){
        try{ const g = await window.storage.get(k); if(g) take(k, g.value); }catch(e){}
      }
    }
  }catch(e){}
  const seen = new Set(out.map(r => r.name + r.date));
  Object.keys(memo).filter(k => k.startsWith('dwn:')).forEach(k => {
    const [, id, date] = k.split(':');
    if(!seen.has(nameOf(id) + date)) take(k, memo[k]);
  });
  return out.sort((a,b) => a.date.localeCompare(b.date) || (a.start||'').localeCompare(b.start||''));
}

function exportDwn(scope, byReason, ranked, total){
  if(!scope.length){ alert('Nothing to export for this month.'); return; }

  const pareto = [['Reason','Events','Minutes','Hours','Share %']];
  ranked.forEach(k => pareto.push([k, byReason[k].n, byReason[k].mins,
    Math.round(byReason[k].mins/60*100)/100,
    total ? Math.round(byReason[k].mins/total*1000)/10 : 0]));
  pareto.push(['TOTAL', scope.length, total, Math.round(total/60*100)/100, 100]);

  const byMac = [['Machine','Events','Minutes','Hours']];
  MACHINES.forEach(m => {
    const rows = scope.filter(d => d.mac === m.id);
    const t = rows.reduce((a,d) => a + num(d.mins), 0);
    byMac.push([m.label, rows.length, t, Math.round(t/60*100)/100]);
  });

  const detail = [['Date','Operator','Machine','Start','End','Reason','Minutes','Hours','Comments']];
  scope.forEach(d => detail.push([d.date, d.name, macLabel(d.mac), d.start || '', d.end || '', d.reason,
    num(d.mins), Math.round(num(d.mins)/60*100)/100, d.note || '']));

  const tag = dwnWho === 'ALL' ? 'all' : dwnWho.replace(/[^\w]+/g,'-').toLowerCase();
  const base = 'corona-downtime-' + tag + '-' + dwnMonth;

  if(window.XLSX){
    const wb = XLSX.utils.book_new();
    const sh = (aoa, cols, name) => {
      const s = XLSX.utils.aoa_to_sheet(aoa);
      s['!cols'] = cols.map(w => ({wch:w}));
      XLSX.utils.book_append_sheet(wb, s, name);
    };
    sh(pareto, [24,9,10,9,10],           'By reason');
    sh(byMac,  [14,9,10,9],              'By machine');
    sh(detail, [12,20,12,8,8,24,10,9,40], 'Events');
    XLSX.writeFile(wb, base + '.xlsx');
    return;
  }
  const q = v => /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g,'""') + '"' : v;
  const csv = [...pareto, [], ...byMac, [], ...detail].map(r => r.map(q).join(',')).join('\r\n');
  const url = URL.createObjectURL(new Blob(['\ufeff' + csv], {type:'text/csv;charset=utf-8'}));
  const a = document.createElement('a');
  a.href = url; a.download = base + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

// books: [[aoa, colWidths, sheetName], ...]
function booksOut(books, base){
  if(window.XLSX){
    const wb = XLSX.utils.book_new();
    books.forEach(([aoa, cols, name]) => {
      const s = XLSX.utils.aoa_to_sheet(aoa);
      s['!cols'] = cols.map(w => ({wch:w}));
      XLSX.utils.book_append_sheet(wb, s, name);
    });
    XLSX.writeFile(wb, base + '.xlsx');
    return;
  }
  const q = v => /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g,'""') + '"' : v;
  const rows = [];
  books.forEach(([aoa], i) => { if(i) rows.push([]); aoa.forEach(r => rows.push(r)); });
  const csv = rows.map(r => r.map(q).join(',')).join('\r\n');
  const url = URL.createObjectURL(new Blob(['\ufeff' + csv], {type:'text/csv;charset=utf-8'}));
  const a = document.createElement('a');
  a.href = url; a.download = base + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
const sheetOut = (aoa, cols, name, base) => booksOut([[aoa, cols, name]], base);

    try{
      (JSON.parse(memo[k]).rows || []).forEach(r =>
        belts(r).forEach(b => b.grit && out.add(String(b.grit))));
    }catch(e){}
  });
  return [...out].sort((a,b) => (parseFloat(a)||0) - (parseFloat(b)||0));
}
function sndMaterials(){
  const out = new Set(['Natural','Black','STS']);
  Object.keys(memo).forEach(k => {
    if(!/^(snd|mix|flm|lmh):/.test(k)) return;
    try{
      const r = JSON.parse(memo[k]);
      (r.rows  || []).forEach(x => { if(x.mat) out.add(x.mat); });
      (r.rolls || []).forEach(x => { if(x.mat) out.add(x.mat); });
    }catch(e){}
  });
  return [...out].filter(Boolean).sort();
}

function readBelts(){
  const g = [...document.querySelectorAll('.bl-grit')];
  const c = [...document.querySelectorAll('.bl-count')];
  beltDraft = g.map((x,i) => ({grit: x.value, count: c[i] ? c[i].value : ''}));
  if(!beltDraft.length) beltDraft = [{grit:'', count:''}];
}
function paintBelts(){
  const host = document.getElementById('bl-lines');
  if(!host) return;
  host.innerHTML = beltDraft.map((b,i) =>
    '<div class="rz-line">' +
      '<input class="rz-name bl-grit" list="d-grit" placeholder="Grit" value="' + esc(b.grit) + '">' +
      '<input class="rz-bags bl-count" inputmode="numeric" placeholder="Belts" value="' + esc(b.count) + '">' +
      '<button class="rz-x" data-bi="' + i + '"' + (beltDraft.length < 2 ? ' disabled' : '') +
        ' aria-label="Remove belt">\u2715</button>' +
    '</div>').join('');
  host.querySelectorAll('.rz-x').forEach(b =>
    b.addEventListener('click', () => {
      readBelts();

}

let sndMonth = iso(now).slice(0,7), sndWho = 'ALL';

async function allSnd(){
  const out = [];
  const take = (key, val) => {
    const [, id, date] = key.split(':');
    const name = nameOf(id);
    let r; try{ r = JSON.parse(val); }catch(e){ return; }
    (r.rows     || []).forEach(x => out.push({kind:'row',  name, date, ...x}));
    (r.down     || []).forEach(x => out.push({kind:'down', name, date, ...x}));
    (r.comments || []).forEach(x => out.push({kind:'comm', name, date, ...x}));
    if(Array.isArray(r.status) && r.status.length)
      out.push({kind:'status', name, date, events:r.status});
  };
  try{
    if(window.storage){
      const list = await window.storage.list('snd:');
      for(const k of (list && list.keys) || []){
        try{ const g = await window.storage.get(k); if(g) take(k, g.value); }catch(e){}
      }
    }
  }catch(e){}
  const seen = new Set(out.map(r => r.name + r.date));
  Object.keys(memo).filter(k => k.startsWith('snd:')).forEach(k => {
    const [, id, date] = k.split(':');
    if(!seen.has(nameOf(id) + date)) take(k, memo[k]);
  });
  return out.sort((a,b) => a.date.localeCompare(b.date) ||
                           ((a.t||a.start||'').localeCompare(b.t||b.start||'')));
}

function exportSnd(scope, byGrit, grits, upDays, notes, statusRecs){
  if(!scope.length && !(upDays || []).length && !(notes || []).length){
    alert('Nothing to export for this month.'); return;
  }
  const beltTxt = r => belts(r).map(b => b.grit + (num(b.count) ? ' \u00d7' + num(b.count) : '')).join(' + ');

  const daily = {};
  scope.forEach(r => {
    const k = r.date + '|' + r.name;
    daily[k] = daily[k] || {done:0, belts:0, under:0, todo:0};
    daily[k].done += num(r.done); daily[k].belts += beltCount(r);
    daily[k].under = num(r.under); daily[k].todo = num(r.todo);   // closing snapshot
  });
  const dSheet = [['Date','Operator','Rolls completed','Under process (end)',
                   'Not processed (end)','Belts used']];
  Object.keys(daily).sort().forEach(k => {
    const [d,n] = k.split('|'), v = daily[k];
    dSheet.push([d, n, v.done, v.under, v.todo, v.belts]);
  });
  dSheet.push(['TOTAL','', scope.reduce((a,r) => a + num(r.done), 0), '', '',
               scope.reduce((a,r) => a + beltCount(r), 0)]);

  const gSheet = [['Grit','Times used','Belts used']];
  grits.forEach(g => gSheet.push([g, byGrit[g].n, byGrit[g].count]));

  const uSheet = [['Date','Operator','Online (h)','Offline (h)','Availability %']];
  (upDays || []).forEach(d => uSheet.push([d.date, d.name,
    Math.round(d.up/60*100)/100, Math.round(d.down/60*100)/100,
    (d.up+d.down) ? Math.round(d.up/(d.up+d.down)*1000)/10 : '']));

  const eSheet = [['Date','Operator','Time','Material','Rolls completed','Under process','Not processed','Belts']];
  scope.forEach(r => eSheet.push([r.date, r.name, r.t, r.mat || '',
                                  num(r.done), num(r.under), num(r.todo), beltTxt(r)]));

  const bSheet = [['Date','Operator','Time','Grit','Belts used']];
  scope.forEach(r => belts(r).forEach(b =>
    bSheet.push([r.date, r.name, r.t, b.grit, num(b.count)])));

  const cSheet = [['Date','Operator','Time','Subject','Comment']];
  (notes || []).forEach(c => cSheet.push([c.date, c.name, c.t, c.tag || '', c.text]));

  booksOut([
    [dSheet, [12,20,16,19,20,12], 'Daily totals'],
    [gSheet, [10,13,12],          'By grit'],
    [uSheet, [12,20,11,11,14],    'Uptime'],
    [statusSheet(statusRecs), statusCols(false), 'Status log'],
    [eSheet, [12,20,8,14,16,15,15,24],'Entries'],
    [bSheet, [12,20,8,10,12],     'Belt lines'],
    [cSheet, [12,20,8,20,60],     'Comments']
  ], 'corona-sanding-' + (sndWho === 'ALL' ? 'all' :
      sndWho.replace(/[^\w]+/g,'-').toLowerCase()) + '-' + sndMonth);
}

  {id:'sheet', label:'Flamer Machine', blurb:'Status, rolls treated, and results.'},

];

async function loadFlm(){
  flm = {rolls:[], status:[], down:[], peel:[], todo:0};
  try{
    if(window.storage){
      const r = await window.storage.get(flmKey());
      if(r && r.value) flm = JSON.parse(r.value);
    } else if(memo[flmKey()]) flm = JSON.parse(memo[flmKey()]);
  }catch(e){ /* nothing logged yet */ }
  ['rolls','status','down','peel'].forEach(k => { if(!Array.isArray(flm[k])) flm[k] = []; });
  flm.todo = num(flm.todo);
}
const saveFlm = () => put(flmKey(), JSON.stringify(flm));

const flmDateBar = () => {
  const today = iso(now);
  return '<div class="mx-date">' +
    '<label for="fl-date">Sheet date</label>' +
    '<input id="fl-date" type="date" value="' + flmDate + '" max="' + today + '">' +
    (flmDate !== today ? '<button class="back-today" id="fl-today">Today</button>' : '') +
  '</div>';
};
function wireFlmDate(redraw){
  const today = iso(now);
  const dt = document.getElementById('fl-date');
  if(dt) dt.addEventListener('change', async () => {
    clearInterval(statusTick);
    flmDate = dt.value || today; await loadFlm(); redraw();
  });

  if(bt) bt.addEventListener('click', async () => {

async function openFlmPage(pg){
  backTo = renderFlmMenu;
  clearInterval(statusTick);
  $('page-title').textContent = pg.label;
  $('to-menu').textContent    = '\u2190 Flamer';
  $('page-who').textContent   = role === 'admin' ? 'All operators' : 'Flamer \u00b7 ' + operator;

  if(role === 'admin'){
    if(pg.id === 'sheet') await renderFlmAdmin();
    if(pg.id === 'peel')  await renderFlmPeelAdmin();
    if(pg.id === 'down')  await renderFlmDownAdmin();
    show('s-page'); return;

  await loadFlm();
  if(pg.id === 'sheet') renderFlm();
  if(pg.id === 'peel')  renderFlmPeel();
  if(pg.id === 'down')  renderFlmDown();
  show('s-page');
}

let flmMonth = iso(now).slice(0,7), flmWho = 'ALL';

async function allFlm(){
  const out = [];
  const take = (key, val) => {
    const [, id, date] = key.split(':');
    const name = nameOf(id);
    let r; try{ r = JSON.parse(val); }catch(e){ return; }
    (r.rolls || []).forEach(x => out.push({kind:'roll', name, date, ...x}));
    (r.down  || []).forEach(x => out.push({kind:'down', name, date, ...x}));
    (r.peel  || []).forEach(x => out.push({kind:'peel', name, date, ...x}));
    if(Array.isArray(r.status) && r.status.length)
      out.push({kind:'status', name, date, events:r.status});
    if(num(r.todo)) out.push({kind:'todo', name, date, todo:num(r.todo)});
  };
  try{
    if(window.storage){
      const list = await window.storage.list('flm:');
      for(const k of (list && list.keys) || []){
        try{ const g = await window.storage.get(k); if(g) take(k, g.value); }catch(e){}
      }
    }
  }catch(e){}
  const seen = new Set(out.map(r => r.name + r.date));
  Object.keys(memo).filter(k => k.startsWith('flm:')).forEach(k => {
    const [, id, date] = k.split(':');
    if(!seen.has(nameOf(id) + date)) take(k, memo[k]);
  });
  return out.sort((a,b) => a.date.localeCompare(b.date) ||
                           ((a.t||a.start||'').localeCompare(b.t||b.start||'')));
}

// Storage holds text, so the file is base64'd into its own key and the
// day record keeps only the metadata. Keeps day saves small and fast.
const kb = n => n < 1024*1024
  ? Math.round(n/1024) + ' KB'
  : Math.round(n/1024/1024*10)/10 + ' MB';

function readAsBase64(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1] || '');
    r.onerror = () => rej(new Error('Could not read the file'));
    r.readAsDataURL(file);
  });
}

async function fetchFile(id, shared){
  if(memo[fileKey(id)]) return memo[fileKey(id)];
  if(window.storage){
    try{
      const g = await window.storage.get(fileKey(id), !!shared);
      if(g && g.value != null){ memo[fileKey(id)] = g.value; return g.value; }
    }catch(e){}
  }
  return null;
}

async function downloadFile(meta){
  const b64 = await fetchFile(meta.id, meta.shared);
  if(!b64){ alert('That file is no longer available on this device.'); return; }
  try{
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([bytes], {type: meta.type || 'application/octet-stream'}));
    const a = document.createElement('a');
    a.href = url; a.download = meta.name;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }catch(e){ alert('That file could not be opened.'); }
}

/* ── Sample photos ────────────────────────── */
// Phone photos run 2–5 MB, far too big for text storage, so every image is
// scaled down and re-encoded as JPEG before it is saved.
const IMG_MAX_PX = 1280, IMG_QUALITY = 0.72;
let pendingImg = null;                    // {b64, name, size} for the sample being added

function shrinkImage(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight;
      const scale = Math.min(1, IMG_MAX_PX / Math.max(w, h));
      w = Math.max(1, Math.round(w * scale));
      h = Math.max(1, Math.round(h * scale));
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      const b64 = c.toDataURL('image/jpeg', IMG_QUALITY).split(',')[1] || '';
      res({b64, w, h, size: Math.round(b64.length * 0.75)});
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Could not read image')); };
    img.src = url;
  });
}

function lightbox(src, caption){
  let el = document.getElementById('lightbox');
  if(!el){
    el = document.createElement('div');
    el.id = 'lightbox';
    el.innerHTML = '<button class="lb-x" aria-label="Close">\u2715</button>' +
                   '<img alt=""><div class="lb-cap"></div>';
    document.body.appendChild(el);
    const close = () => el.classList.remove('on');
    el.addEventListener('click', e => { if(e.target === el) close(); });
    el.querySelector('.lb-x').addEventListener('click', close);
    document.addEventListener('keydown', e => { if(e.key === 'Escape') close(); });
  }
  el.querySelector('img').src = 'data:image/jpeg;base64,' + src;
  el.querySelector('.lb-cap').textContent = caption || '';
  el.classList.add('on');
}

async function showPhoto(meta){
  const b64 = await fetchFile(meta.id);
  if(!b64){ alert('That photo is no longer available on this device.'); return; }
  lightbox(b64, meta.label || '');
}

// fills in thumbnails after the table has rendered
async function paintThumbs(){
  const cells = [...document.querySelectorAll('[data-thumb]')];
  for(const c of cells){
    const b64 = await fetchFile(c.dataset.thumb);
    if(!b64){ c.textContent = '\u2013'; continue; }
    const im = document.createElement('img');
    im.className = 'thumb';
    im.src = 'data:image/jpeg;base64,' + b64;
    im.alt = 'Sample photo';
    im.addEventListener('click', () => lightbox(b64, c.dataset.label || ''));
    c.innerHTML = '';
    c.appendChild(im);
  }
}

let quaMonth = iso(now).slice(0,7), quaWho = 'ALL';

async function allQua(){
  const out = [];
  const take = (key, val) => {
    const [, id, date] = key.split(':');
    const name = nameOf(id);
    let r; try{ r = JSON.parse(val); }catch(e){ return; }
    (r.samples  || []).forEach(x => out.push({kind:'samp', name, date, ...x}));
    (r.comments || []).forEach(x => out.push({kind:'comm', name, date, ...x}));
    // x.name is the filename, so the operator goes in `by`
    (r.files    || []).forEach(x => out.push({kind:'file', by:name, date, ...x}));
  };
  try{
    if(window.storage){
      const list = await window.storage.list('qua:');
      for(const k of (list && list.keys) || []){
        try{ const g = await window.storage.get(k); if(g) take(k, g.value); }catch(e){}
      }
    }
  }catch(e){}
  const seen = new Set(out.map(r => (r.by || r.name) + r.date));
  Object.keys(memo).filter(k => k.startsWith('qua:')).forEach(k => {
    const [, id, date] = k.split(':');
    if(!seen.has(nameOf(id) + date)) take(k, memo[k]);
  });
  return out.sort((a,b) => a.date.localeCompare(b.date) || (a.t||'').localeCompare(b.t||''));
}

  {id:'log',  label:'Maintenance Logs',  blurb:'Work carried out, by machine and time.'},
  {id:'pend', label:'Pending Work',      blurb:'Planned jobs for the month and their status.'}
];

  {v:'Pending',       cls:'r-rej'},
  {v:'Under process', cls:'r-q'},
  {v:'Complete',      cls:'r-pass'}
];
const jobTag = v => v === 'Complete' ? 'tag-pass' : v === 'Under process' ? 'tag-q' : 'tag-fail';

function plantMachines(){
  const out = new Set(['LMH Machine 2','LMH Machine 3','Sander','Flamer','Mixer']);
  Object.keys(memo).forEach(k => {
    if(!k.startsWith('mnt:') && !k.startsWith('mpw:')) return;
    try{
      const r = JSON.parse(memo[k]);
      (r.logs || []).forEach(x => { if(x.machine) out.add(x.machine); });
      (r.jobs || []).forEach(x => { if(x.machine) out.add(x.machine); });
    }catch(e){}
  });
  return [...out].sort();
}

async function loadMnt(){
  mnt = {logs:[]};
  const raw = await grab(mntKey());
  if(raw){ try{ mnt = JSON.parse(raw); }catch(e){} }
  if(!Array.isArray(mnt.logs)) mnt.logs = [];
}
const saveMnt = () => put(mntKey(), JSON.stringify(mnt));

async function loadPend(){
  pend = {jobs:[]};
  const raw = await grab(pendKey(), true);
  if(raw){ try{ pend = JSON.parse(raw); }catch(e){} }
  if(!Array.isArray(pend.jobs)) pend.jobs = [];
}

function dueLabel(target){
  if(!target) return '';
  const today = new Date(iso(now) + 'T00:00:00');
  const d = new Date(target + 'T00:00:00');
  const days = Math.round((d - today) / 86400000);
  if(days < 0)  return {txt: Math.abs(days) + 'd overdue', cls: 'due-late'};
  if(days === 0) return {txt: 'Due today', cls: 'due-soon'};
  if(days <= 3) return {txt: 'In ' + days + 'd', cls: 'due-soon'};
  return {txt: 'In ' + days + 'd', cls: ''};
}

let mntMonth = iso(now).slice(0,7), mntWho = 'ALL';

async function allMnt(){
  const out = [];
  const take = (key, val) => {
    const [, id, date] = key.split(':');
    const name = nameOf(id);
    let r; try{ r = JSON.parse(val); }catch(e){ return; }
    (r.logs || []).forEach(x => out.push({name, date, ...x}));
  };
  try{
    if(window.storage){
      const list = await window.storage.list('mnt:');
      for(const k of (list && list.keys) || []){
        try{ const g = await window.storage.get(k); if(g) take(k, g.value); }catch(e){}
      }
    }
  }catch(e){}
  const seen = new Set(out.map(r => r.name + r.date));
  Object.keys(memo).filter(k => k.startsWith('mnt:')).forEach(k => {
    const [, id, date] = k.split(':');
    if(!seen.has(nameOf(id) + date)) take(k, memo[k]);
  });
  return out.sort((a,b) => a.date.localeCompare(b.date) || (a.start||'').localeCompare(b.start||''));
}

    rows.forEach(r => dSheet.push([r.date, r.name, r.machine, r.start, r.end,
      num(r.mins), Math.round(num(r.mins)/60*100)/100, r.note || '']));
    const pSheet = [['Job','Machine','Target date','Status','Added by','Comments']];
    (pend.jobs || []).forEach(j => pSheet.push([j.title, j.machine || '', j.due || '',
      j.state, j.by || '', j.note || '']));
    booksOut([[mSheet,[20,8,10,9,10],'By machine'],
              [dSheet,[12,20,18,8,8,10,9,44],'Logs'],
              [pSheet,[38,18,13,15,18,44],'Pending work']],
      'corona-maintenance-' + (mntWho === 'ALL' ? 'all' :
       mntWho.replace(/[^\w]+/g,'-').toLowerCase()) + '-' + mntMonth);
  });
}

/* ── Store (shared across the plant) ──────── */
let stock = {items:[]}, needs = {items:[]}, mach = {items:[]};
const stockKey = 'stk:all', needKey = 'req:all', machKey = 'mch:all';
const STORE_CATS = ['Sander','LMH','Mixing','Flamer','General'];
const catOf = i => STORE_CATS.includes(i.cat) ? i.cat : 'General';

const STORE_PAGES = [
  {id:'have', label:'Items Available', blurb:'What the store is holding right now.'},
  {id:'mach', label:'Machine Inventory', blurb:'Parts and spares held against each machine.'},
  {id:'need', label:'Items Needed',    blurb:'Requests for restock or purchase.'}
];

async function loadStore(){
  stock = {items:[]}; needs = {items:[]}; mach = {items:[]};
  const a = await grab(stockKey, true);
  if(a){ try{ stock = JSON.parse(a); }catch(e){} }
  const b = await grab(needKey, true);
  if(b){ try{ needs = JSON.parse(b); }catch(e){} }
  const c = await grab(machKey, true);
  if(c){ try{ mach = JSON.parse(c); }catch(e){} }
  [stock, needs, mach].forEach(o => { if(!Array.isArray(o.items)) o.items = []; });
}
const saveStock = () => put(stockKey, JSON.stringify(stock), true);
const saveNeeds = () => put(needKey,  JSON.stringify(needs), true);
const saveMach  = () => put(machKey,  JSON.stringify(mach),  true);

function storeItems(){
  const out = new Set();
  [stock, needs, mach].forEach(o =>
    o.items.forEach(i => i.name && out.add(i.name)));
  return [...out].sort();
}
const isLow = i => num(i.min) > 0 && num(i.qty) <= num(i.min);

async function renderStoreMenu(){
  backTo = () => show('s-app');
  $('page-title').textContent = 'Store';
  $('page-who').textContent   = role === 'admin' ? 'Shared \u00b7 all operators' : operator;
  $('to-menu').textContent    = '\u2190 Menu';
  await loadStore();

  $('page-body').innerHTML = '<div class="menu fresh" id="store-list"></div>';
  const host = document.getElementById('store-list');
  const low = stock.items.filter(isLow).length;
  const lowM = mach.items.filter(isLow).length;
  const open = needs.items.length;

  STORE_PAGES.forEach((pg,i) => {
    const flag = pg.id === 'have' ? low : pg.id === 'mach' ? lowM : open;
    const chip = pg.id === 'have' ? (low  ? low  + ' low' : stock.items.length + ' items')
               : pg.id === 'mach' ? (lowM ? lowM + ' low' : mach.items.length + ' items')
               : (open ? open + ' listed' : 'None');
    const b = document.createElement('button');
    b.className = 'row' + (flag ? '' : ' done');
    b.innerHTML =
      '<span class="num">' + String(i+1).padStart(2,'0') + '</span>' +
      '<span class="body"><span class="label">' + pg.label + '</span>' +
      '<span class="blurb">' + pg.blurb + '</span></span>' +
      '<span class="state"><i></i>' + chip + '</span>' +
      '<span class="chev">\u203a</span>';
    b.style.animationDelay = (i * 55) + 'ms';
    b.addEventListener('click', () => openStorePage(pg));
    host.appendChild(b);
  });
  show('s-page');
}

async function openStorePage(pg){
  backTo = renderStoreMenu;
  $('page-title').textContent = pg.label;
  $('to-menu').textContent    = '\u2190 Store';
  $('page-who').textContent   = 'Shared list';
  await loadStore();
  if(pg.id === 'have') renderStock();
  else if(pg.id === 'mach') renderMach();
  else renderNeeds();
  show('s-page');
}

  items.forEach((it,i) => grouped[catOf(it)].push({...it, _i:i}));

  const block = cat => {
    const rows = grouped[cat];
    const lowN = rows.filter(isLow).length;

    // sections with nothing low start collapsed to keep the page short

    return '<div class="blk' + (blkShut[key] ? ' shut' : '') + '" data-blk="' + key + '">' +
      '<button class="blk-head"><span class="b-lbl">' + cat + ' items</span>' +
      '<span class="b-cnt">' + (rows.length ? rows.length + ' held' : 'none') +
        (lowN ? ' \u00b7 ' + lowN + ' low' : '') + '</span>' +
      '<span class="b-arw">\u25bc</span></button>' +
      '<div class="blk-body">' +
        (rows.length
          ? '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
              '<th>Item</th><th class="r">Qty</th><th class="r">Reorder</th>' +
              '<th>Comments</th><th></th></tr></thead><tbody>' +
            rows.map(it =>
              '<tr' + (isLow(it) ? ' class="low-row"' : '') + '>' +
              '<td class="who-cell">' + esc(it.name) +
                (isLow(it) ? ' <span class="chip-low">low</span>' : '') + '</td>' +
              '<td class="r"><input class="qty-in" data-qty="' + it._i + '" inputmode="decimal" value="' +
                tidy(num(it.qty)) + '"></td>' +
              '<td class="r">' + (num(it.min) ? tidy(num(it.min)) : '\u2013') + '</td>' +
              '<td class="note-cell">' + (esc(it.note) || '\u2013') + '</td>' +
              '<td class="r"><button class="mx-del" data-sd="' + it._i +
              '" aria-label="Remove item">\u2715</button></td></tr>').join('') +
            '</tbody></table></div>'
          : '<div class="empty">Nothing in this section</div>') +

  $('page-body').innerHTML =
    '<div class="mx">' +
      dlist('d-item', storeItems()) +
      '<div class="sums">' +
        '<div class="sum"><div class="cap">Items</div><div class="val">' + items.length + '</div></div>' +
        '<div class="sum ot" style="grid-column:span 2"><div class="cap">Below reorder level</div>' +
          '<div class="val">' + low.length + '</div></div>' +
      '</div>' +

      '<div class="blk' + (blkShut[cfg.tag + 'add'] ? ' shut' : '') + '" data-blk="' + cfg.tag + 'add">' +
        '<button class="blk-head"><span class="b-lbl">Add item</span>' +
        '<span class="b-cnt">' + items.length + ' held</span>' +
        '<span class="b-arw">\u25bc</span></button>' +
        '<div class="blk-body">' +
          '<div class="fld"><label for="st-cat">Section</label>' +
            '<select id="st-cat">' + STORE_CATS.map(c =>
              '<option value="' + c + '">' + c + ' items</option>').join('') + '</select></div>' +
          '<div class="fld"><label for="st-name">Item</label>' +
            '<input id="st-name" list="d-item" placeholder="' + cfg.hint + '"></div>' +
          '<div class="two">' +
            '<div class="fld"><label for="st-qty">Quantity</label>' +
              '<input id="st-qty" class="mono" inputmode="decimal" placeholder="0"></div>' +
            '<div class="fld"><label for="st-min">Reorder at</label>' +
              '<input id="st-min" class="mono" inputmode="decimal" placeholder="0"></div>' +
          '</div>' +
          '<div class="fld"><label for="st-note">Comments</label>' +
            '<textarea id="st-note" placeholder="Where it is kept, supplier, anything useful"></textarea></div>' +
          '<button class="mx-save" id="st-add">Add item</button>' +
          '<div class="mx-warn" id="st-warn"></div>' +
        '</div>' +
      '</div>' +

      '<div style="margin-top:12px">' + STORE_CATS.map(block).join('') + '</div>' +

      (role === 'admin'
        ? '<div class="tools"><button class="tool go" id="st-xls">\u2193 Download Excel</button></div>'
        : '') +
      '<div class="rc-note">Shared list \u00b7 quantities save as you change them</div>' +
    '</div>';

  document.querySelectorAll('.blk-head').forEach(b =>
    b.addEventListener('click', () => {
      const k = b.parentElement.dataset.blk;
      blkShut[k] = !blkShut[k];
      b.parentElement.classList.toggle('shut', blkShut[k]);

  document.getElementById('st-add').addEventListener('click', async () => {
    const v = id => document.getElementById(id).value;

  const xls = document.getElementById('st-xls');
  if(xls) xls.addEventListener('click', () => {
    if(!items.length){ alert('Nothing to export.'); return; }

    STORE_CATS.forEach(c => items.filter(i => catOf(i) === c).forEach(i =>
      aoa.push([c, i.name, num(i.qty), num(i.min) || '', isLow(i) ? 'yes' : '', i.note || ''])));
    sheetOut(aoa, [14,30,10,12,14,44], cfg.label, cfg.file + '-' + iso(now));
  });
}

let pos = {orders:[]}, poMonth = iso(now).slice(0,7);
let poOpen = false, poPin = '';
const poKey = m => 'po:' + (m || poMonth);

async function loadPO(){
  pos = {orders:[]};
  const raw = await grab(poKey(), true);
  if(raw){ try{ pos = JSON.parse(raw); }catch(e){} }
  if(!Array.isArray(pos.orders)) pos.orders = [];
}
const savePO = () => put(poKey(), JSON.stringify(pos), true);

function renderPOLock(msg){
  $('page-body').innerHTML =
    '<div class="lockwrap">' +
      '<div class="lk-ico">\u26bf</div>' +
      '<h3>Locked</h3>' +
      '<p>Enter the purchase order code</p>' +
      '<div class="readout" id="po-dots">' +
        Array.from({length: CODE_LEN}, () => '<div class="cell"><span></span></div>').join('') +
      '</div>' +
      '<div class="err" id="po-err">' + (msg || '') + '</div>' +
      '<div class="keys">' +
        [1,2,3,4,5,6,7,8,9].map(n => '<button class="key po-k">' + n + '</button>').join('') +
        '<button class="key fn" id="po-clr">Clear</button>' +
        '<button class="key po-k">0</button>' +
        '<button class="key ok" id="po-ent">Enter</button>' +
      '</div>' +
    '</div>';

  const paintPin = () => document.querySelectorAll('#po-dots .cell')
    .forEach((c,i) => c.classList.toggle('set', i < poPin.length));
  paintPin();

  document.querySelectorAll('.po-k').forEach(k =>
    k.addEventListener('click', () => {
      if(poPin.length < CODE_LEN){ poPin += k.textContent; paintPin();
        document.getElementById('po-err').textContent = ''; }
    }));
  document.getElementById('po-clr').addEventListener('click', () => {
    poPin = ''; paintPin(); document.getElementById('po-err').textContent = '';
  });
  document.getElementById('po-ent').addEventListener('click', () => {
    if(poPin.length < CODE_LEN){ renderPOLock('Enter all ' + CODE_LEN + ' digits'); return; }
    if(poPin !== PO_CODE){
      poPin = '';
      const d = document.getElementById('po-dots');
      d.classList.add('bad'); setTimeout(() => d.classList.remove('bad'), 360);
      renderPOLock('Code not recognised');
      return;
    }
    poPin = ''; poOpen = true; renderPO();
  });

  show('s-page');
}

    const v = id => document.getElementById(id).value;
    const warn = document.getElementById('po-warn');
    const inp = document.getElementById('po-file');
    const file = inp.files && inp.files[0];
    warn.textContent = '';

    if(!v('po-num').trim()){ warn.textContent = 'Enter the PO number'; return; }

    if(file.size > MAX_UPLOAD){
      warn.textContent = 'File is ' + kb(file.size) + ' \u2014 limit is ' + kb(MAX_UPLOAD); return;
    }
    try{
      const b64 = await readAsBase64(file);
      const id = 'p' + Date.now() + Math.random().toString(36).slice(2,7);
      const ok = await put(fileKey(id), b64, true);
      pos.orders.push({id, po: v('po-num').trim(), cust: v('po-cust').trim(),

                       day: iso(now), by: operator, shared: true});

    }catch(e){ warn.textContent = 'Could not read that file'; }
  });

  document.querySelectorAll('[data-podl]').forEach(b =>
    b.addEventListener('click', () => downloadFile(pos.orders[+b.dataset.podl])));

  document.querySelectorAll('[data-porm]').forEach(b =>

// inclusive span, so a single day counts as one
function spanDays(from, to){
  if(!from || !to) return 0;
  const a = new Date(from + 'T00:00:00'), b = new Date(to + 'T00:00:00');
  const d = Math.round((b - a) / 86400000) + 1;
  return d > 0 ? d : 0;
}
const stamp = () => {
  const d = new Date();
  return iso(d) + ' ' + String(d.getHours()).padStart(2,'0') + ':' +
         String(d.getMinutes()).padStart(2,'0');
};

async function allLeave(field){
  const out = [];
  const take = (key, val) => {
    const oid = key.split(':')[1];
    let r; try{ r = JSON.parse(val); }catch(e){ return; }
    (r[field] || []).forEach(x => out.push({oid, name: nameOf(oid), ...x}));
  };
  try{
    if(window.storage){
      const list = await window.storage.list('lv:', true);
      for(const k of (list && list.keys) || []){
        try{ const g = await window.storage.get(k, true); if(g) take(k, g.value); }catch(e){}
      }
    }
  }catch(e){}
  const seenKeys = new Set(out.map(r => 'lv:' + r.oid));
  Object.keys(memo).filter(k => k.startsWith('lv:') && !seenKeys.has(k))
    .forEach(k => take(k, memo[k]));
  return out.sort((a,b) => (a.from||'').localeCompare(b.from||''));
}

// write a decision back into that operator's own record
async function decideLeave(row, field, state){
  const key = 'lv:' + row.oid;
  let rec = {travel:[], days:[]};
  const raw = await grab(key, true);
  if(raw){ try{ rec = JSON.parse(raw); }catch(e){} }
  if(!Array.isArray(rec[field])) rec[field] = [];

  const hit = rec[field].find(x =>
    row.id ? x.id === row.id
           : (x.from === row.from && x.to === row.to && x.at === row.at));
  if(!hit) return false;

  hit.state   = state;
  hit.by      = operator;
  hit.decided = stamp();
  await put(key, JSON.stringify(rec), true);
  if(row.oid === opId) lv = rec;            // keep our own copy in step
  return true;
}

    if(!r || (!r.run && !REP_QS.some(q => (r[q.k] || '').trim()))) return;
    out.push({oid:id, name:nameOf(id), date, ...r});

  try{
    if(window.storage){
      const list = await window.storage.list('rep:');
      for(const k of (list && list.keys) || []){
        try{ const g = await window.storage.get(k); if(g) take(k, g.value); }catch(e){}

  const seen = new Set(out.map(r => r.oid + r.date));
  Object.keys(memo).filter(k => k.startsWith('rep:')).forEach(k => {
    const [, id, date] = k.split(':');
    if(!seen.has(id + date)) take(k, memo[k]);
  });
  return out.sort((a,b) => b.date.localeCompare(a.date));   // newest first
}

  {id:'wst',  label:'Wastage',      blurb:'Pallet weight wasted.'},
  {id:'rrep', label:'Reports',      blurb:'Monthly scrap report spreadsheets.'}
];

async function loadScr(){
  scr = {rolls:[], waste:[]};
  const raw = await grab(scrKey());
  if(raw){ try{ scr = JSON.parse(raw); }catch(e){} }
  ['rolls','waste'].forEach(k => { if(!Array.isArray(scr[k])) scr[k] = []; });
}
const saveScr = () => put(scrKey(), JSON.stringify(scr));

async function loadScrRep(){
  scrRep = {files:[]};
  const raw = await grab(scrRepKey(), true);
  if(raw){ try{ scrRep = JSON.parse(raw); }catch(e){} }
  if(!Array.isArray(scrRep.files)) scrRep.files = [];
}
const saveScrRep = () => put(scrRepKey(), JSON.stringify(scrRep), true);

const scrDateBar = () => {
  const today = iso(now);
  return '<div class="mx-date">' +
    '<label for="sc-date">Sheet date</label>' +
    '<input id="sc-date" type="date" value="' + scrDate + '" max="' + today + '">' +
    (scrDate !== today ? '<button class="back-today" id="sc-today">Today</button>' : '') +
  '</div>';
};
function wireScrDate(redraw){
  const today = iso(now);
  const dt = document.getElementById('sc-date');
  if(dt) dt.addEventListener('change', async () => {
    scrDate = dt.value || today; await loadScr(); redraw();
  });
  const bt = document.getElementById('sc-today');
  if(bt) bt.addEventListener('click', async () => {
    scrDate = today; await loadScr(); redraw();
  });
}

async function renderScrapMenu(){
  backTo = () => show('s-app');
  if(!scrDate) scrDate = iso(now);
  $('page-title').textContent = 'Scrap';
  $('page-who').textContent   = role === 'admin' ? 'All operators' : operator + ' \u00b7 ' + shift;
  $('to-menu').textContent    = '\u2190 Menu';
  if(role !== 'admin') await loadScr();
  await loadScrRep();

  $('page-body').innerHTML = '<div class="menu fresh" id="scr-list"></div>';
  const host = document.getElementById('scr-list');
  const filled = {rej: scr.rolls.length, wst: scr.waste.length, rrep: scrRep.files.length};

  SCRAP_PAGES.forEach((pg,i) => {
    const n = role === 'admin' ? 0 : filled[pg.id];
    const b = document.createElement('button');
    b.className = 'row' + (n ? ' done' : '');
    b.innerHTML =
      '<span class="num">' + String(i+1).padStart(2,'0') + '</span>' +
      '<span class="body"><span class="label">' + pg.label + '</span>' +
      '<span class="blurb">' + pg.blurb + '</span></span>' +
      (role === 'admin' ? '' :
        '<span class="state"><i></i>' + (n ? n + ' logged' : 'Empty') + '</span>') +
      '<span class="chev">\u203a</span>';
    b.style.animationDelay = (i * 55) + 'ms';
    b.addEventListener('click', () => openScrapPage(pg));
    host.appendChild(b);
  });
  show('s-page');
}

async function openScrapPage(pg){
  backTo = renderScrapMenu;
  $('page-title').textContent = pg.label;
  $('to-menu').textContent    = '\u2190 Scrap';
  $('page-who').textContent   = role === 'admin' ? 'All operators' : 'Scrap \u00b7 ' + operator;

  if(pg.id === 'rrep'){ await loadScrRep(); renderScrRep(); show('s-page'); return; }
  if(role === 'admin'){
    if(pg.id === 'rej') await renderRejAdmin(); else await renderWstAdmin();
    show('s-page'); return;
  }
  await loadScr();
  if(pg.id === 'rej') renderRej(); else renderWst();
  show('s-page');
}

          scr.rolls.length + '</div></div>' +
        '<div class="sum ot" style="grid-column:span 2"><div class="cap">Weight rejected</div>' +
          '<div class="val">' + tidy(kgTotal) + ' kg</div></div>' +
      '</div>' +

      '<div class="mx-add">' +
        '<div class="mx-grid3">' +
          '<div class="mx-f"><label for="rj-no">Roll #</label>' +
            '<input id="rj-no" inputmode="numeric" placeholder="\u2013"></div>' +
          '<div class="mx-f"><label for="rj-kg">Weight (kg)</label>' +
            '<input id="rj-kg" inputmode="decimal" placeholder="0"></div>' +
          '<div class="mx-f"><label for="rj-t">Time</label>' +
            '<input id="rj-t" type="time" value="' + clock + '"></div>' +
        '</div>' +
        '<div class="fld" style="margin-top:9px"><label for="rj-c">Reason or comments</label>' +
          '<textarea id="rj-c" placeholder="Why the roll was rejected"></textarea></div>' +
        '<button class="mx-save" id="rj-add">Add reject</button>' +
        '<div class="mx-warn" id="rj-warn"></div>' +
      '</div>' +

      (scr.rolls.length
        ? '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
            '<th>Roll #</th><th>Time</th><th class="r">Weight</th><th>Comments</th><th></th>' +
          '</tr></thead><tbody>' +
          scr.rolls.map((r,i) =>
            '<tr><td class="who-cell">' + esc(r.roll) + '</td><td>' + esc(r.t) + '</td>' +
            '<td class="r ot">' + tidy(num(r.kg)) + ' kg</td>' +

    b.addEventListener('click', async () => {
      scr.rolls.splice(+b.dataset.rj, 1); await saveScr(); renderRej();

        '<button class="mx-save" id="sr-add">Save report</button>' +
        '<div class="mx-warn" id="sr-warn"></div>' +
        '<div class="saved" id="sr-ok"></div>' +
        '<div class="tp-note" style="text-align:left;margin-top:10px">' +
          'Excel or CSV \u00b7 up to ' + kb(MAX_UPLOAD) + ' each</div>' +
      '</div>' +

      (scrRep.files.length
        ? '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
            '<th>File</th><th>Size</th><th>Added</th><th></th><th></th>' +
          '</tr></thead><tbody>' +
          scrRep.files.map((f,i) =>
            '<tr><td class="note-cell">' + esc(f.name) + '</td>' +
            '<td>' + kb(f.size) + '</td>' +
            '<td>' + esc(f.day) + '<br><span style="color:var(--ink-soft);font-size:11px">' +
              esc(f.by || '') + '</span></td>' +
            '<td class="r"><button class="tool" data-srdl="' + i + '">Download</button></td>' +
            '<td class="r"><button class="mx-del" data-srrm="' + i +
            '" aria-label="Remove report">\u2715</button></td></tr>').join('') +
          '</tbody></table></div>'
        : '<div class="tbl-wrap"><div class="empty">No report for this month</div></div>') +
      '<div class="rc-note">Shared \u00b7 everyone sees the same reports</div>' +
    '</div>';

  document.getElementById('sr-month').addEventListener('change', async e => {
    scrMonth = e.target.value || iso(now).slice(0,7);
    await loadScrRep(); renderScrRep();
  });

  document.getElementById('sr-add').addEventListener('click', async () => {
    const inp = document.getElementById('sr-file');
    const warn = document.getElementById('sr-warn');
    const file = inp.files && inp.files[0];
    warn.textContent = '';
    if(!file){ warn.textContent = 'Choose a file first'; return; }
    if(file.size > MAX_UPLOAD){
      warn.textContent = 'File is ' + kb(file.size) + ' \u2014 limit is ' + kb(MAX_UPLOAD); return;
    }
    try{
      const b64 = await readAsBase64(file);
      const id = 's' + Date.now() + Math.random().toString(36).slice(2,7);
      const ok = await put(fileKey(id), b64, true);
      scrRep.files.push({id, name: file.name, size: file.size, type: file.type,
                         day: iso(now), by: operator, shared: true});
      await saveScrRep(); renderScrRep();
      const okEl = document.getElementById('sr-ok');
      if(okEl) okEl.textContent = ok ? '\u2713 Saved' : '\u2713 Held on this device';
    }catch(e){ warn.textContent = 'Could not read that file'; }
  });

  document.querySelectorAll('[data-srdl]').forEach(b =>
    b.addEventListener('click', () => downloadFile(scrRep.files[+b.dataset.srdl])));

  document.querySelectorAll('[data-srrm]').forEach(b =>
    b.addEventListener('click', async () => {
      const f = scrRep.files[+b.dataset.srrm];
      scrRep.files.splice(+b.dataset.srrm, 1);
      delete memo[fileKey(f.id)];
      try{ if(window.storage) await window.storage.delete(fileKey(f.id), true); }catch(e){}
      await saveScrRep(); renderScrRep();
    }));
}

/* ── Scrap: admin ─────────────────────────── */
let scrAdmMonth = iso(now).slice(0,7), scrWho = 'ALL';

async function allScr(){
  const out = [];
  const take = (key, val) => {
    const [, id, date] = key.split(':');
    const name = nameOf(id);
    let r; try{ r = JSON.parse(val); }catch(e){ return; }
    (r.rolls || []).forEach(x => out.push({kind:'rej',  name, date, ...x}));
    (r.waste || []).forEach(x => out.push({kind:'wst',  name, date, ...x}));
  };
  try{
    if(window.storage){
      const list = await window.storage.list('scr:');
      for(const k of (list && list.keys) || []){
        try{ const g = await window.storage.get(k); if(g) take(k, g.value); }catch(e){}
      }
    }
  }catch(e){}
  const seen = new Set(out.map(r => r.name + r.date));
  Object.keys(memo).filter(k => k.startsWith('scr:') && !k.startsWith('scrrep:')).forEach(k => {
    const [, id, date] = k.split(':');
    if(!seen.has(nameOf(id) + date)) take(k, memo[k]);
  });
  return out.sort((a,b) => a.date.localeCompare(b.date) || (a.t||'').localeCompare(b.t||''));
}

const scrFilters = (whoId, monId) =>
  '<div class="filters">' +
    '<select id="' + whoId + '"><option value="ALL">All operators</option>' +
      CREW.map(c => '<option value="'+c.name+'"'+(scrWho===c.name?' selected':'')+'>'+
                    esc(c.name)+'</option>').join('') +
    '</select>' +
    '<input type="month" id="' + monId + '" value="' + scrAdmMonth + '">' +
  '</div>';
function wireScrFilters(whoId, monId, redraw){
  const w = document.getElementById(whoId);
  w.addEventListener('change', () => { scrWho = w.value; redraw(); });
  const m = document.getElementById(monId);
  m.addEventListener('change', () => { scrAdmMonth = m.value; redraw(); });
}
const inScr = r => r.date.slice(0,7) === scrAdmMonth && (scrWho === 'ALL' || r.name === scrWho);

// both scrap streams together, so the month total is one number
function scrTotals(all){
  const rej = all.filter(r => r.kind === 'rej');
  const wst = all.filter(r => r.kind === 'wst');
  const rejKg = rej.reduce((a,r) => a + num(r.kg), 0);
  const wstKg = wst.reduce((a,r) => a + num(r.kg), 0);
  return {rej, wst, rejKg, wstKg, total: rejKg + wstKg};
}

        ? '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +

          days.map(d => '<tr><td>' + d.slice(8) + '/' + d.slice(5,7) + '</td>' +

function exportScrap(t){
  if(!t.rej.length && !t.wst.length){ alert('Nothing to export for this month.'); return; }

  const byDay = {};
  const bump = (d, f, kg) => {
    byDay[d] = byDay[d] || {rejN:0, rejKg:0, wstN:0, wstKg:0};
    byDay[d][f + 'N']++; byDay[d][f + 'Kg'] += kg;
  };
  t.rej.forEach(r => bump(r.date, 'rej', num(r.kg)));
  t.wst.forEach(r => bump(r.date, 'wst', num(r.kg)));

  const sum1 = [['Date','Reject rolls','Reject kg','Pallets wasted','Wastage kg','Total scrap kg']];
  Object.keys(byDay).sort().forEach(d => {
    const v = byDay[d];
    sum1.push([d, v.rejN, v.rejKg, v.wstN, v.wstKg, v.rejKg + v.wstKg]);
  });
  sum1.push(['TOTAL', t.rej.length, t.rejKg, t.wst.length, t.wstKg, t.total]);

  const rSheet = [['Date','Operator','Roll #','Time','Weight (kg)','Comments']];
  t.rej.forEach(r => rSheet.push([r.date, r.name, r.roll, r.t, num(r.kg), r.note || '']));

  const wSheet = [['Date','Operator','Time','Pallet weight (kg)','Comments']];
  t.wst.forEach(r => wSheet.push([r.date, r.name, r.t, num(r.kg), r.note || '']));

  booksOut([[sum1,[12,13,11,15,12,15],'Daily summary'],
            [rSheet,[12,20,10,8,12,44],'Reject rolls'],
            [wSheet,[12,20,8,18,44],'Wastage']],
    'corona-scrap-' + (scrWho === 'ALL' ? 'all' :

function monthDays(m){
  const [y, mo] = m.split('-').map(Number);
  const n = new Date(y, mo, 0).getDate();
  return Array.from({length:n}, (_,i) => {
    const dd = String(i+1).padStart(2,'0');
    const wd = new Date(y, mo-1, i+1).getDay();
    return {dd, wd, full: m + '-' + dd};      // plant runs 7 days, so no weekends
  });
}

  if(!sched.rows || typeof sched.rows !== 'object') sched.rows = {};
}
const saveSched = () => put(schKey(), JSON.stringify(sched), true);

async function loadTgt(){

  if(!Array.isArray(tgt.lines)) tgt.lines = [];
  // pounds used to sit on each line; roll it up into one monthly figure
  if(!num(tgt.lbs)){
    const rolled = tgt.lines.reduce((a,l) => a + num(l.lbs), 0);
    if(rolled) tgt.lbs = rolled;
  }
  tgt.lbs = num(tgt.lbs);
  tgt.lines.forEach(l => {
    l.rolls = num(l.rolls); l.done = num(l.done);
    if(typeof l.mach !== 'string') l.mach = '';
    delete l.lbs;
  });
}

// production this month, split by material and by day
async function monthActuals(month){
  const byMat = {}, byDay = {};
  const bump = (mat, date, f, v) => {
    const m = mat || 'Unspecified';
    byMat[m] = byMat[m] || {rolls:0, kg:0};
    byMat[m][f] += v;
    byDay[date] = byDay[date] || {};
    byDay[date][m] = byDay[date][m] || {rolls:0, kg:0};
    byDay[date][m][f] += v;
  };
  const scan = async (prefix, handler) => {
    const seen = new Set();
    try{
      if(window.storage){
        const list = await window.storage.list(prefix);
        for(const k of (list && list.keys) || []){
          try{ const g = await window.storage.get(k); if(g){ seen.add(k); handler(k, g.value); } }
          catch(e){}
        }
      }
    }catch(e){}
    Object.keys(memo).filter(k => k.startsWith(prefix) && !seen.has(k))
      .forEach(k => handler(k, memo[k]));
  };

  await scan('lmh:', (k, v) => {
    const date = k.split(':')[3];
    if(!date || date.slice(0,7) !== month) return;
    try{ (JSON.parse(v).rolls || []).forEach(r => bump(r.mat, date, 'rolls', 1)); }catch(e){}
  });
  await scan('mix:', (k, v) => {
    const date = k.split(':')[2];
    if(!date || date.slice(0,7) !== month) return;
    try{
      const rec = JSON.parse(v);
      (rec.rows || []).forEach(r => bump(r.mat || rec.material, date, 'kg', num(r.kg)));
    }catch(e){}
  });
  return {byMat, byDay};
}

const matAct = (a, mat) => mat === 'ALL'
  ? Object.values(a.byMat).reduce((s,v) => ({rolls:s.rolls+v.rolls, kg:s.kg+v.kg}), {rolls:0,kg:0})
  : (a.byMat[mat] || {rolls:0, kg:0});

let statMonth = iso(now).slice(0,7);

async function scanKeys(prefix, handler){
  const seen = new Set();
  try{
    if(window.storage){
      const list = await window.storage.list(prefix);
      for(const k of (list && list.keys) || []){
        try{ const g = await window.storage.get(k); if(g){ seen.add(k); handler(k, g.value); } }
        catch(e){}
      }
    }
  }catch(e){}
  Object.keys(memo).filter(k => k.startsWith(prefix) && !seen.has(k))
    .forEach(k => handler(k, memo[k]));
}

async function monthStats(month){
  const s = {
    mixKg:0, gaylords:0, batches:0,
    lmhRolls:0, lmhPass:0, lmhRej:0, lmhQ:0,
    flmRolls:0, flmGood:0, flmQ:0, flmRej:0,
    peel:0, peelPass:0,
    qc:0, qcPass:0, qcFail:0,
    sandDone:0, belts:0,
    rejRolls:0, rejKg:0, wasteKg:0,
    downMins:0, reasons:{},
    upMins:0, offMins:0,
    shifts:0, workMins:0, otMins:0,
    mntJobs:0, mntMins:0,
    days:new Set()
  };
  const inMonth = d => d && d.slice(0,7) === month;
  const parse = v => { try{ return JSON.parse(v); }catch(e){ return null; } };
  const addReason = (why, mins) => {
    const k = why || 'Unspecified';
    s.reasons[k] = (s.reasons[k] || 0) + num(mins);
    s.downMins += num(mins);
  };
  const addStatus = (evs, date) => {
    const segs = segments(evs, date);
    s.upMins  += minsIn(segs, 'online');
    s.offMins += minsIn(segs, 'offline');
  };

  await scanKeys('mix:', (k, v) => {
    const date = k.split(':')[2]; if(!inMonth(date)) return;
    const r = parse(v); if(!r) return;
    s.days.add(date);
    (r.rows || []).forEach(b => {
      s.mixKg += num(b.kg); s.gaylords += num(b.gay); s.batches++;
    });
  });

  await scanKeys('lmh:', (k, v) => {
    const date = k.split(':')[3]; if(!inMonth(date)) return;
    const r = parse(v); if(!r) return;
    (r.rolls || []).forEach(x => {
      s.lmhRolls++;
      const res = normRes(x.result);
      if(res === 'Pass') s.lmhPass++;
      else if(res === 'Rejected') s.lmhRej++;
      else if(res === 'Questionable') s.lmhQ++;
    });
    if((r.status || []).length) addStatus(r.status, date);
  });

  await scanKeys('dwn:', (k, v) => {
    const date = k.split(':')[2]; if(!inMonth(date)) return;
    const r = parse(v); if(!r) return;
    (r.rows || []).forEach(d => addReason(d.reason, d.mins));
  });

  await scanKeys('snd:', (k, v) => {
    const date = k.split(':')[2]; if(!inMonth(date)) return;
    const r = parse(v); if(!r) return;
    (r.rows || []).forEach(x => {
      s.sandDone += num(x.done);
      s.belts += (x.belts || []).reduce((a,b) => a + num(b.count), 0);
    });
    (r.down || []).forEach(d => addReason(d.reason, d.mins));
    if((r.status || []).length) addStatus(r.status, date);
  });

  await scanKeys('flm:', (k, v) => {
    const date = k.split(':')[2]; if(!inMonth(date)) return;
    const r = parse(v); if(!r) return;
    (r.rolls || []).forEach(x => {
      s.flmRolls++;
      if(x.result === 'Good') s.flmGood++;
      else if(x.result === 'Questionable') s.flmQ++;
      else if(x.result === 'Rejected') s.flmRej++;
    });
    (r.peel || []).forEach(x => { s.peel++; if(x.result === 'Pass') s.peelPass++; });
    (r.down || []).forEach(d => addReason(d.reason, d.mins));
    if((r.status || []).length) addStatus(r.status, date);
  });

  await scanKeys('scr:', (k, v) => {
    if(k.startsWith('scrrep:')) return;
    const date = k.split(':')[2]; if(!inMonth(date)) return;
    const r = parse(v); if(!r) return;
    (r.rolls || []).forEach(x => { s.rejRolls++; s.rejKg += num(x.kg); });
    (r.waste || []).forEach(x => { s.wasteKg += num(x.kg); });
  });

  await scanKeys('qua:', (k, v) => {
    const date = k.split(':')[2]; if(!inMonth(date)) return;
    const r = parse(v); if(!r) return;
    (r.samples || []).forEach(x => {
      s.qc++;
      if(x.result === 'Pass') s.qcPass++;
      else if(x.result === 'Fail') s.qcFail++;
    });
  });

  await scanKeys('shift:', (k, v) => {
    const date = k.split(':')[2]; if(!inMonth(date)) return;
    const r = parse(v); if(!r || !r.inAt) return;
    let m = Math.floor((new Date(r.outAt || r.inAt) - new Date(r.inAt)) / 60000);
    if(m < 0) m += 1440;
    s.shifts++; s.workMins += m; s.otMins += Math.max(0, m - STD_MINS);
  });

  await scanKeys('mnt:', (k, v) => {
    const date = k.split(':')[2]; if(!inMonth(date)) return;
    const r = parse(v); if(!r) return;
    (r.logs || []).forEach(l => { s.mntJobs++; s.mntMins += num(l.mins); });
  });

  return s;
}

let bon = {scores:{}}, bonMonth = iso(now).slice(0,7), bonWho = '';
const bonKey = m => 'bon:' + (m || bonMonth);

const CRITERIA = [
  {k:'prod', label:'Productivity', hint:'Output against what the job needed'},
  {k:'perf', label:'Performance',  hint:'Quality and consistency of the work'},
  {k:'init', label:'Initiative',   hint:'Solving problems without being asked'},
  {k:'tidy', label:'Tidiness',     hint:'Housekeeping and care of the area'},
  {k:'beh',  label:'Behaviour',    hint:'Attitude, timekeeping, working with others'}
];
const MAX_SCORE = CRITERIA.length * 5;

async function loadBon(){
  bon = {scores:{}};
  const raw = await grab(bonKey(), true);
  if(raw){ try{ bon = JSON.parse(raw); }catch(e){} }
  if(!bon.scores || typeof bon.scores !== 'object') bon.scores = {};
}
const saveBon = () => put(bonKey(), JSON.stringify(bon), true);

const scoreOf = id => bon.scores[id] || {};
const totalOf = id => {
  const s = scoreOf(id);
  return CRITERIA.reduce((a,c) => a + num(s[c.k]), 0);
};
const isScored = id => CRITERIA.every(c => num(scoreOf(id)[c.k]) > 0);
const bonGrade = t => t >= 22 ? 'hit' : t >= 17 ? 'near' : t > 0 ? 'miss' : '';

async function renderBonus(){

      const next = num(bon.scores[bonWho][k]) === num(v) ? 0 : num(v);

      b.closest('.bn-scale').querySelectorAll('.bn-btn').forEach(x =>
        x.classList.toggle('on', Number(x.dataset.sc.split('|')[1]) === next));

      const tot = totalOf(bonWho);
      const fig = document.querySelector('.bn-fig');
      if(fig) fig.innerHTML = tot + '<em>of ' + MAX_SCORE + '</em>';
      const card = document.querySelector('.bn-total');
      if(card) card.className = 'bn-total ' + bonGrade(tot);
      saveBon();
    }));

  document.getElementById('bn-clear').addEventListener('click', async () => {
    if(!confirm('Clear ' + who.name + '\u2019s score for ' + bonMonth + '?')) return;
    delete bon.scores[bonWho];
    await saveBon(); renderBonAdmin();
  });

  document.getElementById('bn-xls').addEventListener('click', () => {
    const aoa = [['Operator'].concat(CRITERIA.map(c => c.label)).concat(['Total','Out of'])];
    ranked.forEach(r => {
      const s = scoreOf(r.id);
      aoa.push([r.name].concat(CRITERIA.map(c => num(s[c.k]) || ''))
                       .concat([r.t || '', MAX_SCORE]));
    });
    aoa.push([]);
    aoa.push(['Scored', done + ' of ' + CREW.length, '', '', '', '', avg === null ? '' : avg, '']);
    booksOut([[aoa, [20,13,13,11,11,12,8,8], 'Bonus ' + bonMonth]],
             'corona-bonus-scores-' + bonMonth);
  });
}

let inv = {pallets:[]}, shipMonth = iso(now).slice(0,7);
const invKey = 'inv:all';

const INV_PAGES = [
  {id:'stock', label:'Inventory', blurb:'Every pallet held, by customer and material.'},

];
const PAL_STATES = [
  {v:'In stock', cls:'r-rej'},
  {v:'Ready',    cls:'r-q'},
  {v:'Shipped',  cls:'r-pass'}
];
const palTag = v => v === 'Shipped' ? 'tag-pass' : v === 'Ready' ? 'tag-q' : 'tag-fail';

async function loadInv(){
  inv = {pallets:[]};
  const raw = await grab(invKey, true);
  if(raw){ try{ inv = JSON.parse(raw); }catch(e){} }
  if(!Array.isArray(inv.pallets)) inv.pallets = [];
  inv.pallets.forEach(p => { if(!p.state) p.state = 'In stock'; });
}
const saveInv = () => put(invKey, JSON.stringify(inv), true);

const invCustomers = () => [...new Set(inv.pallets.map(p => p.cust).filter(Boolean))].sort();
const invMaterials = () => [...new Set(
  ['Resin','Rolls','Regrind','Finished goods'].concat(inv.pallets.map(p => p.kind)))]
  .filter(Boolean).sort();
const kgOf = list => list.reduce((a,p) => a + num(p.kg), 0);

// Section menu \u2014 each row opens its own page
let shiftCount = 0;
async function countShifts(){
  const all = await allRecords();
  shiftCount = all.filter(r => r.date.slice(0,7) === recMonth).length;
  buildMenu();
}
const statusOf = t => {
  if(role === 'admin')
    return t.id === 'time' ? (shiftCount ? shiftCount + ' recs' : 'No data') : 'No data';
  if(t.id === 'sched'){
    if(role === 'admin') return 'Set';
    const n = Object.keys(sched.rows[opId] || {}).length;
    return n ? n + ' days' : 'View';
  }
  if(t.id === 'targ') return role === 'admin' ? 'Set' : 'View';
  if(t.id === 'bonus') return role === 'admin' ? 'Score' : 'View';
  if(t.id === 'inv'){
    const rdy = (inv.pallets || []).filter(p => p.state === 'Ready').length;
    return rdy ? rdy + ' ready' : 'View';
  }
  if(t.k === 'ref')   return 'View';
  if(t.id === 'maint'){
    const open = (pend.jobs || []).filter(j => j.state !== 'Complete').length;
    return open ? open + ' open' : 'As needed';
  }
  if(t.id === 'store'){
    const low = (stock.items || []).filter(isLow).length +
                (mach.items  || []).filter(isLow).length;
    const req = (needs.items || []).length;
    return low ? low + ' low' : req ? req + ' needed' : 'As needed';
  }
  if(t.id === 'items') return (pos.orders || []).length
    ? (pos.orders.length + ' this month') : 'As needed';
  if(t.id === 'leave'){
    const n = (lv.travel || []).length + (lv.days || []).length;
    return n ? n + ' requested' : 'As needed';
  }
  if(t.k === 'adhoc') return 'As needed';
  if(t.id === 'qual') return (qua.samples.length + qua.comments.length + qua.files.length)
                              ? 'Done' : 'Empty';
  if(t.id === 'rep') return (rep.run || REP_QS.some(q => (rep[q.k] || '').trim()))
                              ? 'Done' : 'Empty';
  if(t.id === 'scrap') return (scr.rolls.length + scr.waste.length) ? 'Done' : 'Empty';
  if(t.id !== 'time') return 'Empty';
  return day.outAt ? 'Done' : day.inAt ? 'Open' : 'Empty';
};

function buildMenu(){
  const host = $('menu');
  host.classList.toggle('fresh', !host.dataset.drawn);
  host.dataset.drawn = '1';
  host.innerHTML = '';

  // progress across the shift-entry sections only
  if(role !== 'admin'){
    const entries = TABS.filter(t => t.k === 'entry');
    const done = entries.filter(t => statusOf(t) === 'Done').length;
    const pct = Math.round(done / entries.length * 100);
    const pr = document.createElement('div');
    pr.className = 'prog';
    pr.innerHTML =
      '<span class="txt">Shift ' + done + '/' + entries.length + '</span>' +
      '<span class="bar-track"><span class="bar-fill" style="width:' + pct + '%"></span></span>' +
      '<span class="txt">' + pct + '%</span>';
    host.appendChild(pr);
  }

  let idx = 0;
  GROUPS.forEach(grp => {
    const items = TABS.filter(t => t.g === grp.g);
    if(!items.length) return;

    const wrap = document.createElement('div');
    wrap.className = 'grp' + (shut[grp.g] ? ' shut' : '');

    const head = document.createElement('button');
    head.className = 'grp-head';
    head.innerHTML =
      '<span class="g-lbl">' + grp.label + '</span>' +
      '<span class="g-cnt">' + items.length + ' \u00b7 ' + grp.note + '</span>' +
      '<span class="g-arw">\u25bc</span>';
    head.addEventListener('click', () => { shut[grp.g] = !shut[grp.g]; buildMenu(); });
    wrap.appendChild(head);

    const body = document.createElement('div');
    body.className = 'grp-body';
    items.forEach(t => {
      const st = statusOf(t);
      const b = document.createElement('button');
      b.className = 'row' + (st === 'Done' || /recs$/.test(st) ? ' done' : '');
      b.innerHTML =
        '<span class="num">' + String(seqOf(t)).padStart(2,'0') + '</span>' +
        '<span class="body"><span class="label">' + t.label + '</span>' +
        '<span class="blurb">' + t.blurb + '</span></span>' +
        '<span class="state' + (t.k === 'ref' ? ' ref' : '') + '"><i></i>' + st + '</span>' +
        '<span class="chev">\u203a</span>';
      b.style.animationDelay = (Math.min(idx++, 9) * 40) + 'ms';
      b.addEventListener('click', () => openPage(t));
      body.appendChild(b);
    });
    wrap.appendChild(body);
    host.appendChild(wrap);
  });
}

function openPage(t){
  backTo = null;
  $('to-menu').textContent = '\u2190 Menu';
    $('page-title').textContent = t.label;
  if(t.id === 'prod'){ renderProd(); return; }
  if(t.id === 'qual'){ renderQualMenu(); return; }
  if(t.id === 'maint'){ renderMntMenu(); return; }
  if(t.id === 'store'){ renderStoreMenu(); return; }
  if(t.id === 'items'){ renderPO(); return; }
  if(t.id === 'leave'){ renderLeaveMenu(); return; }
  if(t.id === 'rep'){ renderRepPage(); return; }
  if(t.id === 'scrap'){ renderScrapMenu(); return; }
  if(t.id === 'sched'){ renderSchedule(); return; }
  if(t.id === 'targ'){ renderTargets(); return; }
  if(t.id === 'stats'){ renderStats(); return; }
  if(t.id === 'bonus'){ renderBonus(); return; }
  if(t.id === 'inv'){ renderInvMenu(); return; }
  if(t.id === 'time'){
    if(role === 'admin'){ renderRecords(); show('s-rec'); return; }
    renderTime(); show('s-page'); return;
  }
  const num = String(seqOf(t)).padStart(2,'0');
  if(role === 'admin'){
    $('page-body').innerHTML =
      '<div class="page"><div class="eyebrow">Admin \u00b7 section ' + num + '</div>' +
      '<h2>' + t.label + '</h2>' +
      '<p>Entries collect here \u2014 filterable by operator and date, exportable to Excel.</p>' +
      '<span class="stub">Awaiting section ' + num + '</span></div>';
    show('s-page'); return;
  }
  const kindTxt = t.k === 'ref' ? 'Reference \u00b7 maintained by the office'
                : t.k === 'adhoc' ? 'Logged only when it happens'
                : 'Complete before signing out';
  $('page-body').innerHTML =
    '<div class="page"><div class="eyebrow">Section ' + num + ' \u00b7 ' + kindTxt +
    '</div><h2>' + t.label +
    '</h2><p>' + t.blurb + '</p><span class="stub">Fields to be added</span></div>';
  show('s-page');
}

paint();
buildMenu();
</script>
