<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Corona Plastics — Daily Production Record</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#161B1F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shift Log">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-64.png" sizes="64x64">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
:root{
  --steel:#C8CFD3;
  --steel-dk:#A7B2B8;
  --panel:#F3F5F6;
  --ink:#12171A;
  --ink-mid:#4C575E;
  --ink-soft:#7C888F;
  --go:#17864B;
  --go-lo:#0F6739;
  --hazard:#D9B467;
  --hazard-dp:#B8944A;
  --alarm:#C4362B;
  --line:#B4BEC3;
  --rad:3px;
}

*{box-sizing:border-box;margin:0;padding:0}

html{height:100%; -webkit-text-size-adjust:100%}
body{min-height:100%}

body{
  background:var(--steel);
  color:var(--ink);
  font-family:'Barlow',ui-sans-serif,system-ui,sans-serif;
  display:flex;
  align-items:stretch;
  justify-content:center;
  padding:0;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:contain;      /* no rubber-band bounce in standalone */
}

/* ── Chassis ─────────────────────────────── */
.chassis{
  width:100%;
  min-height:100vh;
  min-height:100dvh;
  background:var(--panel);
  border:0;
  border-radius:0;
  display:flex;
  flex-direction:column;
  /* installed on a phone the app owns the whole screen, so it has to
     keep clear of the notch and the home indicator itself */
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
  padding-left:env(safe-area-inset-left);
  padding-right:env(safe-area-inset-right);
}
.screen{flex:1}

/* content runs the full width of the screen */
.pad, .menu, .mx, .rc, #page-body > .page{
  max-width:none;
  margin-left:0;
  margin-right:0;
}
.bar{padding-left:16px;padding-right:16px}

.hazard{
  height:9px;
  background:repeating-linear-gradient(-45deg,var(--hazard) 0 11px,var(--ink) 11px 22px);
}

/* ── Screens ─────────────────────────────── */
.screen{display:none}
.screen.on{display:block}

.pad{padding:26px 24px 28px}

/* ── Nameplate ───────────────────────────── */
.plate{
  border:1px solid var(--line);
  background:linear-gradient(#EDF0F1,#DFE4E6);
  padding:30px 20px 20px;
  text-align:center;
  box-shadow:0 1px 0 #fff inset;
}
.logo svg{
  display:block;
  width:100%;
  max-width:268px;
  height:auto;
  margin:0 auto;
}
.plate .sub{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:600;
  font-size:15px;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--ink-mid);
  margin-top:22px;
  padding-top:14px;
  border-top:1px solid var(--line);
}

/* ── Lamp ────────────────────────────────── */
.lamp-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin:20px 0 22px;
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--ink-mid);
}
.lamp{display:flex;align-items:center;gap:9px}
.bulb{
  width:11px;height:11px;border-radius:50%;
  background:var(--go);
  box-shadow:0 0 0 3px rgba(23,134,75,.2);
  animation:breathe 2.6s ease-in-out infinite;
}
@keyframes breathe{50%{box-shadow:0 0 0 7px rgba(23,134,75,0)}}

/* ── Start pushbutton ────────────────────── */
.start{
  width:100%;
  border:0;
  cursor:pointer;
  background:linear-gradient(var(--go),var(--go-lo));
  color:#fff;
  font-family:'Barlow Condensed',sans-serif;
  font-weight:700;
  font-size:30px;
  letter-spacing:.2em;
  text-transform:uppercase;
  padding:26px 0 24px;
  border-radius:var(--rad);
  box-shadow:0 7px 0 #0A4A28, 0 1px 0 rgba(255,255,255,.35) inset;
  transition:transform .07s, box-shadow .07s;
}
.start:active{transform:translateY(6px);box-shadow:0 1px 0 #0A4A28, 0 1px 0 rgba(255,255,255,.35) inset}
.start:focus-visible{outline:3px solid var(--ink);outline-offset:4px}

.legend{
  margin-top:16px;
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  line-height:1.7;
  color:var(--ink-soft);
  text-align:center;
}

/* ── Headers on inner screens ────────────── */
.bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:13px 16px;
  background:var(--ink);
  color:var(--panel);
}
.bar .grow{flex:1;min-width:0}
.crown{display:block;flex:0 0 auto}
.crown svg{display:block;width:26px;height:auto}
.crown svg path{fill:var(--hazard)}
.bar .who{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:600;
  font-size:19px;
  letter-spacing:.09em;
  text-transform:uppercase;
}
.bar .meta{
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  letter-spacing:.1em;
  color:#9BA7AD;
  margin-top:1px;
}
.ghost{
  background:none;
  border:1px solid #4C575E;
  color:var(--panel);
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  letter-spacing:.12em;
  text-transform:uppercase;
  padding:8px 11px;
  border-radius:var(--rad);
  cursor:pointer;
  white-space:nowrap;
}
.ghost:hover{background:#242C31}
.ghost:focus-visible{outline:2px solid var(--hazard);outline-offset:2px}

/* ── Field labels ────────────────────────── */
.tag{
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--ink-soft);
  display:block;
  margin-bottom:8px;
}

.pick{
  width:100%;
  appearance:none;
  background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 14 14'><path d='M2 4.5 L7 10 L12 4.5' fill='none' stroke='%234C575E' stroke-width='1.8'/></svg>") no-repeat right 15px center;
  border:1px solid var(--line);
  border-radius:var(--rad);
  padding:17px 44px 17px 15px;
  font-family:'Barlow Condensed',sans-serif;
  font-weight:600;
  font-size:22px;
  letter-spacing:.05em;
  text-transform:uppercase;
  color:var(--ink);
  cursor:pointer;
}
.pick:focus-visible{outline:3px solid var(--go);outline-offset:2px}

/* ── PIN readout ─────────────────────────── */
.readout{
  display:grid;
  grid-template-columns:repeat(var(--code-len,6),1fr);
  gap:9px;
  margin-bottom:8px;
}
.cell{
  height:60px;
  background:#0D1113;
  border-radius:var(--rad);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 2px 5px rgba(13,17,19,.3) inset;
}
.cell span{
  width:15px;height:15px;border-radius:50%;
  background:#2A3236;
}
.cell.set span{background:var(--hazard);box-shadow:0 0 9px rgba(240,190,0,.6)}
.readout.bad .cell{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.err{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--alarm);
  min-height:17px;
  margin-bottom:14px;
}

/* ── Keypad ──────────────────────────────── */
.keys{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}
.key{
  height:64px;
  border:1px solid var(--line);
  background:linear-gradient(#fff,#E7EBEC);
  border-radius:var(--rad);
  font-family:'IBM Plex Mono',monospace;
  font-weight:600;
  font-size:24px;
  color:var(--ink);
  cursor:pointer;
  box-shadow:0 3px 0 var(--steel-dk);
  transition:transform .06s, box-shadow .06s;
}
.key:active{transform:translateY(3px);box-shadow:0 0 0 var(--steel-dk)}
.key:focus-visible{outline:3px solid var(--go);outline-offset:2px}
.key.fn{font-size:11px;letter-spacing:.13em;text-transform:uppercase}
.key.ok{background:linear-gradient(var(--go),var(--go-lo));color:#fff;border-color:var(--go-lo);box-shadow:0 3px 0 #0A4A28}
.key[disabled]{opacity:.4;cursor:not-allowed}

/* ── Section menu ─ control panel ──────── */
.menu{
  padding:18px 16px 34px;
  min-height:100%;
  background:#14181B;
  background-image:repeating-linear-gradient(
    90deg,rgba(255,255,255,.022) 0 1px,transparent 1px 4px);
}
.row{
  position:relative;
  display:flex;
  align-items:center;
  gap:15px;
  width:100%;
  text-align:left;
  overflow:hidden;
  border:1px solid #333C41;
  border-radius:var(--rad);
  background:linear-gradient(#252D32,#191F23);
  padding:17px 16px 17px 22px;
  margin-bottom:9px;
  cursor:pointer;
  box-shadow:0 1px 0 rgba(255,255,255,.06) inset, 0 3px 0 #0B0E10;
  transition:transform .08s, box-shadow .08s, border-color .18s;
}
.row:last-child{margin-bottom:0}

/* gold indicator strip — dim until touched */
.row::before{
  content:'';
  position:absolute;
  left:0; top:0; bottom:0;
  width:4px;
  background:var(--hazard-dp);
  opacity:.42;
  transition:opacity .18s, box-shadow .18s;
}
.row:hover{border-color:#4A555B}
.row:hover::before,
.row:focus-visible::before{
  opacity:1;
  box-shadow:0 0 13px 1px rgba(217,180,103,.7);
}
.row:active{transform:translateY(3px);box-shadow:0 0 0 #0B0E10}
.row:focus-visible{outline:2px solid var(--hazard);outline-offset:2px}

.row .num{
  flex:0 0 auto;
  width:24px;
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  font-weight:600;
  color:var(--hazard);
  opacity:.75;
}
.row .body{flex:1;min-width:0}
.row .label{
  display:block;
  font-family:'Barlow Condensed',sans-serif;
  font-weight:700;
  font-size:24px;
  letter-spacing:.11em;
  text-transform:uppercase;
  line-height:1.05;
  color:#F3F5F6;
  text-shadow:0 1px 0 rgba(0,0,0,.55);
}
.row .blurb{
  display:block;
  font-size:12.5px;
  color:#8D999F;
  line-height:1.45;
  margin-top:4px;
}
.row .state{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:6px;
  font-family:'IBM Plex Mono',monospace;
  font-size:9px;
  letter-spacing:.13em;
  text-transform:uppercase;
  color:#7C888F;
}
.row .state i{
  width:7px;height:7px;border-radius:50%;
  background:#39434A;
  box-shadow:0 1px 2px rgba(0,0,0,.5) inset;
}
.row.done .state{color:var(--hazard)}
.row.done .state i{background:var(--go);box-shadow:0 0 7px rgba(23,134,75,.8)}
.row .chev{
  flex:0 0 auto;
  color:var(--hazard);
  font-size:21px;
  line-height:1;
  opacity:.55;
  transition:transform .18s, opacity .18s;
}
.row:hover .chev{opacity:1;transform:translateX(3px)}

/* panel wakes up one row at a time — first draw only, so taps stay instant */
.menu.fresh .row{animation:wake .34s both}
@keyframes wake{from{opacity:0;transform:translateY(7px)}}

/* ── Section page ────────────────────────── */
.page{padding:46px 26px 56px;text-align:center;min-height:300px;
  display:flex;flex-direction:column;justify-content:center}
.page .eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--ink-soft);
}
.page h2{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:700;
  font-size:36px;
  letter-spacing:.05em;
  text-transform:uppercase;
  margin-top:7px;
}
.page p{
  color:var(--ink-mid);
  font-size:15px;
  line-height:1.6;
  max-width:330px;
  margin:12px auto 0;
}
.page .stub{
  margin-top:24px;
  display:inline-block;
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  letter-spacing:.15em;
  text-transform:uppercase;
  color:var(--ink-soft);
  border:1px dashed var(--line);
  padding:10px 16px;
  border-radius:var(--rad);
}


/* ── Time in / out ──────────────── */
.tp{padding:20px 16px 24px}
.tp-state{
  display:flex;align-items:center;justify-content:center;gap:9px;
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-mid);margin-bottom:16px;
}
.tp-state i{
  width:9px;height:9px;border-radius:50%;background:#B4BEC3;
  box-shadow:0 1px 2px rgba(0,0,0,.25) inset;
}
.tp-state.live i{background:var(--go);box-shadow:0 0 8px rgba(23,134,75,.75);animation:breathe 2.6s ease-in-out infinite}
.tp-state.done i{background:var(--hazard);box-shadow:0 0 8px rgba(217,180,103,.75)}

.tp-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tp-slot{
  background:#0D1113;border-radius:var(--rad);padding:14px 12px 13px;
  text-align:center;box-shadow:0 2px 5px rgba(13,17,19,.3) inset;
}
.tp-slot .cap{
  font-family:'IBM Plex Mono',monospace;font-size:9px;
  letter-spacing:.18em;text-transform:uppercase;color:#7C888F;
}
.tp-slot .val{
  font-family:'IBM Plex Mono',monospace;font-weight:600;
  font-size:29px;color:var(--hazard);margin-top:7px;line-height:1;
}
.tp-slot .val.void{color:#2A3236}
.tp-slot .edit{
  margin-top:9px;background:none;border:1px solid #2A3236;color:#7C888F;
  font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.12em;
  text-transform:uppercase;padding:5px 9px;border-radius:var(--rad);cursor:pointer;
}
.tp-slot .edit:hover{border-color:#4A555B;color:#B4BEC3}
.tp-slot .edit:focus-visible{outline:2px solid var(--hazard);outline-offset:2px}
.tp-slot input{
  margin-top:8px;width:100%;background:#1A2024;border:1px solid #3A444A;
  color:var(--hazard);font-family:'IBM Plex Mono',monospace;font-size:17px;
  padding:7px;border-radius:var(--rad);text-align:center;
}

.tp-total{
  margin-top:10px;background:linear-gradient(#EDF0F1,#DFE4E6);
  border:1px solid var(--line);border-radius:var(--rad);
  padding:15px;display:flex;align-items:baseline;justify-content:space-between;
}
.tp-total .cap{
  font-family:'IBM Plex Mono',monospace;font-size:10px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);
}
.tp-total .val{
  font-family:'IBM Plex Mono',monospace;font-weight:600;
  font-size:26px;color:var(--ink);
}

.tp-act{width:100%;border:0;cursor:pointer;margin-top:16px;
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:25px;
  letter-spacing:.2em;text-transform:uppercase;padding:22px 0 20px;
  border-radius:var(--rad);color:#fff;transition:transform .07s, box-shadow .07s;}
.tp-act.in{background:linear-gradient(var(--go),var(--go-lo));box-shadow:0 6px 0 #0A4A28,0 1px 0 rgba(255,255,255,.3) inset}
.tp-act.in:active{transform:translateY(5px);box-shadow:0 1px 0 #0A4A28}
.tp-act.out{background:linear-gradient(#C4362B,#93271E);box-shadow:0 6px 0 #6B1B15,0 1px 0 rgba(255,255,255,.3) inset}
.tp-act.out:active{transform:translateY(5px);box-shadow:0 1px 0 #6B1B15}
.tp-act:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
.tp-act[disabled]{background:#C0C8CC;box-shadow:0 6px 0 #A7B2B8;cursor:not-allowed;color:#8D999F}

.tp-note{margin-top:14px;font-family:'IBM Plex Mono',monospace;font-size:10px;
  line-height:1.7;color:var(--ink-soft);text-align:center}
.tp-undo{background:none;border:0;color:var(--alarm);font-family:'IBM Plex Mono',monospace;
  font-size:10px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;
  text-decoration:underline;padding:4px}


/* ── Records ─────────────────────────────── */
.rc{padding:16px 14px 22px}
.seg{display:flex;gap:0;margin-bottom:14px;border:1px solid var(--line);border-radius:var(--rad);overflow:hidden}
.seg button{
  flex:1;border:0;background:#E4E8EA;cursor:pointer;padding:12px 8px;
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-mid);
}
.seg button + button{border-left:1px solid var(--line)}
.seg button.on{background:var(--ink);color:var(--hazard)}
.seg button:focus-visible{outline:2px solid var(--go);outline-offset:-4px}

.filters{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
.filters select,.filters input{
  width:100%;background:#fff;border:1px solid var(--line);border-radius:var(--rad);
  padding:12px 10px;font-family:'Barlow Condensed',sans-serif;font-weight:600;
  font-size:16px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink);
}
.filters select:focus-visible,.filters input:focus-visible{outline:3px solid var(--go);outline-offset:2px}

.tbl-wrap{border:1px solid var(--line);border-radius:var(--rad);overflow-x:auto;background:#fff}
table.tbl{width:100%;border-collapse:collapse;font-family:'IBM Plex Mono',monospace;font-size:12px}
.tbl thead th{
  background:var(--ink);color:#9BA7AD;font-weight:500;font-size:9px;
  letter-spacing:.14em;text-transform:uppercase;text-align:left;
  padding:10px 9px;white-space:nowrap;
}
.tbl thead th.r,.tbl td.r{text-align:right}
.tbl tbody td{padding:11px 9px;border-top:1px solid #E4E8EA;white-space:nowrap;color:var(--ink)}
.tbl tbody tr:nth-child(even) td{background:#F7F9F9}
.tbl .who-cell{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.tbl .ot{color:#9A6F14;font-weight:600}
.tbl .ot.zero{color:#B4BEC3}
.tbl .open{color:var(--go);font-weight:600}
.tbl tfoot td{
  padding:12px 9px;border-top:2px solid var(--ink);background:#EDF0F1;
  font-weight:600;color:var(--ink);
}
.empty{padding:44px 20px;text-align:center;color:var(--ink-soft);
  font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase}

.sums{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}
.sum{background:linear-gradient(#EDF0F1,#DFE4E6);border:1px solid var(--line);
  border-radius:var(--rad);padding:12px 10px;text-align:center}
.sum .cap{font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--ink-soft)}
.sum .val{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:20px;margin-top:5px}
.sum.ot .val{color:#9A6F14}

.tools{display:flex;gap:8px;margin-top:14px;justify-content:center;flex-wrap:wrap}
.tool{background:none;border:1px solid var(--line);color:var(--ink-soft);
  font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.12em;
  text-transform:uppercase;padding:8px 12px;border-radius:var(--rad);cursor:pointer}
.tool.go{border-color:var(--go);color:var(--go);font-weight:600}
.tool.go:hover{background:var(--go);color:#fff}
.tool:hover{border-color:var(--ink-soft);color:var(--ink-mid)}
.tool:focus-visible{outline:2px solid var(--go);outline-offset:2px}
.rc-note{margin-top:12px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;
  line-height:1.7;color:var(--ink-soft);text-align:center}


/* ══ Entry screens: machine panel ══════════ */
#s-home .pad,
#s-in .pad{
  background:
    radial-gradient(120% 85% at 50% 0%, #232B30 0%, #161B1F 55%, #101518 100%);
  background-color:#101518;
  position:relative;
}
#s-home .pad::after,
#s-in .pad::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 1px,transparent 1px 5px);
}
#s-home .pad > *,
#s-in .pad > *{position:relative;z-index:1}

/* ── Nameplate on dark ───────────────────── */
#s-home .pad{padding:38px 24px 32px}
#s-home .plate{
  border:0;background:none;box-shadow:none;padding:0;
  position:relative;
}
#s-home .plate::before{
  content:'';position:absolute;left:50%;top:-14%;
  width:78%;height:120%;transform:translateX(-50%);
  background:radial-gradient(ellipse at center,rgba(217,180,103,.16) 0%,transparent 68%);
  pointer-events:none;
}
#s-home .logo svg{max-width:246px;position:relative}
#s-home .logo svg path[fill="#231f20"]{fill:#EDF1F3}
#s-home .plate .sub{
  color:#8D999F;
  border-top:0;
  margin-top:24px;padding-top:0;
  position:relative;
}
#s-home .plate .sub::before{
  content:'';position:absolute;left:50%;top:-13px;transform:translateX(-50%);
  width:64px;height:1px;
  background:linear-gradient(90deg,transparent,var(--hazard),transparent);
}

#s-home .lamp-row{
  color:#7C888F;
  margin:30px 0 24px;
  padding:11px 13px;
  border-top:1px solid #262E33;
  border-bottom:1px solid #262E33;
}

/* ── Start: illuminated pushbutton ───────── */
#s-home .start{
  background:linear-gradient(#1FA65D,#116639);
  box-shadow:
    0 8px 0 #0A4426,
    0 14px 26px rgba(0,0,0,.5),
    0 1px 0 rgba(255,255,255,.35) inset,
    0 0 0 1px rgba(255,255,255,.07) inset;
  font-size:32px;
}
#s-home .start:active{transform:translateY(7px);box-shadow:0 1px 0 #0A4426,0 1px 0 rgba(255,255,255,.35) inset}
#s-home .start:focus-visible{outline:3px solid var(--hazard);outline-offset:5px}

/* power-on sequence */
#s-home .plate{animation:rise .5s .05s both}
#s-home .lamp-row{animation:rise .5s .16s both}
#s-home .start{animation:rise .5s .27s both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}

/* ── Sign-in on dark ─────────────────────── */
#s-in .bar{border-bottom:1px solid var(--hazard-dp)}
#s-in .pad{padding:24px 20px 28px}
#s-in .tag{color:#7C888F}
#s-in .pick{
  background-color:#1E262A;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 14 14'><path d='M2 4.5 L7 10 L12 4.5' fill='none' stroke='%23D9B467' stroke-width='1.8'/></svg>");
  border-color:#39434A;
  color:#EDF1F3;
  box-shadow:0 2px 6px rgba(0,0,0,.35) inset;
}
#s-in .pick:focus-visible{outline:3px solid var(--hazard);outline-offset:2px}
#s-in .pick optgroup{background:#1E262A;color:#8D999F}
#s-in .pick option{background:#1E262A;color:#EDF1F3}

#s-in .cell{background:#080B0D;box-shadow:0 3px 7px rgba(0,0,0,.55) inset}
#s-in .cell span{background:#232B30}

#s-in .key{
  background:linear-gradient(#2B3439,#1C2327);
  border-color:#39434A;
  color:#E4E9EB;
  box-shadow:0 3px 0 #0C1012, 0 1px 0 rgba(255,255,255,.07) inset;
}
#s-in .key:hover{border-color:#556169}
#s-in .key:active{transform:translateY(3px);box-shadow:0 0 0 #0C1012}
#s-in .key:focus-visible{outline:2px solid var(--hazard);outline-offset:2px}
#s-in .key.fn{color:#8D999F}
#s-in .key.ok{
  background:linear-gradient(#1FA65D,#116639);
  border-color:#0F5C33;color:#fff;
  box-shadow:0 3px 0 #0A4426, 0 1px 0 rgba(255,255,255,.25) inset;
}
#s-in .legend{color:#8A959B}


/* ── Name grid ───────────────────────────── */
.roster{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  max-height:46vh;
  overflow-y:auto;
  padding:2px;
  -webkit-overflow-scrolling:touch;
}
@media (max-width:400px){.roster{grid-template-columns:repeat(2,1fr)}}
.name-tile{
  border:1px solid #39434A;
  border-radius:var(--rad);
  background:linear-gradient(#2B3439,#1C2327);
  color:#E4E9EB;
  font-family:'Barlow Condensed',sans-serif;
  font-weight:600;
  font-size:16px;
  letter-spacing:.07em;
  text-transform:uppercase;
  padding:16px 6px;
  cursor:pointer;
  line-height:1.15;
  box-shadow:0 2px 0 #0C1012, 0 1px 0 rgba(255,255,255,.06) inset;
  transition:transform .07s, box-shadow .07s, border-color .15s;
}
.name-tile:hover{border-color:var(--hazard-dp);color:#fff}
.name-tile:active{transform:translateY(2px);box-shadow:0 0 0 #0C1012}
.name-tile:focus-visible{outline:2px solid var(--hazard);outline-offset:2px}

.admin-key{
  width:100%;
  margin-top:12px;
  border:1px solid #39434A;
  border-radius:var(--rad);
  background:linear-gradient(#2B3439,#1C2327);
  box-shadow:0 2px 0 #0C1012, 0 1px 0 rgba(255,255,255,.06) inset;
  color:#E4E9EB;
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  letter-spacing:.16em;
  text-transform:uppercase;
  padding:14px 8px;
  cursor:pointer;
}
.admin-key:hover{border-color:var(--hazard-dp);color:#fff}
.admin-key:active{transform:translateY(2px);box-shadow:0 0 0 #0C1012}
.admin-key:focus-visible{outline:2px solid var(--hazard);outline-offset:2px}
.ak-ico{color:var(--hazard);margin-right:5px}

/* ── Chosen-name bar ─────────────────────── */
.chosen{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  border:1px solid #39434A;border-left:4px solid var(--hazard);
  border-radius:var(--rad);background:#1E262A;padding:12px 13px;
}
.ch-cap{
  font-family:'IBM Plex Mono',monospace;font-size:9px;
  letter-spacing:.18em;text-transform:uppercase;color:#7C888F;
}
.ch-name{
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;
  letter-spacing:.08em;text-transform:uppercase;color:#EDF1F3;margin-top:2px;
}
#step-pin[hidden]{display:none}


/* ── Grouped menu ────────────────────────── */
.prog{
  display:flex;align-items:center;gap:11px;
  padding:13px 15px;margin-bottom:14px;
  background:#1A2024;border:1px solid #333C41;border-radius:var(--rad);
}
.prog .bar-track{flex:1;height:5px;background:#0D1113;border-radius:99px;overflow:hidden}
.prog .bar-fill{height:100%;background:var(--go);border-radius:99px;transition:width .4s}
.prog .txt{
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;
  letter-spacing:.13em;text-transform:uppercase;color:#8D999F;white-space:nowrap;
}

.grp{margin-bottom:12px}
.grp:last-child{margin-bottom:0}
.grp-head{
  width:100%;display:flex;align-items:center;gap:10px;
  background:none;border:0;border-bottom:1px solid #2B3439;
  padding:9px 2px 9px 4px;cursor:pointer;text-align:left;
}
.grp-head .g-lbl{
  flex:1;
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--hazard);
}
.grp-head .g-cnt{
  font-family:'IBM Plex Mono',monospace;font-size:9px;
  letter-spacing:.1em;color:#6B767C;
}
.grp-head .g-arw{color:#6B767C;font-size:11px;transition:transform .2s}
.grp.shut .g-arw{transform:rotate(-90deg)}
.grp-head:focus-visible{outline:2px solid var(--hazard);outline-offset:2px}
.grp-body{padding-top:9px}
.grp.shut .grp-body{display:none}

/* tighter rows now there are fifteen */
.menu .row{padding:13px 14px 13px 20px;margin-bottom:7px}
.menu .row .label{font-size:20px}
.menu .row .blurb{font-size:11.5px;margin-top:2px}
.row .state.ref{border:1px solid #333C41;padding:4px 7px;border-radius:var(--rad);color:#6B767C}
.row .state.ref i{display:none}


/* ── Production stages ───────────── */
.stage-note{
  margin-top:14px;border:1px dashed var(--line);border-radius:var(--rad);
  padding:22px 18px;text-align:center;
}
.stage-note h3{
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;
  letter-spacing:.07em;text-transform:uppercase;
}
.stage-note p{color:var(--ink-mid);font-size:14px;line-height:1.6;max-width:320px;margin:9px auto 0}
.stage-note .stub{
  margin-top:16px;display:inline-block;font-family:'IBM Plex Mono',monospace;
  font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-soft);
  border:1px solid var(--line);padding:8px 13px;border-radius:var(--rad);
}


/* ── Mixing sheet ────────────────────────── */
.mx{padding:16px 14px 24px}
.mx-add{
  border:1px solid var(--line);border-radius:var(--rad);
  background:#fff;padding:13px;margin-bottom:14px;
}
.mx-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mx-f label{
  display:block;font-family:'IBM Plex Mono',monospace;font-size:8.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:5px;
}
.mx-f input[list]{text-align:left;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:18px;letter-spacing:.05em;text-transform:uppercase}
.mx-f input{
  width:100%;background:#F7F9F9;border:1px solid var(--line);border-radius:var(--rad);
  padding:12px 6px;font-family:'IBM Plex Mono',monospace;font-weight:600;
  font-size:17px;text-align:center;color:var(--ink);
}
.mx-f input:focus-visible{outline:3px solid var(--go);outline-offset:2px}
.mx-save{
  width:100%;margin-top:11px;border:0;border-radius:var(--rad);cursor:pointer;
  background:linear-gradient(var(--go),var(--go-lo));color:#fff;
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:19px;
  letter-spacing:.17em;text-transform:uppercase;padding:15px 0 13px;
  box-shadow:0 4px 0 #0A4A28;transition:transform .07s,box-shadow .07s;
}
.mx-save:active{transform:translateY(3px);box-shadow:0 1px 0 #0A4A28}
.mx-save:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

.mx-del{
  background:none;border:0;color:var(--alarm);cursor:pointer;
  font-family:'IBM Plex Mono',monospace;font-size:14px;padding:2px 5px;line-height:1;
}
.mx-del:focus-visible{outline:2px solid var(--alarm);outline-offset:1px}
.mx-warn{
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--alarm);min-height:15px;margin-top:8px;text-align:center;
}


/* ── Resin blend lines ───────────────────── */
.rz-head{
  display:flex;align-items:center;justify-content:space-between;
  margin:14px 0 7px;
}
.rz-head span{
  font-family:'IBM Plex Mono',monospace;font-size:8.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);
}
.rz-line{
  display:grid;grid-template-columns:1fr 92px 34px;gap:7px;
  align-items:center;margin-bottom:7px;
}
.rz-line input{
  width:100%;background:#F7F9F9;border:1px solid var(--line);
  border-radius:var(--rad);padding:12px 9px;color:var(--ink);
}
.rz-line input.rz-name{
  font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:18px;
  letter-spacing:.05em;text-transform:uppercase;
}
.rz-line input.rz-bags{
  font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:17px;text-align:center;
}
.rz-line input:focus-visible{outline:3px solid var(--go);outline-offset:2px}
.rz-x{
  background:none;border:1px solid var(--line);border-radius:var(--rad);
  color:var(--ink-soft);cursor:pointer;height:44px;font-size:14px;line-height:1;
}
.rz-x:hover{border-color:var(--alarm);color:var(--alarm)}
.rz-x:focus-visible{outline:2px solid var(--alarm);outline-offset:1px}
.rz-x[disabled]{opacity:.3;cursor:not-allowed}
.rz-add{
  width:100%;background:none;border:1px dashed var(--line);border-radius:var(--rad);
  color:var(--ink-mid);font-family:'IBM Plex Mono',monospace;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;padding:11px;cursor:pointer;
}
.rz-add:hover{border-color:var(--go);color:var(--go)}
.rz-add:focus-visible{outline:2px solid var(--go);outline-offset:2px}
.rz-tot{
  display:flex;justify-content:space-between;align-items:baseline;
  margin-top:10px;padding-top:10px;border-top:1px solid var(--line);
  font-family:'IBM Plex Mono',monospace;font-size:10px;
  letter-spacing:.13em;text-transform:uppercase;color:var(--ink-soft);
}
.rz-tot b{font-size:17px;color:var(--ink)}
.blend{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-mid);white-space:normal}
.blend b{color:var(--ink);font-weight:600}


/* ── Sheet date ──────────────────────────── */
.mx-date{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  border:1px solid var(--line);border-left:4px solid var(--hazard);
  border-radius:var(--rad);background:linear-gradient(#EDF0F1,#DFE4E6);
  padding:11px 13px;margin-bottom:14px;
}
.mx-date label{
  font-family:'IBM Plex Mono',monospace;font-size:9px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);
}
.mx-date input{
  background:#fff;border:1px solid var(--line);border-radius:var(--rad);
  padding:10px 11px;font-family:'IBM Plex Mono',monospace;font-weight:600;
  font-size:15px;color:var(--ink);
}
.mx-date input:focus-visible{outline:3px solid var(--go);outline-offset:2px}
.mx-date .back-today{
  background:none;border:1px solid var(--line);border-radius:var(--rad);
  font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-mid);padding:8px 10px;cursor:pointer;
}
.mx-date .back-today:hover{border-color:var(--go);color:var(--go)}
.mx-date .back-today:focus-visible{outline:2px solid var(--go);outline-offset:2px}


/* ── Collapsible blocks ──────────────────── */
.blk{border:1px solid var(--line);border-radius:var(--rad);background:#fff;margin-bottom:12px;overflow:hidden}
.blk-head{
  width:100%;display:flex;align-items:center;gap:10px;
  background:linear-gradient(#EDF0F1,#DFE4E6);border:0;
  border-bottom:1px solid var(--line);padding:13px 14px;cursor:pointer;text-align:left;
}
.blk-head .b-lbl{
  flex:1;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:18px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink);
}
.blk-head .b-cnt{
  font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-soft);
}
.blk-head .b-arw{color:var(--ink-soft);font-size:11px;transition:transform .2s}
.blk.shut .b-arw{transform:rotate(-90deg)}
.blk.shut .blk-body{display:none}
.blk-head:focus-visible{outline:2px solid var(--go);outline-offset:-3px}
.blk-body{padding:13px}

/* ── Pass / fail ─────────────────────────── */
.pf{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:5px}
.pf button{
  border:1px solid var(--line);border-radius:var(--rad);background:#F7F9F9;
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:18px;
  letter-spacing:.15em;text-transform:uppercase;color:var(--ink-mid);
  padding:13px 0 11px;cursor:pointer;
}
.pf button:focus-visible{outline:3px solid var(--go);outline-offset:2px}
.pf button.on.pass{background:linear-gradient(var(--go),var(--go-lo));color:#fff;border-color:var(--go-lo)}
.pf button.on.mac{background:linear-gradient(#2B3439,#1C2327);color:var(--hazard);border-color:#0C1012}
.pf button.on.fail{background:linear-gradient(#C4362B,#93271E);color:#fff;border-color:#93271E}

.fld{margin-bottom:9px}
.fld label{
  display:block;font-family:'IBM Plex Mono',monospace;font-size:8.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:5px;
}
.fld input,.fld textarea,.fld select{
  width:100%;background:#F7F9F9;border:1px solid var(--line);border-radius:var(--rad);
  padding:12px 10px;color:var(--ink);font-family:'Barlow',sans-serif;font-size:15px;
}
.fld input.mono{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:17px;text-align:center}
.fld textarea{min-height:74px;resize:vertical;line-height:1.5}
.fld input:focus-visible,.fld textarea:focus-visible,.fld select:focus-visible{
  outline:3px solid var(--go);outline-offset:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}

.tag-pass{color:var(--go);font-weight:600}
.tag-fail{color:var(--alarm);font-weight:600}
.note-cell{white-space:normal;max-width:190px;color:var(--ink-mid);font-family:'Barlow',sans-serif;font-size:12.5px}
.saved{
  font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--go);min-height:13px;margin-top:6px;
}


/* ── Machine status panel ────────────────── */
.st-panel{
  border-radius:var(--rad);
  background:radial-gradient(120% 90% at 50% 0%,#232B30 0%,#161B1F 60%,#101518 100%);
  border:1px solid #333C41;
  padding:18px 16px 16px;
  margin-bottom:14px;
  text-align:center;
}
.st-lamp{display:flex;align-items:center;justify-content:center;gap:11px;margin-bottom:4px}
.st-lamp i{width:15px;height:15px;border-radius:50%;background:#39434A}
.st-lamp.up i{background:var(--go);box-shadow:0 0 12px rgba(23,134,75,.85);animation:breathe 2.6s ease-in-out infinite}
.st-lamp.down i{background:var(--alarm);box-shadow:0 0 12px rgba(196,54,43,.8)}
.st-lamp b{
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:30px;
  letter-spacing:.19em;text-transform:uppercase;color:#EDF1F3;
}
.st-since{
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:#8D999F;
}
.st-btn{
  width:100%;margin-top:15px;border:0;border-radius:var(--rad);cursor:pointer;color:#fff;
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:24px;
  letter-spacing:.18em;text-transform:uppercase;padding:19px 0 17px;
  transition:transform .07s,box-shadow .07s;
}
.st-btn.go-on{background:linear-gradient(#1FA65D,#116639);box-shadow:0 6px 0 #0A4426}
.st-btn.go-on:active{transform:translateY(5px);box-shadow:0 1px 0 #0A4426}
.st-btn.go-off{background:linear-gradient(#C4362B,#93271E);box-shadow:0 6px 0 #6B1B15}
.st-btn.go-off:active{transform:translateY(5px);box-shadow:0 1px 0 #6B1B15}
.st-btn:focus-visible{outline:3px solid var(--hazard);outline-offset:4px}

.st-split{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.st-cell{background:#0D1113;border-radius:var(--rad);padding:11px 8px;box-shadow:0 2px 5px rgba(0,0,0,.4) inset}
.st-cell .cap{font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.15em;
  text-transform:uppercase;color:#7C888F}
.st-cell .val{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:19px;margin-top:4px}
.st-cell.up .val{color:var(--go)}
.st-cell.down .val{color:#E0665B}
.st-bar{display:flex;height:6px;border-radius:99px;overflow:hidden;margin-top:12px;background:#0D1113}
.st-bar i{display:block;height:100%}
.st-bar i.up{background:var(--go)}
.st-bar i.down{background:var(--alarm)}
.st-log{
  margin-top:12px;font-family:'IBM Plex Mono',monospace;font-size:10px;
  color:#7C888F;line-height:1.75;text-align:left;
}
.st-log b{color:#EDF1F3;font-weight:600}
.st-undo{
  background:none;border:0;color:#E0665B;font-family:'IBM Plex Mono',monospace;
  font-size:9px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;
  text-decoration:underline;padding:3px;margin-left:6px;
}


/* ── Save failure notice ─────────────────── */
#save-alert{
  position:fixed;left:0;right:0;top:0;z-index:99;
  padding-top:calc(11px + env(safe-area-inset-top));
  background:var(--alarm);color:#fff;
  font-family:'IBM Plex Mono',monospace;font-size:11px;
  letter-spacing:.08em;line-height:1.5;
  padding:11px 14px;text-align:center;
  transform:translateY(-100%);transition:transform .25s;
}
#save-alert.on{transform:translateY(0)}
#save-alert b{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase}


/* ── Three-way roll result ───────────────── */
.pf3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:5px}
.pf3 button{
  border:1px solid var(--line);border-radius:var(--rad);background:#F7F9F9;
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink-mid);
  padding:14px 3px 12px;cursor:pointer;line-height:1.1;
}
.pf3 button:focus-visible{outline:3px solid var(--go);outline-offset:2px}
.pf3 button.on.r-pass{background:linear-gradient(var(--go),var(--go-lo));color:#fff;border-color:var(--go-lo)}
.pf3 button.on.r-rej{background:linear-gradient(#C4362B,#93271E);color:#fff;border-color:#93271E}
.pf3 button.on.r-q{background:linear-gradient(#D9A93A,#A87C15);color:#231f20;border-color:#A87C15}
.tag-q{color:#9A6F14;font-weight:600}
.sum.q .val{color:#9A6F14}


/* ── Good rolls headline ─────────────────── */
.good-hero{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  border:1px solid var(--line);border-left:5px solid var(--hazard);
  border-radius:var(--rad);
  background:linear-gradient(#F2EEE2,#E6DFCC);
  padding:16px 20px;margin-bottom:12px;
}
.good-hero .cap{
  font-family:'IBM Plex Mono',monospace;font-size:10px;
  letter-spacing:.19em;text-transform:uppercase;color:#6B5A32;
}
.good-hero .sub{
  font-family:'Barlow',sans-serif;font-size:12px;color:#645739;margin-top:3px;
}
.good-hero .val{
  font-family:'IBM Plex Mono',monospace;font-weight:600;
  font-size:52px;line-height:.9;color:#8A6410;
}


/* ── File picker ─────────────────────────── */
.fld input[type=file]{
  padding:11px 10px;font-family:'IBM Plex Mono',monospace;font-size:12px;
  background:#fff;cursor:pointer;
}
.fld input[type=file]::file-selector-button{
  border:1px solid var(--line);border-radius:var(--rad);background:#EDF0F1;
  font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:13px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink);
  padding:8px 12px;margin-right:11px;cursor:pointer;
}
.fld input[type=file]::file-selector-button:hover{border-color:var(--go);color:var(--go)}
.tbl .tool{padding:6px 10px;font-size:9px}


/* ── Sample photos ───────────────────────── */
.thumb{
  width:52px;height:52px;object-fit:cover;border-radius:var(--rad);
  border:1px solid var(--line);cursor:pointer;display:block;
}
.thumb:hover{border-color:var(--go)}
.img-pick{display:flex;align-items:center;gap:11px;margin-top:5px}
.img-pick .prev{
  width:56px;height:56px;object-fit:cover;border-radius:var(--rad);
  border:1px solid var(--line);flex:0 0 auto;
}
.img-pick .none{
  width:56px;height:56px;border:1px dashed var(--line);border-radius:var(--rad);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  color:var(--ink-soft);font-size:19px;
}
.img-pick input{flex:1;min-width:0}
.img-note{
  font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-soft);margin-top:6px;
}

#lightbox{
  position:fixed;inset:0;z-index:200;display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:12px;
  background:rgba(12,16,18,.92);padding:22px;
}
#lightbox.on{display:flex}
#lightbox img{max-width:100%;max-height:78vh;border-radius:var(--rad);border:1px solid #333C41}
#lightbox .lb-cap{
  font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;color:#9BA7AD;
}
#lightbox .lb-x{
  position:absolute;top:16px;right:16px;
  background:none;border:1px solid #4C575E;color:#EDF1F3;
  border-radius:var(--rad);width:38px;height:38px;font-size:15px;cursor:pointer;
}
#lightbox .lb-x:hover{background:#242C31}
#lightbox .lb-x:focus-visible{outline:2px solid var(--hazard);outline-offset:2px}


/* ── Pending work cards ──────────────────── */
.job{
  border:1px solid var(--line);border-left:4px solid var(--alarm);
  border-radius:var(--rad);background:#fff;padding:13px 14px;margin-bottom:9px;
}
.job.shut-job{border-left-color:var(--go);opacity:.72}
.job.need{border-left-color:var(--hazard)}
.job-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.job-title{
  flex:1;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:19px;
  letter-spacing:.04em;text-transform:uppercase;line-height:1.15;color:var(--ink);
}
.job.shut-job .job-title{text-decoration:line-through;color:var(--ink-mid)}
.job-meta{
  display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:6px;
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);
}
.job-mach{color:var(--ink-mid);font-weight:600}
.due-late{color:var(--alarm);font-weight:600}
.due-soon{color:#9A6F14;font-weight:600}
.job-note{
  margin-top:8px;font-size:13px;line-height:1.5;color:var(--ink-mid);
  border-top:1px solid #EDF0F1;padding-top:8px;
}
.job-states{margin-top:11px}
.job-states button{font-size:12px;letter-spacing:.05em;padding:10px 2px 9px}


/* ── Store ───────────────────────────────── */
.qty-in{
  width:66px;background:#F7F9F9;border:1px solid var(--line);border-radius:var(--rad);
  padding:7px 5px;font-family:'IBM Plex Mono',monospace;font-weight:600;
  font-size:14px;text-align:center;color:var(--ink);
}
.qty-in:focus-visible{outline:3px solid var(--go);outline-offset:2px}
.low-row td{background:#FBF0EE!important}
.chip-low{
  display:inline-block;background:var(--alarm);color:#fff;
  font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:.12em;
  text-transform:uppercase;padding:2px 5px;border-radius:2px;vertical-align:middle;
}


/* ── Section lock ────────────────────────── */
.lockwrap{
  border-radius:var(--rad);margin:14px;padding:26px 20px 24px;
  background:radial-gradient(120% 85% at 50% 0%,#232B30 0%,#161B1F 55%,#101518 100%);
  border:1px solid #333C41;text-align:center;
}
.lockwrap .lk-ico{font-size:26px;color:var(--hazard);line-height:1}
.lockwrap h3{
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:24px;
  letter-spacing:.16em;text-transform:uppercase;color:#EDF1F3;margin-top:9px;
}
.lockwrap p{
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.13em;
  text-transform:uppercase;color:#8A959B;margin-top:6px;
}
.lockwrap .readout{margin:20px 0 8px}
.lockwrap .cell{background:#080B0D;box-shadow:0 3px 7px rgba(0,0,0,.55) inset;height:54px}
.lockwrap .cell span{background:#232B30}
.lockwrap .key{
  background:linear-gradient(#2B3439,#1C2327);border-color:#39434A;color:#E4E9EB;
  box-shadow:0 3px 0 #0C1012, 0 1px 0 rgba(255,255,255,.07) inset;height:58px;
}
.lockwrap .key:active{transform:translateY(3px);box-shadow:0 0 0 #0C1012}
.lockwrap .key.fn{color:#8A959B}
.lockwrap .key.ok{
  background:linear-gradient(#1FA65D,#116639);border-color:#0F5C33;color:#fff;
  box-shadow:0 3px 0 #0A4426, 0 1px 0 rgba(255,255,255,.25) inset;
}
.lockwrap .err{text-align:center;color:#E0665B}


/* ── Approve / reject ────────────────────── */
.decide{display:flex;flex-direction:column;gap:5px;min-width:96px}
.decide button{
  border:1px solid var(--line);border-radius:var(--rad);background:#F7F9F9;
  font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:12px;
  letter-spacing:.11em;text-transform:uppercase;color:var(--ink-mid);
  padding:7px 4px;cursor:pointer;white-space:nowrap;
}
.decide button:hover{border-color:var(--ink-soft)}
.decide button:focus-visible{outline:2px solid var(--go);outline-offset:1px}
.decide button.r-pass.on{background:linear-gradient(var(--go),var(--go-lo));color:#fff;border-color:var(--go-lo)}
.decide button.r-rej.on{background:linear-gradient(#C4362B,#93271E);color:#fff;border-color:#93271E}
.decide .undo-dec{
  background:none;border:0;color:var(--ink-soft);font-family:"IBM Plex Mono",monospace;
  font-size:9px;letter-spacing:.1em;text-decoration:underline;padding:3px;
}


/* ── Schedule ─────────────────── */
.cover-warn{
  background:#FBE9E7;border:1px solid #E8B4AE;border-radius:var(--rad);
  color:var(--alarm);font-family:'IBM Plex Mono',monospace;font-size:10px;
  letter-spacing:.09em;text-transform:uppercase;padding:11px 13px;margin-bottom:12px;
  text-align:center;
}
.day-list{margin:-3px 0}
.day-list .my-day, .menu .row, .job{content-visibility:auto; contain-intrinsic-size:auto 48px}
@media (min-width:700px){
  .day-list{display:grid;grid-template-columns:repeat(2,1fr);gap:0 10px}
}
@media (min-width:1040px){
  .day-list{grid-template-columns:repeat(3,1fr)}
}
.blk-body .my-day{margin-bottom:5px}
.blk-body .my-day:last-child{margin-bottom:0}
.day-set{display:grid;grid-template-columns:repeat(4,34px);gap:4px;margin:0}
.day-set button{
  border:1px solid var(--line);border-radius:var(--rad);background:#F7F9F9;
  font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:12px;
  color:var(--ink-soft);padding:8px 0;cursor:pointer;line-height:1;
}
.day-set button:focus-visible{outline:2px solid var(--go);outline-offset:1px}
.day-set button.r-pass.on{background:var(--go);color:#fff;border-color:var(--go-lo)}
.day-set button.r-q.on{background:#2F3E77;color:#fff;border-color:#2F3E77}
.day-set button.r-rej.on{background:#8D999F;color:#fff;border-color:#7C888F}
.day-set .x-set{color:var(--ink-soft);font-size:10px}
.day-set .x-set:hover{border-color:var(--alarm);color:var(--alarm)}
/* operator's own month */
.my-day{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  border:1px solid var(--line);border-left:4px solid var(--line);
  border-radius:var(--rad);background:#fff;padding:10px 13px;margin-bottom:6px;
}
.my-day.d{border-left-color:var(--go)}
.my-day.n{border-left-color:#2F3E77}
.my-day.o{border-left-color:#C0C8CC;opacity:.66}
.my-day.today{box-shadow:0 0 0 2px var(--hazard)}
.my-day .dt{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink)}
.my-day .dt b{font-family:'Barlow Condensed',sans-serif;font-size:16px;letter-spacing:.06em;text-transform:uppercase}
.my-day .sh{
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;
  letter-spacing:.13em;text-transform:uppercase;
}
.my-day.d .sh{color:var(--go)}
.my-day.n .sh{color:#2F3E77}
.my-day.o .sh{color:var(--ink-soft)}


/* ── Schedule pickers ────────────────────── */
.pickers{
  border:1px solid var(--line);border-left:4px solid var(--hazard);
  border-radius:var(--rad);background:linear-gradient(#EDF0F1,#DFE4E6);
  padding:13px 14px;margin-bottom:14px;
}
.pickers .fld label{
  font-size:9.5px;letter-spacing:.18em;color:#5E6B72;margin-bottom:6px;
}
input.big-pick, select.big-pick{
  width:100%;background:#fff;border:1px solid var(--line);border-radius:var(--rad);
  padding:14px 12px;color:var(--ink);
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;
  letter-spacing:.06em;text-transform:uppercase;
}
input.big-pick{font-family:'IBM Plex Mono',monospace;font-size:16px;letter-spacing:.04em}
input.big-pick:focus-visible, select.big-pick:focus-visible{
  outline:3px solid var(--go);outline-offset:2px;
}

@media (min-width:760px){
  .sums{grid-template-columns:repeat(3,1fr)}
  .two{grid-template-columns:1fr 1fr}
  .roster{grid-template-columns:repeat(5,1fr)}
  #s-home .pad{padding-top:56px}
  #s-home .logo svg{max-width:300px}
  .mx-grid3{grid-template-columns:repeat(3,1fr)}
}

/* wide screens: the section menu and card lists use the space */
@media (min-width:1100px){
  .grp-body{display:grid;grid-template-columns:repeat(2,1fr);gap:0 10px}
  .menu .row{margin-bottom:8px}
  .roster{grid-template-columns:repeat(8,1fr)}
  #s-home .pad, #s-in .pad{max-width:640px;margin:0 auto}   /* sign-in stays centred */
}
@media (min-width:1500px){
  .grp-body{grid-template-columns:repeat(3,1fr)}
}


/* ══ Compact pass ═══════════════════════════
   Trims the whole interface so more fits on
   screen. Touch targets stay above 40px.     */

/* containers */
.pad{padding:20px 16px 22px}
#s-home .pad{padding:28px 18px 24px}
#s-in .pad{padding:18px 16px 20px}
.menu{padding:12px 12px 16px}
.mx, .rc{padding:12px 12px 40px}
.blk-body{padding:10px}
.grp{margin-bottom:9px}
.grp-body{padding-top:7px}

/* header bar */
.bar{padding-top:9px;padding-bottom:9px}
.bar .who{font-size:16px}
.bar .meta{font-size:9px}
.crown svg{width:21px}
.ghost{padding:6px 9px;font-size:9px}

/* section rows */
.menu .row{padding:10px 12px 10px 17px;margin-bottom:6px}
.menu .row .label{font-size:17px;letter-spacing:.09em}
.menu .row .blurb{font-size:11px;margin-top:1px}
.row .num{font-size:11px;width:20px}
.row .state{font-size:8.5px;padding:3px 6px}
.row .chev{font-size:18px}
.grp-head{padding:7px 2px 7px 4px}
.grp-head .g-lbl{font-size:13px}
.prog{padding:10px 12px;margin-bottom:11px}

/* counters */
.sums{gap:7px;margin-bottom:11px}
.sum{padding:9px 8px}
.sum .cap{font-size:8px}
.sum .val{font-size:17px;margin-top:3px}

/* forms */
.mx-add{padding:11px;margin-bottom:11px}
.fld{margin-bottom:7px}
.fld label{font-size:8px;margin-bottom:4px}
.fld input,.fld textarea,.fld select{padding:10px 9px;font-size:14px}
.fld textarea{min-height:60px}
.fld input.mono{font-size:15px}
.mx-f label{font-size:8px}
.mx-f input{padding:10px 5px;font-size:15px}
.mx-save{padding:12px 0 10px;font-size:17px}
.mx-date{padding:9px 11px;margin-bottom:11px}
.pickers{padding:10px 11px;margin-bottom:11px}
input.big-pick, select.big-pick{padding:11px 10px;font-size:17px}
.pf button,.pf3 button{padding:11px 2px 9px;font-size:14px}
.rz-line input{padding:10px 8px}
.rz-line{grid-template-columns:1fr 82px 30px;gap:6px;margin-bottom:6px}
.rz-x{height:40px}
.rz-add{padding:9px}

/* tables */
.tbl thead th{padding:7px 7px;font-size:8.5px}
.tbl.pol thead th{padding:9px 9px;font-size:9.5px}
.tbl tbody td{padding:8px 7px;font-size:11.5px}
.tbl.pol tbody td{padding:10px 9px;font-size:13px}
.tbl .who-cell{font-size:13px}
.note-cell{font-size:11.5px;max-width:170px}
.empty{padding:30px 16px;font-size:10px}
.filters{gap:7px;margin-bottom:11px}
.filters select,.filters input{padding:9px 8px;font-size:14px}

/* cards */
.job{padding:10px 12px;margin-bottom:7px}
.job-title{font-size:17px}
.job-meta{font-size:9px;margin-top:5px}
.job-note{font-size:12px;margin-top:6px;padding-top:6px}
.job-states{margin-top:8px}
.my-day{padding:7px 11px;margin-bottom:5px}
.my-day .dt{font-size:11px}
.my-day .dt b{font-size:14px}
.day-set{grid-template-columns:repeat(4,34px);gap:4px}
.day-set button{padding:11px 0;font-size:12px}   /* stays a 36px target */

/* machine status */
.st-panel{padding:14px 13px 13px;margin-bottom:11px}
.st-lamp b{font-size:25px}
.st-btn{padding:15px 0 13px;font-size:20px;margin-top:12px}
.st-split{gap:7px;margin-top:11px}
.st-cell{padding:9px 7px}
.st-cell .val{font-size:16px}
.st-log{font-size:9px}

/* entry screens */
#s-home .start{font-size:27px;padding:20px 0 18px}
#s-home .lamp-row{margin:22px 0 18px;padding:9px 11px}
#s-home .logo svg{max-width:214px}
#s-home .plate .sub{font-size:13px;margin-top:18px}
.name-tile{padding:12px 5px;font-size:14px}
.roster{gap:6px}
#s-in .key{height:52px;font-size:21px}
#s-in .cell{height:50px}
.good-hero{padding:12px 16px}
.good-hero .val{font-size:42px}

@media (min-width:760px){
  .mx, .rc, .menu{padding-left:16px;padding-right:16px}
}


/* ── Targets ─────────────────────────────── */
.tg-card{
  border:1px solid var(--line);border-radius:var(--rad);background:#fff;
  padding:12px 14px;margin-bottom:9px;
}
.tg-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:9px}
.tg-name{
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--ink);
}
.tg-fig{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:20px;color:var(--ink)}
.tg-fig em{font-style:normal;font-size:13px;color:var(--ink-soft)}
.tg-track{
  display:block;height:12px;background:#E4E8EA;border-radius:99px;overflow:hidden;
  box-shadow:0 1px 2px rgba(0,0,0,.12) inset;
}
.tg-fill{display:block;height:100%;border-radius:99px;transition:width .45s}
.tg-fill.r{background:linear-gradient(90deg,#1FA65D,#116639)}
.tg-fill.l{background:linear-gradient(90deg,#D9B467,#A87C15)}
.tg-foot{
  display:flex;justify-content:space-between;margin-top:7px;
  font-family:'IBM Plex Mono',monospace;font-size:9px;
  letter-spacing:.11em;text-transform:uppercase;color:var(--ink-soft);
}

.chart{
  border:1px solid var(--line);border-radius:var(--rad);background:#fff;
  padding:12px 12px 9px;margin-top:11px;
}
.chart-bars{
  display:flex;align-items:flex-end;gap:2px;height:92px;
  border-bottom:1px solid var(--line);
}
.cb{flex:1;height:100%;display:flex;align-items:flex-end;min-width:4px}
.cb-fill{width:100%;border-radius:2px 2px 0 0;min-height:2px}
.cb-fill.r{background:#1FA65D}
.cb-fill.l{background:#C79B3A}
.cb.now .cb-fill{outline:2px solid var(--hazard);outline-offset:1px}
.chart-x{
  display:flex;justify-content:space-between;margin-top:6px;
  font-family:'IBM Plex Mono',monospace;font-size:8.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);
}


/* ── Month result ────────────────────────── */
.tg-result{
  border:1px solid var(--line);border-radius:var(--rad);
  background:linear-gradient(#EDF0F1,#DFE4E6);
  padding:12px 14px;margin-bottom:11px;
}
.rs-head{
  font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.19em;
  text-transform:uppercase;color:var(--ink-soft);
  padding-bottom:9px;margin-bottom:9px;border-bottom:1px solid var(--line);
}
.rs-row{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;
  padding:8px 0;border-bottom:1px solid rgba(0,0,0,.06);
}
.rs-row:last-child{border-bottom:0;padding-bottom:0}
.rs-name{
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;
  letter-spacing:.15em;text-transform:uppercase;color:var(--ink);min-width:62px;
}
.rs-pct{
  font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:30px;line-height:1;
}
.rs-row.hit  .rs-pct{color:var(--go)}
.rs-row.near .rs-pct{color:#8A6410}
.rs-row.miss .rs-pct{color:var(--alarm)}
.rs-detail{
  text-align:right;font-family:'IBM Plex Mono',monospace;font-size:10px;
  line-height:1.5;color:var(--ink-mid);
}
.rs-detail em{font-style:normal;color:var(--ink-soft);font-size:9px;letter-spacing:.06em}
.rs-none{
  font-family:'IBM Plex Mono',monospace;font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);
}


/* ── Targets by material ─────────────────── */
.tg-mat{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:18px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--ink);
  padding-bottom:9px;margin-bottom:10px;border-bottom:1px solid var(--line);
}
.tg-metric + .tg-metric{margin-top:12px}
.tg-fig{text-align:right}
.tg-fig em{display:block;font-style:normal;font-size:10px;color:var(--ink-soft);margin-top:2px}
.tg-fig.hit{color:var(--go)}
.tg-fig.near{color:#8A6410}
.tg-fig.miss{color:var(--alarm)}
.tg-card.hit{border-left:4px solid var(--go)}
.tg-card.near{border-left:4px solid #C79B3A}
.tg-card.miss{border-left:4px solid var(--alarm)}
.tg-card.total{background:linear-gradient(#EDF0F1,#DFE4E6)}
.tg-card.total .tg-mat{font-size:20px}
.closed-tag{
  font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.19em;
  text-transform:uppercase;color:var(--ink-soft);text-align:center;
  border:1px dashed var(--line);border-radius:var(--rad);padding:8px;margin-bottom:11px;
}
.filters .seg{margin-bottom:0}


.tg-edit.two-edit{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tg-edit.two-edit span{display:flex;flex-direction:column;gap:5px}
.tg-edit.two-edit input{width:100%}
.tg-edit{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);
}
.tg-edit label{
  font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--ink-soft);
}
input.tg-num{
  width:104px;background:#F7F9F9;border:1px solid var(--line);border-radius:var(--rad);
  padding:9px 8px;font-family:'IBM Plex Mono',monospace;font-weight:600;
  font-size:16px;text-align:center;color:var(--ink);
}
input.tg-num:focus-visible{outline:3px solid var(--go);outline-offset:2px}


.tg-mach{
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-mid);
  background:#EDF0F1;border:1px solid var(--line);border-radius:var(--rad);
  display:inline-block;padding:4px 8px;margin:-4px 0 10px;
}
select.tg-mach-pick{
  width:150px;background:#F7F9F9;border:1px solid var(--line);border-radius:var(--rad);
  padding:8px;font-family:'Barlow Condensed',sans-serif;font-weight:600;
  font-size:14px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink);
}
select.tg-mach-pick:focus-visible{outline:3px solid var(--go);outline-offset:2px}


/* ── Monthly stats ───────────────────────── */
.st-group{
  border:1px solid var(--line);border-radius:var(--rad);background:#fff;
  margin-bottom:10px;overflow:hidden;
}
.st-head{
  width:100%;display:flex;align-items:center;gap:10px;cursor:pointer;text-align:left;
  background:linear-gradient(#EDF0F1,#DFE4E6);border:0;border-bottom:1px solid var(--line);
  padding:9px 13px;
}
.st-head:focus-visible{outline:2px solid var(--go);outline-offset:-3px}
.st-title{
  flex:1;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;
  letter-spacing:.17em;text-transform:uppercase;color:var(--ink);
}
.st-chip{
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;
  color:var(--ink-mid);white-space:nowrap;
}
.st-arw{color:var(--ink-soft);font-size:10px;transition:transform .2s}
.st-group.shut .st-arw{transform:rotate(-90deg)}
.st-group.shut .st-body{display:none}
.st-group.shut .st-head{border-bottom:0}
.st-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:9px 13px;border-bottom:1px solid #EDF0F1;
}
.st-row:last-child{border-bottom:0}
.st-lab{
  font-family:'Barlow',sans-serif;font-size:13.5px;color:var(--ink-mid);
  line-height:1.3;
}
.st-val{
  text-align:right;font-family:'IBM Plex Mono',monospace;font-weight:600;
  font-size:17px;color:var(--ink);white-space:nowrap;
}
.st-val em{
  display:block;font-style:normal;font-weight:400;font-size:9.5px;
  letter-spacing:.06em;color:var(--ink-soft);margin-top:2px;
}
.st-row.good{background:#F1F8F3}
.st-row.good .st-val{color:var(--go)}
.st-row.warn .st-val{color:#8A6410}
.st-row.bad{background:#FBF0EE}
.st-row.bad .st-val{color:var(--alarm)}


/* ── Bonus score ─────────────────────────── */
.bn-total{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  border:1px solid var(--line);border-left:5px solid var(--line);
  border-radius:var(--rad);background:linear-gradient(#EDF0F1,#DFE4E6);
  padding:13px 16px;margin-bottom:12px;
}
.bn-total.hit{border-left-color:var(--go)}
.bn-total.near{border-left-color:#C79B3A}
.bn-total.miss{border-left-color:var(--alarm)}
.bn-cap{
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink);
}
.bn-sub{
  font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--ink-soft);margin-top:3px;
}
.bn-fig{
  font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:40px;
  line-height:1;color:var(--ink);text-align:right;
}
.bn-total.hit .bn-fig{color:var(--go)}
.bn-total.near .bn-fig{color:#8A6410}
.bn-total.miss .bn-fig{color:var(--alarm)}
.bn-fig em{display:block;font-style:normal;font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-soft);margin-top:4px}

.bn-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  border:1px solid var(--line);border-radius:var(--rad);background:#fff;
  padding:10px 12px;margin-bottom:7px;
}
.bn-name{
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink);
}
.bn-hint{
  display:block;font-family:'Barlow',sans-serif;font-weight:400;font-size:11px;
  letter-spacing:0;text-transform:none;color:var(--ink-soft);margin-top:2px;
}
.bn-scale{display:grid;grid-template-columns:repeat(5,34px);gap:4px;flex:0 0 auto}
.bn-btn{
  border:1px solid var(--line);border-radius:var(--rad);background:#F7F9F9;
  font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;
  color:var(--ink-soft);padding:10px 0;cursor:pointer;line-height:1;
}
.bn-btn:hover{border-color:var(--ink-soft)}
.bn-btn:focus-visible{outline:2px solid var(--go);outline-offset:1px}
.bn-btn.on{background:var(--go);border-color:var(--go-lo);color:#fff}

.bn-row.read{padding:9px 12px}
.bn-dots{display:flex;align-items:center;gap:5px}
.bn-dots i{width:12px;height:12px;border-radius:50%;background:#E4E8EA;
  border:1px solid var(--line);display:inline-block}
.bn-dots i.on{background:var(--go);border-color:var(--go-lo)}
.bn-dots b{font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--ink);margin-left:5px}
.hit-txt b{color:var(--go)}
.near-txt b{color:#8A6410}
.miss-txt b{color:var(--alarm)}


/* ══ App feel ═══════════════════════════════
   A persistent bottom bar, screen transitions
   and native-feeling touch behaviour.        */

/* nothing selectable or highlighted on tap */
.row, .bar, .grp-head, .blk-head, .st-head, .key, .name-tile, .tab-btn,
.mx-save, .tool, .ghost, .pf button, .pf3 button, .bn-btn, .day-set button,
.st-btn, .start, .mx-del, .rz-x, .chev, .sum, .num{
  -webkit-user-select:none; user-select:none;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
}
input, textarea, select, .note-cell, .job-note, .tbl td{ -webkit-user-select:auto; user-select:auto }

/* momentum scrolling inside the app shell */
.chassis{ -webkit-overflow-scrolling:touch }

/* screens slide in rather than snapping */
.screen.on{ animation:screen-in .22s cubic-bezier(.32,.72,0,1) both }
@keyframes screen-in{ from{ opacity:0; transform:translateX(14px) } }
.screen.on.back{ animation:screen-back .22s cubic-bezier(.32,.72,0,1) both }
@keyframes screen-back{ from{ opacity:0; transform:translateX(-14px) } }

/* everything tappable presses in slightly */
.row:active, .name-tile:active, .blk-head:active, .st-head:active,
.tool:active, .ghost:active{ transform:scale(.985) }
.row, .name-tile{ transition:transform .09s }

/* ── Bottom bar ──────────────────────────── */
#s-app{ padding-bottom:74px }              /* clear the bar */
.tabbar::after{
  content:''; position:absolute; left:0; right:0; top:100%;
  height:env(safe-area-inset-bottom); background:inherit;
}
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:60;
  display:grid; grid-template-columns:repeat(3,1fr);
  background:rgba(20,24,27,.96);
  backdrop-filter:saturate(180%) blur(14px);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-top:1px solid #2B3439;
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar button{
  background:none; border:0; cursor:pointer;
  padding:10px 4px 9px; color:#7C888F;
  display:flex; flex-direction:column; align-items:center; gap:4px;
  -webkit-tap-highlight-color:transparent;
}
.tabbar button .ico{ font-size:17px; line-height:1 }
.tabbar button .lbl{
  font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:11px;
  letter-spacing:.13em; text-transform:uppercase;
}
.tabbar button .pip{
  position:absolute; margin:-14px 0 0 22px;
  min-width:16px; height:16px; border-radius:99px;
  background:var(--alarm); color:#fff;
  font-family:'IBM Plex Mono',monospace; font-size:9px; line-height:16px;
  padding:0 4px;
}
.tabbar button.on{ color:var(--hazard) }
.tabbar button.on .ico{ transform:translateY(-1px) }
.tabbar button:focus-visible{ outline:2px solid var(--hazard); outline-offset:-4px }

/* the bar jumps to a group rather than filtering to it */
.menu .grp{ scroll-margin-top:8px }


/* ══ Fit the phone screen ═══════════════════
   Nothing may push the page wider than the
   viewport, which is what caused content to
   sit off the right-hand edge.               */
html, body{ max-width:100%; overflow-x:hidden }
.chassis{ max-width:100%; overflow-x:clip }

/* grid and flex children default to min-width:auto, which lets long
   words and wide tables force the whole page wider */
.row, .row .body, .job, .job-top, .my-day, .bn-row, .st-row, .tg-card,
.blk, .blk-body, .grp, .grp-body, .mx, .rc, .menu, .pad,
.sums, .sum, .two, .mx-grid3, .filters, .pickers{ min-width:0 }

.row .label, .row .blurb, .job-title, .bn-name, .st-lab, .tg-mat{
  overflow-wrap:anywhere;
}

/* long tables scroll inside their own box rather than stretching the page */
.tbl-wrap{ max-width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch }

/* the score and shift pickers were the widest fixed blocks on the page */
@media (max-width:420px){
  .bn-row{ flex-direction:column; align-items:stretch; gap:9px }
  .bn-scale{ grid-template-columns:repeat(5,1fr) }
  .my-day{ gap:8px }
  .day-set{ grid-template-columns:repeat(4,1fr); min-width:132px }
  .decide{ min-width:0 }
  .good-hero .val{ font-size:38px }
  .bn-fig{ font-size:34px }
}

img, svg, video, table{ max-width:100% }


/* ══ Entry screens fill the phone ═══════════
   The dark surface sat on .pad, which is only
   as tall as its content — leaving the panel
   colour showing below it.                   */
/* every screen fills the phone, and its main block stretches with it,
   so no pale background can show below the content */
.screen.on{
  display:flex;
  flex-direction:column;
  min-height:100vh;
  min-height:100dvh;
}
.screen.on > .pad,
.screen.on > .menu,
.screen.on > #page-body,
.screen.on > #rec-body{ flex:1 0 auto }

#s-home .pad, #s-in .pad{
  display:flex;
  flex-direction:column;
}
#s-home .pad{ justify-content:center }        /* logo and START sit centred */
#s-in .pad{ justify-content:flex-start }      /* keypad stays under the header */

/* the whole chassis matches, so nothing pale shows through anywhere */
html.dark-shell, html.dark-shell body, html.dark-shell .chassis{ background:#101518 }
html:not(.dark-shell), html:not(.dark-shell) body{ background:var(--panel) }


#outbox-tag{
  position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom));
  transform:translateX(-50%); z-index:70;
  background:rgba(20,24,27,.94); color:var(--hazard);
  border:1px solid #3A444A; border-radius:99px;
  font-family:'IBM Plex Mono',monospace; font-size:10px;
  letter-spacing:.12em; text-transform:uppercase;
  padding:7px 13px; pointer-events:none;
}


/* Browsers hold a tap for ~300ms in case it becomes a double-tap.
   Telling them these controls never zoom makes every press immediate. */
button, .row, .name-tile, .key, .tab-btn, .bn-btn, .day-set button,
.pf button, .pf3 button, .seg button, .tool, .ghost, .mx-del, .rz-x,
.blk-head, .grp-head, .st-head, .tabbar button, input[type=checkbox],
label, select{
  touch-action: manipulation;
}


body.no-anim *{ animation:none !important; transition:none !important }
#loading-bar{
  position:fixed; left:0; top:0; height:2px; z-index:120;
  width:100%; pointer-events:none;
  background:linear-gradient(90deg,transparent,var(--hazard),transparent);
  background-size:40% 100%; background-repeat:no-repeat;
  animation:load-sweep 1s linear infinite;
}
@keyframes load-sweep{
  from{ background-position:-40% 0 }
  to  { background-position:140% 0 }
}


/* ══ CPU Admin: view only ═══════════════════
   Everything that writes is removed. Filters,
   month pickers and downloads stay.          */
body.read-only .mx-add,              /* every entry form            */
body.read-only .mx-save,             /* add / save buttons          */
body.read-only .mx-del,              /* row delete crosses          */
body.read-only .rz-add,
body.read-only .rz-x,
body.read-only .st-btn,              /* set online / offline        */
body.read-only .st-undo,
body.read-only .tp-undo,
body.read-only .decide,              /* approve / reject leave      */
body.read-only .job-states,          /* pending work status buttons */
body.read-only .bn-scale,            /* bonus scoring               */
body.read-only .day-set,             /* schedule day buttons        */
body.read-only .tg-edit,             /* target figures              */
body.read-only .blk[data-blk$="add"],
body.read-only #tp-go,
body.read-only #sch-clear,
body.read-only #rc-seed,
body.read-only #rc-wipe,
body.read-only .tool:not(.go){ display:none !important }

/* quantities and notes become plain text */
body.read-only .qty-in,
body.read-only .tg-num{
  border:0; background:none; pointer-events:none; text-align:right; padding:0;
}
body.read-only .fld input:not(.big-pick):not([type=month]):not([type=date]),
body.read-only .fld textarea,
body.read-only .fld select:not(.big-pick){ pointer-events:none; opacity:.7 }

body.read-only .view-tag{
  display:block; text-align:center; margin:0 0 12px;
  font-family:'IBM Plex Mono',monospace; font-size:9px;
  letter-spacing:.18em; text-transform:uppercase; color:var(--ink-soft);
  border:1px dashed var(--line); border-radius:var(--rad); padding:8px;
}
.view-tag{ display:none }


#admin-keys{ display:flex; flex-direction:column; gap:7px; margin-top:12px }
#admin-keys .admin-key{
  width:100%; margin:0;
  display:flex; align-items:center; gap:9px;
  text-align:left; padding:13px 14px;
}
#admin-keys .admin-key .ak-note{
  margin-left:auto; font-size:8.5px; letter-spacing:.12em; color:#6B767C;
  text-transform:uppercase; white-space:nowrap;
}
#admin-keys .admin-key{
  font-family:'Barlow Condensed',sans-serif; font-weight:600;
  font-size:16px; letter-spacing:.09em; text-transform:uppercase;
  transition:transform .07s, box-shadow .07s, border-color .15s;
}
#admin-keys .admin-key.view .ak-ico{ color:#8D999F }
#admin-keys .admin-key.view:hover{ border-color:#8D999F }


.no-db{
  background:#3A1F1C; border:1px solid #7A3A32; border-radius:var(--rad);
  color:#F0B4AC; font-family:'IBM Plex Mono',monospace; font-size:11px;
  letter-spacing:.08em; text-align:center; padding:11px; margin-bottom:12px;
}
.no-db span{ display:block; margin-top:4px; font-size:9px; color:#C08A82 }


/* ── Handover card ───────────────────────── */
.hand{
  border:1px solid #3A444A; border-left:4px solid var(--hazard);
  border-radius:var(--rad);
  background:linear-gradient(#232B30,#1A2125);
  padding:12px 14px; margin-bottom:12px;
  overflow:hidden; transition:height .2s, opacity .2s, margin .2s, padding .2s;
}
.hand.gone{ height:0 !important; opacity:0; margin-bottom:0; padding-top:0; padding-bottom:0 }
.hand-top{ display:flex; align-items:center; gap:10px; margin-bottom:8px }
.hand-lbl{
  flex:1; font-family:'IBM Plex Mono',monospace; font-size:9px;
  letter-spacing:.17em; text-transform:uppercase; color:var(--hazard);
}
.hand-x{
  background:none; border:0; color:#6B767C; font-size:12px;
  cursor:pointer; padding:2px 4px; line-height:1;
}
.hand-x:hover{ color:#C6CFD3 }
.hand-note{
  font-family:'Barlow',sans-serif; font-size:14.5px; line-height:1.45;
  color:#DFE5E8; white-space:pre-wrap;
}
.hand-off{
  margin-top:9px; padding-top:9px; border-top:1px solid #333C41;
  font-family:'IBM Plex Mono',monospace; font-size:10px;
  letter-spacing:.1em; text-transform:uppercase; color:#E0A94A;
}


/* ── Notices ─────────────────────────────── */
#ntc-pop{
  position:fixed; inset:0; z-index:200;
  display:flex; align-items:center; justify-content:center; padding:22px;
  background:rgba(10,13,15,.72); opacity:0; transition:opacity .2s;
  backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
}
#ntc-pop.on{ opacity:1 }
.ntc-box{
  width:100%; max-width:460px;
  background:linear-gradient(#232B30,#171D21);
  border:1px solid #3A444A; border-radius:var(--rad);
  box-shadow:0 20px 50px rgba(0,0,0,.55);
  transform:translateY(10px); transition:transform .22s;
  display:flex; flex-direction:column; max-height:80vh;
}
#ntc-pop.on .ntc-box{ transform:none }
.ntc-head{
  font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:17px;
  letter-spacing:.18em; text-transform:uppercase; color:var(--hazard);
  padding:14px 16px; border-bottom:1px solid #333C41;
}
.ntc-scroll{ overflow-y:auto; padding:4px 0 }
.ntc-item{
  padding:13px 16px; border-bottom:1px solid #262E33;
  border-left:4px solid #4C575E;
}
.ntc-item:last-child{ border-bottom:0 }
.ntc-item.important{ border-left-color:#C79B3A }
.ntc-item.urgent{ border-left-color:var(--alarm); background:rgba(196,54,43,.08) }
.ntc-box.has-urgent{ border-color:#7A3A32; box-shadow:0 20px 50px rgba(0,0,0,.55), 0 0 0 1px rgba(196,54,43,.4) }
.ntc-box.has-urgent .ntc-head{ color:#E0665B }
.ntc-lvl{
  font-family:'IBM Plex Mono',monospace; font-size:8.5px;
  letter-spacing:.18em; text-transform:uppercase; color:#8D999F; margin-bottom:5px;
}
.ntc-item.important .ntc-lvl{ color:#D9B467 }
.ntc-item.urgent .ntc-lvl{ color:#E0665B }
.ntc-title{
  font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:20px;
  letter-spacing:.05em; color:#EDF1F3; line-height:1.2;
}
.ntc-body{
  font-family:'Barlow',sans-serif; font-size:14px; line-height:1.5;
  color:#B8C2C7; margin-top:6px; white-space:pre-wrap;
}
.ntc-by{
  font-family:'IBM Plex Mono',monospace; font-size:9px;
  letter-spacing:.1em; color:#6B767C; margin-top:8px;
}
.ntc-ok{
  border:0; border-top:1px solid #333C41; cursor:pointer;

  font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:19px;
  letter-spacing:.18em; text-transform:uppercase; padding:16px 0 14px;
  border-radius:0 0 var(--rad) var(--rad);
}
.ntc-ok:active{ filter:brightness(.9) }


.hand-one{ padding-bottom:10px; margin-bottom:10px; border-bottom:1px solid #2B3439 }
.hand-one:last-of-type{ padding-bottom:0; margin-bottom:0; border-bottom:0 }
.hand-who{
  font-family:'IBM Plex Mono',monospace; font-size:9px;
  letter-spacing:.13em; text-transform:uppercase; color:#8D999F; margin-bottom:5px;
}


.job.gone-job{ border-left-color:#8D999F; opacity:.55 }
.job.gone-job .job-title{ text-decoration:line-through }


.rep-acts{ display:flex; gap:6px; flex:0 0 auto }
.rep-acts .tool{ padding:6px 9px; font-size:8.5px }
.tool.danger{ border-color:#C09189; color:var(--alarm) }
.tool.danger:hover{ background:var(--alarm); border-color:var(--alarm); color:#fff }


.gap-list{ margin:8px 0 0 18px; color:#E0A94A; font-family:'Barlow',sans-serif; font-size:13.5px }
.gap-list li{ margin-bottom:4px; line-height:1.4 }
.ntc-two{ display:grid; grid-template-columns:1fr 1fr; border-top:1px solid #333C41 }
.ntc-two .ntc-ok{ border-top:0; border-radius:0 }
.ntc-two .ntc-ok:first-child{ border-radius:0 0 0 var(--rad) }
.ntc-two .ntc-ok:last-child{ border-radius:0 0 var(--rad) 0 }
.ntc-ok.ghosty{ background:none; color:#8D999F; border-right:1px solid #333C41 }
.ntc-ok.ghosty:hover{ color:#C6CFD3 }


.tp-gate{
  margin-top:10px; text-align:center;
  font-family:'IBM Plex Mono',monospace; font-size:9.5px;
  letter-spacing:.11em; text-transform:uppercase; color:#B08A3A;
}

<script>
/* Installable app.
   The worker no longer caches the app itself, so a deployment shows up
   straight away. If a new one takes over, reload once to pick it up. */
/* If this copy was cached before the database layer existed, nothing will
   ever sign in. Rather than leaving someone to clear caches by hand, throw
   the old worker away and reload once. */
if('serviceWorker' in navigator && !window.coronaAuth && !sessionStorage.getItem('sw-reset')){
  sessionStorage.setItem('sw-reset', '1');
  navigator.serviceWorker.getRegistrations()
    .then(rs => Promise.all(rs.map(r => r.unregister())))
    .then(() => caches.keys())
    .then(keys => Promise.all(keys.map(k => caches.delete(k))))
    .then(() => location.reload())
    .catch(() => {});
}

if('serviceWorker' in navigator){
  window.addEventListener('load', async () => {
    try{
      const reg = await navigator.serviceWorker.register('sw.js');
      reg.addEventListener('updatefound', () => {
        const fresh = reg.installing;
        if(!fresh) return;
        fresh.addEventListener('statechange', () => {
          if(fresh.state === 'installed' && navigator.serviceWorker.controller){
            fresh.postMessage('skip-waiting');
          }
        });
      });
      let reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if(reloaded) return;
        reloaded = true;
        location.reload();
      });
    }catch(e){}
  });
}
</script>
