function wirePOLines(redraw){
  document.querySelectorAll('[data-pln]').forEach(inp =>
    inp.addEventListener('change', async () => {
      const [i, field] = inp.dataset.pln.split('|');
      const line = poLines[+i];
      line[field] = num(inp.value);
      await saveItem(POL, line);
      redraw();
    }));

  document.querySelectorAll('[data-plx]').forEach(b =>
    b.addEventListener('click', async () => {
      const [line] = poLines.splice(+b.dataset.plx, 1);
      await dropItem(POL, line.id); redraw();
    }));

  const add = document.getElementById('pl-add');
  if(add) add.addEventListener('click', async () => {
    const v = id => document.getElementById(id).value;
    const warn = document.getElementById('pl-warn');
    if(!v('pl-po').trim()){ warn.textContent = 'Enter the order number'; return; }
    const line = {id: newId(), po: v('pl-po').trim(), code: v('pl-code').trim(),
                  type: v('pl-type').trim(), ordered: num(v('pl-ord')),
                  remaining: num(v('pl-rem')), shipped: num(v('pl-ship')),
                  by: operator, at: iso(now)};
    poLines.push(line);
    poLines.sort((a,b) => (a.po || '').localeCompare(b.po || '') ||
                          (a.code || '').localeCompare(b.code || ''));
    await saveItem(POL, line);
    blkShut.polines = false;
    redraw();
  });
}

// inclusive span, so a single day counts as one
function spanDays(from, to){
  if(!from || !to) return 0;
  const a = new Date(from + 'T00:00:00'), b = new Date(to + 'T00:00:00');
  const d = Math.round((b - a) / 86400000) + 1;
  return d > 0 ? d : 0;
}
const stamp = () => {
  const d = new Date();
  return iso(d) + ' ' + String(d.getHours()).padStart(2,'0') + ':' +
         String(d.getMinutes()).padStart(2,'0');
};

async function allLeave(field){
  const out = [];
  const take = (key, val) => {
    const oid = key.split(':')[1];
    let r; try{ r = JSON.parse(val); }catch(e){ return; }
    (r[field] || []).forEach(x => out.push({oid, name: nameOf(oid), ...x}));
  };
  for(const [k, v] of await scanAll('lv:', true)) take(k, v);
  const seenKeys = new Set(out.map(r => 'lv:' + r.oid));
  Object.keys(memo).filter(k => k.startsWith('lv:') && !seenKeys.has(k))
    .forEach(k => take(k, memo[k]));
  return out.sort((a,b) => (a.from||'').localeCompare(b.from||''));
}

// write a decision back into that operator's own record
async function decideLeave(row, field, state){
  const key = 'lv:' + row.oid;
  let rec = {travel:[], days:[]};
  const raw = await grab(key, true);
  if(raw){ try{ rec = JSON.parse(raw); }catch(e){} }
  if(!Array.isArray(rec[field])) rec[field] = [];

  const hit = rec[field].find(x =>
    row.id ? x.id === row.id
           : (x.from === row.from && x.to === row.to && x.at === row.at));
  if(!hit) return false;

  hit.state   = state;
  hit.by      = operator;
  hit.decided = stamp();
  await put(key, JSON.stringify(rec), true);
  if(row.oid === opId) lv = rec;            // keep our own copy in step
  return true;
}

/* Two different things an admin might want.

   HIDE keeps the record. It leaves every screen but stays in the export,
   marked with who hid it, and can be restored.

   DELETE erases it. Nothing is kept, it appears in no export, and it
   cannot be undone.

   Either way the handover it published is deleted outright — that is a
   live message to the next shift, not a record. */
async function hideReport(oid, date, undo){
  const key = 'rep:' + oid + ':' + date;
  let r = {};
  const raw = await grab(key);
  if(raw){ try{ r = JSON.parse(raw); }catch(e){} }

  if(undo) delete r.removed;
  else r.removed = {by: operator, at: stamp()};
  await put(key, JSON.stringify(r));

  for(const [k] of await scanAll('hand:' + date + ':', true)){
    if(k.endsWith(':' + oid)){
      if(undo) continue;
      delete memo[k];
      try{ if(window.storage) await window.storage.delete(k, true); }catch(e){}
    }
  }
  freshUntil.clear();
}

// an operator's own reports, newest first

async function purgeReport(oid, date){
  const key = 'rep:' + oid + ':' + date;
  delete memo[key];
  try{ if(window.storage) await window.storage.delete(key); }catch(e){}
  for(const [k] of await scanAll('hand:' + date + ':', true)){
    if(k.endsWith(':' + oid)){
      delete memo[k];
      try{ if(window.storage) await window.storage.delete(k, true); }catch(e){}
    }
  }
  freshUntil.clear();
}

let repMonth = iso(now).slice(0,7), repWho = 'ALL', showRemoved = false;

async function allReps(month){
  const out = [];
  const take = (key, val) => {
    const [, id, date] = key.split(':');
    let r; try{ r = JSON.parse(val); }catch(e){ return; }
    if(!r || (!r.run && !REP_QS.some(q => (r[q.k] || '').trim()))) return;
    out.push({oid:id, name:nameOf(id), date, ...r});
  };
  for(const [k, v] of await scanLike('rep:%' + (month || repMonth) + '%')) take(k, v);
  const seen = new Set(out.map(r => r.oid + r.date));
  Object.keys(memo).filter(k => k.startsWith('rep:')).forEach(k => {
    const [, id, date] = k.split(':');
    if(!seen.has(id + date)) take(k, memo[k]);
  });
  return out.sort((a,b) => b.date.localeCompare(a.date));   // newest first
}

    const head = ['Date','Operator','Overall'].concat(REP_QS.map(q => q.label))
                 .concat(['Handover shared','Saved at','Removed','Removed by','Removed at']);
    const detail = [head];
    // everything, including anything removed — that is the point of keeping it
    all.slice().sort((a,b) => a.date.localeCompare(b.date)).forEach(r =>
      detail.push([r.date, r.name, r.run || ''].concat(REP_QS.map(q => r[q.k] || ''))
                  .concat([r.share === false ? 'no' : 'yes',
                           r.at || '', r.removed ? 'yes' : '',
                           r.removed ? r.removed.by : '', r.removed ? r.removed.at : ''])));

    const sSheet = [['Overall','Shifts']];
    ['Smooth','Some issues','Difficult'].forEach(v => sSheet.push([v, count(v)]));
    sSheet.push(['Not rated', rows.filter(r => !r.run).length]);

    booksOut([[sSheet,[16,9],'Summary'],

             'corona-operator-reports-' + (repWho === 'ALL' ? 'all' :
              repWho.replace(/[^\w]+/g,'-').toLowerCase()) + '-' + repMonth);
  });

function drawScrapMenu(){
  backTo = () => { leaveViewAll(); show('s-app'); };

async function openScrapPage(pg){
  backTo = renderScrapMenu;
  $('page-title').textContent = pg.label;
  $('to-menu').textContent    = '\u2190 Scrap';
  $('page-who').textContent   = role === 'admin' ? 'All operators' : 'Scrap \u00b7 ' + operator;

  if(pg.id === 'rrep'){ await loadScrRep(); renderScrRep(); show('s-page'); return; }
  if(role === 'admin'){
    if(pg.id === 'rej') await renderRejAdmin(); else await renderWstAdmin();
    show('s-page'); return;
  }
  await loadScr();
  if(pg.id === 'rej') renderRej(); else renderWst();
  show('s-page');
}

let scrAdmMonth = iso(now).slice(0,7), scrWho = 'ALL';

async function allScr(month){
  const out = [];
  const take = (key, val) => {
    const [, id, date] = key.split(':');
    const name = nameOf(id);
    let r; try{ r = JSON.parse(val); }catch(e){ return; }
    (r.rolls || []).forEach(x => out.push({kind:'rej',  name, date, ...x}));
    (r.waste || []).forEach(x => out.push({kind:'wst',  name, date, ...x}));
  };
  for(const [k, v] of await scanLike('scr:%' + (month || scrAdmMonth) + '%')) take(k, v);
  const seen = new Set(out.map(r => r.name + r.date));
  Object.keys(memo).filter(k => k.startsWith('scr:') && !k.startsWith('scrrep:')).forEach(k => {
    const [, id, date] = k.split(':');
    if(!seen.has(nameOf(id) + date)) take(k, memo[k]);
  });
  return out.sort((a,b) => a.date.localeCompare(b.date) || (a.t||'').localeCompare(b.t||''));
}

// both scrap streams together, so the month total is one number
function scrTotals(all){
  const rej = all.filter(r => r.kind === 'rej');
  const wst = all.filter(r => r.kind === 'wst');
  const rejKg = rej.reduce((a,r) => a + num(r.kg), 0);
  const wstKg = wst.reduce((a,r) => a + num(r.kg), 0);
  return {rej, wst, rejKg, wstKg, total: rejKg + wstKg};
}

function exportScrap(t){
  if(!t.rej.length && !t.wst.length){ alert('Nothing to export for this month.'); return; }

  const byDay = {};
  const bump = (d, f, kg) => {
    byDay[d] = byDay[d] || {rejN:0, rejKg:0, wstN:0, wstKg:0};
    byDay[d][f + 'N']++; byDay[d][f + 'Kg'] += kg;
  };
  t.rej.forEach(r => bump(r.date, 'rej', num(r.kg)));
  t.wst.forEach(r => bump(r.date, 'wst', num(r.kg)));

  const sum1 = [['Date','Reject rolls','Reject kg','Pallets wasted','Wastage kg','Total scrap kg']];
  Object.keys(byDay).sort().forEach(d => {
    const v = byDay[d];
    sum1.push([d, v.rejN, v.rejKg, v.wstN, v.wstKg, v.rejKg + v.wstKg]);
  });
  sum1.push(['TOTAL', t.rej.length, t.rejKg, t.wst.length, t.wstKg, t.total]);

  const rSheet = [['Date','Logged by','Roll #','Time','Weight (kg)',
                   'Operator','Machine','Comments']];
  t.rej.forEach(r => rSheet.push([r.date, r.name, r.roll, r.t, num(r.kg),
    r.who || '', r.mac || '', r.note || '']));

  const wSheet = [['Date','Logged by','Time','Pallet weight (kg)',
                   'Operator','Machine','Comments']];
  t.wst.forEach(r => wSheet.push([r.date, r.name, r.t, num(r.kg),
    r.who || '', r.mac || '', r.note || '']));

  // where the scrap is actually coming from
  const byMac = {};
  [...t.rej, ...t.wst].forEach(r => {
    const k = r.mac || 'Not recorded';
    byMac[k] = byMac[k] || {n:0, kg:0};
    byMac[k].n++; byMac[k].kg += num(r.kg);
  });
  const mSheet = [['Machine','Entries','Scrap (kg)','Share %']];
  Object.keys(byMac).sort((a,b) => byMac[b].kg - byMac[a].kg).forEach(k =>
    mSheet.push([k, byMac[k].n, Math.round(byMac[k].kg * 100) / 100,
                 t.total ? Math.round(byMac[k].kg / t.total * 1000) / 10 : 0]));

  booksOut([[sum1,[12,13,11,15,12,15],'Daily summary'],
            [mSheet,[16,10,12,10],'By machine'],
            [rSheet,[12,20,10,8,12,20,14,44],'Reject rolls'],
            [wSheet,[12,20,8,18,20,14,44],'Wastage']],
    'corona-scrap-' + (scrWho === 'ALL' ? 'all' :
     scrWho.replace(/[^\w]+/g,'-').toLowerCase()) + '-' + scrAdmMonth);
}

const SHIFT_CLS  = {D:'d', N:'n', O:'o'};
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function monthDays(m){
  const [y, mo] = m.split('-').map(Number);
  const n = new Date(y, mo, 0).getDate();
  return Array.from({length:n}, (_,i) => {
    const dd = String(i+1).padStart(2,'0');
    const wd = new Date(y, mo-1, i+1).getDay();
    return {dd, wd, full: m + '-' + dd};      // plant runs 7 days, so no weekends
  });
}

async function loadSched(){
  sched = {rows:{}};
  const raw = await grab(schKey(), true);
  if(raw){ try{ sched = JSON.parse(raw); }catch(e){} }
  if(!sched.rows || typeof sched.rows !== 'object') sched.rows = {};
}
const saveSched = () => put(schKey(), JSON.stringify(sched), true);
const cellOf = (id, dd) => (sched.rows[id] || {})[dd] || '';

    aoa.push(['Night crew'].concat(days.map(d => on(d.dd,'N'))).concat(['','','']));
    booksOut([[aoa, [20].concat(days.map(() => 9)).concat([7,7,7]), 'Schedule']],
             'corona-schedule-' + schMonth);

let tgt = {lines:[]}, tgtMonth = iso(now).slice(0,7), tgtPick = 'ALL';

const KG_TO_LB = 2.20462;

async function loadTgt(){
  tgt = {lines:[]};
  const raw = await grab(tgtKey(), true);
  if(raw){ try{ tgt = JSON.parse(raw); }catch(e){} }
  if(!Array.isArray(tgt.lines)) tgt.lines = [];
  // pounds used to sit on each line; roll it up into one monthly figure
  if(!num(tgt.lbs)){
    const rolled = tgt.lines.reduce((a,l) => a + num(l.lbs), 0);
    if(rolled) tgt.lbs = rolled;
  }
  tgt.lbs = num(tgt.lbs);
  tgt.lines.forEach(l => {
    l.rolls = num(l.rolls);
    if(typeof l.mach !== 'string') l.mach = '';
    delete l.lbs;
  });
}
const saveTgt = () => put(tgtKey(), JSON.stringify(tgt), true);

// production this month, split by material and by day
async function monthActuals(month){
  const byMat = {}, byDay = {};
  const bump = (mat, date, f, v) => {
    const m = mat || 'Unspecified';
    byMat[m] = byMat[m] || {rolls:0, kg:0};
    byMat[m][f] += v;
    byDay[date] = byDay[date] || {};
    byDay[date][m] = byDay[date][m] || {rolls:0, kg:0};
    byDay[date][m][f] += v;
  };
  const scan = async (prefix, handler) => {
    for(const [k, v] of await scanAll(prefix)) handler(k, v);
  };

  await scan('lmh:%' + month + '%', (k, v) => {
    const date = k.split(':')[3];
    if(!date || date.slice(0,7) !== month) return;
    try{ (JSON.parse(v).rolls || []).forEach(r => bump(r.mat, date, 'rolls', 1)); }catch(e){}
  });
  await scan('mix:%' + month + '%', (k, v) => {
    const date = k.split(':')[2];
    if(!date || date.slice(0,7) !== month) return;
    try{
      const rec = JSON.parse(v);
      (rec.rows || []).forEach(r => bump(r.mat || rec.material, date, 'kg', num(r.kg)));
    }catch(e){}
  });
  return {byMat, byDay};
}

const matAct = (a, mat) => mat === 'ALL'
  ? Object.values(a.byMat).reduce((s,v) => ({rolls:s.rolls+v.rolls, kg:s.kg+v.kg}), {rolls:0,kg:0})
  : (a.byMat[mat] || {rolls:0, kg:0});

function tgtBar(pct, cls){
  return '<span class="tg-track"><span class="tg-fill ' + cls +
         '" style="width:' + Math.min(100, pct) + '%"></span></span>';
}

/* ── Stats — Monthly ──────────────────────── */
let statMonth = iso(now).slice(0,7);

async function scanKeys(prefix, handler, month){
  const pattern = month ? prefix + '%' + month + '%' : prefix;
  for(const [k, v] of await scanLike(pattern)) handler(k, v);
}

async function monthStats(month){
  const s = {
    mixKg:0, gaylords:0, batches:0,
    lmhRolls:0, lmhPass:0, lmhRej:0, lmhQ:0,
    flmRolls:0, flmGood:0, flmQ:0, flmRej:0,
    peel:0, peelPass:0,
    qc:0, qcPass:0, qcFail:0,
    sandDone:0, belts:0,
    rejRolls:0, rejKg:0, wasteKg:0,
    downMins:0, reasons:{},
    upMins:0, offMins:0,
    shifts:0, workMins:0, otMins:0,
    mntJobs:0, mntMins:0,
    days:new Set()
  };
  const inMonth = d => d && d.slice(0,7) === month;
  const parse = v => { try{ return JSON.parse(v); }catch(e){ return null; } };
  const addReason = (why, mins) => {
    const k = why || 'Unspecified';
    s.reasons[k] = (s.reasons[k] || 0) + num(mins);
    s.downMins += num(mins);
  };
  const addStatus = (evs, date) => {
    const segs = segments(evs, date);
    s.upMins  += minsIn(segs, 'online');
    s.offMins += minsIn(segs, 'offline');
  };

  await scanKeys('mix:', (k, v) => {
    const date = k.split(':')[2]; if(!inMonth(date)) return;
    const r = parse(v); if(!r) return;
    s.days.add(date);
    (r.rows || []).forEach(b => {
      s.mixKg += num(b.kg); s.gaylords += num(b.gay); s.batches++;
    });
  }, month);

  await scanKeys('lmh:', (k, v) => {
    const date = k.split(':')[3]; if(!inMonth(date)) return;
    const r = parse(v); if(!r) return;
    (r.rolls || []).forEach(x => {
      s.lmhRolls++;
      const res = normRes(x.result);
      if(res === 'Pass') s.lmhPass++;
      else if(res === 'Rejected') s.lmhRej++;
      else if(res === 'Questionable') s.lmhQ++;
    });
  }, month);

  await scanKeys('mst:', (k, v) => {
    const date = k.split(':')[2]; if(!inMonth(date)) return;
    const r = parse(v); if(!r) return;
    addStatus(r.events || [], date);      // one record per machine per day
  }, month);

  await scanKeys('dwn:', (k, v) => {
    const date = k.split(':')[2]; if(!inMonth(date)) return;
    const r = parse(v); if(!r) return;
    (r.rows || []).forEach(d => addReason(d.reason, d.mins));
  }, month);

  await scanKeys('snd:', (k, v) => {
    const date = k.split(':')[2]; if(!inMonth(date)) return;
    const r = parse(v); if(!r) return;
    (r.rows || []).forEach(x => {
      s.sandDone += num(x.done);
      s.belts += (x.belts || []).reduce((a,b) => a + num(b.count), 0);
    });
    (r.down || []).forEach(d => addReason(d.reason, d.mins));
  }, month);

  await scanKeys('flm:', (k, v) => {
    const date = k.split(':')[2]; if(!inMonth(date)) return;
    const r = parse(v); if(!r) return;
    (r.rolls || []).forEach(x => {
      s.flmRolls++;
      if(x.result === 'Good') s.flmGood++;
      else if(x.result === 'Questionable') s.flmQ++;
      else if(x.result === 'Rejected') s.flmRej++;
    });
    (r.peel || []).forEach(x => { s.peel++; if(x.result === 'Pass') s.peelPass++; });
    (r.down || []).forEach(d => addReason(d.reason, d.mins));
  }, month);

  await scanKeys('scr:', (k, v) => {
    if(k.startsWith('scrrep:')) return;
    const date = k.split(':')[2]; if(!inMonth(date)) return;
    const r = parse(v); if(!r) return;
    (r.rolls || []).forEach(x => { s.rejRolls++; s.rejKg += num(x.kg); });
    (r.waste || []).forEach(x => { s.wasteKg += num(x.kg); });
  }, month);

  await scanKeys('qua:', (k, v) => {
    const date = k.split(':')[2]; if(!inMonth(date)) return;
    const r = parse(v); if(!r) return;
    (r.samples || []).forEach(x => {
      s.qc++;
      if(x.result === 'Pass') s.qcPass++;
      else if(x.result === 'Fail') s.qcFail++;
    });
  }, month);

  await scanKeys('shift:', (k, v) => {
    const date = k.split(':')[2]; if(!inMonth(date)) return;
    const r = parse(v); if(!r || !r.inAt) return;
    let m = Math.floor((new Date(r.outAt || r.inAt) - new Date(r.inAt)) / 60000);
    if(m < 0) m += 1440;
    s.shifts++; s.workMins += m; s.otMins += Math.max(0, m - STD_MINS);
  }, month);

  await scanKeys('mnt:', (k, v) => {
    const date = k.split(':')[2]; if(!inMonth(date)) return;
    const r = parse(v); if(!r) return;
    (r.logs || []).forEach(l => { s.mntJobs++; s.mntMins += num(l.mins); });
  }, month);

  return s;
}

let bon = {scores:{}}, bonMonth = iso(now).slice(0,7), bonWho = '';
const bonKey = m => 'bon:' + (m || bonMonth);

const CRITERIA = [
  {k:'prod', label:'Productivity', hint:'Output against what the job needed'},
  {k:'perf', label:'Performance',  hint:'Quality and consistency of the work'},
  {k:'init', label:'Initiative',   hint:'Solving problems without being asked'},
  {k:'tidy', label:'Tidiness',     hint:'Housekeeping and care of the area'},
  {k:'beh',  label:'Behaviour',    hint:'Attitude, timekeeping, working with others'}
];
const MAX_SCORE = CRITERIA.length * 5;

async function loadBon(){
  bon = {scores:{}};
  const raw = await grab(bonKey(), true);
  if(raw){ try{ bon = JSON.parse(raw); }catch(e){} }
  if(!bon.scores || typeof bon.scores !== 'object') bon.scores = {};
}
const saveBon = () => put(bonKey(), JSON.stringify(bon), true);

const scoreOf = id => bon.scores[id] || {};
const totalOf = id => {
  const s = scoreOf(id);
  return CRITERIA.reduce((a,c) => a + num(s[c.k]), 0);
};
const isScored = id => CRITERIA.every(c => num(scoreOf(id)[c.k]) > 0);
const bonGrade = t => t >= 22 ? 'hit' : t >= 17 ? 'near' : t > 0 ? 'miss' : '';

async function renderBonus(){

          (avg !== null ? ' \u00b7 avg ' + avg : '') + '</span>' +
        '<span class="b-arw">\u25bc</span></button>' +
        '<div class="blk-body">' +
          '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
            '<th>Operator</th>' + CRITERIA.map(c =>
              '<th class="r">' + c.label.slice(0,4) + '</th>').join('') +
            '<th class="r">Total</th></tr></thead><tbody>' +
          ranked.map(r => {
            const s = scoreOf(r.id);
            return '<tr><td class="who-cell">' + esc(r.name) + '</td>' +
              CRITERIA.map(c => '<td class="r">' + (num(s[c.k]) || '\u2013') + '</td>').join('') +
              '<td class="r ' + (r.t ? bonGrade(r.t) + '-txt' : '') + '"><b>' +
              (r.t || '\u2013') + '</b></td></tr>';

             'corona-bonus-scores-' + bonMonth);

// Section menu \u2014 each row opens its own page
let shiftCount = 0;
async function countShifts(){
  const all = await allRecords();
  shiftCount = all.filter(r => r.date.slice(0,7) === recMonth).length;
  buildMenu();
}
const statusOf = t => {
  if(role === 'admin')
    return t.id === 'time' ? (shiftCount ? shiftCount + ' recs' : 'No data') : 'No data';
  if(t.id === 'sched'){
    if(role === 'admin') return 'Set';
    const n = Object.keys(sched.rows[opId] || {}).length;
    return n ? n + ' days' : 'View';
  }
  if(t.id === 'allrec') return 'View';
  if(t.id === 'notice'){
    const n = unread().length;
    return n ? n + ' new' : (canPost() ? 'Post' : 'View');
  }
  if(t.id === 'targ') return role === 'admin' ? 'Set' : 'View';
  if(t.id === 'bonus') return role === 'admin' ? 'Score' : 'View';
  if(t.id === 'inv'){
    const rdy = (inv.pallets || []).filter(p => p.state === 'Ready').length;
    return rdy ? rdy + ' ready' : 'View';
  }
  if(t.k === 'ref')   return 'View';
  if(t.id === 'maint'){
    const open = (pend.jobs || []).filter(j => j.state !== 'Complete').length;
    return open ? open + ' open' : 'As needed';
  }
  if(t.id === 'recv'){
    const n = (recv || []).filter(r => (r.date || '').slice(0,7) === iso(now).slice(0,7)).length;
    return n ? n + ' this month' : 'As needed';
  }
  if(t.id === 'store'){
    const low = (stock.items || []).filter(isLow).length +
                (mach.items  || []).filter(isLow).length;
    const req = (needs.items || []).length;
    return low ? low + ' low' : req ? req + ' needed' : 'As needed';
  }
  if(t.id === 'items') return (pos.orders || []).length
    ? (pos.orders.length + ' this month') : 'As needed';
  if(t.id === 'leave'){
    const n = (lv.travel || []).length + (lv.days || []).length;
    return n ? n + ' requested' : 'As needed';
  }
  if(t.k === 'adhoc') return 'As needed';
  if(t.id === 'qual') return (qua.samples.length + qua.comments.length + qua.files.length)
                              ? 'Done' : 'Empty';
  if(t.id === 'rep') return (rep.run || REP_QS.some(q => (rep[q.k] || '').trim()))
                              ? 'Done' : 'Empty';
  if(t.id === 'scrap') return (scr.rolls.length + scr.waste.length) ? 'Done' : 'Empty';
  if(t.id !== 'time') return 'Empty';
  return day.outAt ? 'Done' : day.inAt ? 'Open' : 'Empty';
};

/* ── Handover from the last shift ──────────────────────────
   The note the previous operator left is written into a shared
   record when they save their report. Showing it on the menu
   is the difference between it being written and being read.  */
let handover = [], handoverLoading = false;
let ntcLevel = 'Normal';
let noticeWatch = null;

/* A notice posted while someone is mid-shift should reach them then,
   not the next time they happen to pass through the menu. */
function watchNotices(){
  clearInterval(noticeWatch);
  if(!opId) return;
  noticeWatch = setInterval(async () => {
    if(document.visibilityState === 'hidden') return;
    try{
      freshUntil.delete(NTC + '|true');
      await loadNotices();
      if(unread().length){ showNotices(); buildMenu(); return; }
      if(isCPD()){
        await loadNewReports();
        if(newReports.length){ showReports(); }
      }
      if(isOffice()){
        if(document.getElementById('s-app').classList.contains('on')){
          await loadDash();
          buildMenu();
        }
      }
    }catch(e){}
  }, 60000);
}

async function loadHandover(){
  handover = [];
  const mine = 'hand:' + iso(now) + ':' + (shift === 'NIGHT SHIFT' ? 'N' : 'D') + ':' + opId;
  const hours = role === 'admin' ? 24 * 7 : 36;   // admin sees the week
  const cutoff = new Date(Date.now() - hours * 3600 * 1000).toISOString();
  const rows = [];
  for(const [k, v] of await scanLike('hand:' + iso(now).slice(0,7) + '%')){
    if(k === mine) continue;                       // not my own, just written
    try{
      const r = JSON.parse(v);
      // everything left in the last day and a half, so a note is never
      // buried by someone else posting after it
      if(r && r.note && (r.at || '') >= cutoff) rows.push(r);
    }catch(e){}
  }
  rows.sort((a,b) => (b.at || '').localeCompare(a.at || ''));
  handover = rows;
}

// machines left off are a fact the next shift needs as much as the note

function handoverCard(){

        (handover.length

    handover.map(n =>

    (off.length

/* ── Notices ───────────────────────────────────────────────
   Posted by CPD Admin, shown to everyone as a popup the next
   time they open the app. One record per notice, so posting
   one never overwrites another.                             */
let notices = [];
const NTC = 'ntc:i:';
const NTC_LEVELS = [
  {v:'Normal',    cls:'r-pass'},
  {v:'Important', cls:'r-q'},
  {v:'Urgent',    cls:'r-rej'}
];
const ntcTag = v => v === 'Urgent' ? 'tag-fail' : v === 'Important' ? 'tag-q' : 'tag-pass';

async function loadNotices(){
  notices = await loadItems(NTC, null, o => o.items || []);
  notices.sort((a,b) => (b.at || '').localeCompare(a.at || ''));
}

const seenNotices = () => {
  try{ return JSON.parse(localStorage.getItem(seenKey('ntc-seen')) || '[]'); }catch(e){ return []; }
};
const markSeen = ids => {
  try{
    const all = [...new Set(seenNotices().concat(ids))].slice(-200);
    localStorage.setItem(seenKey('ntc-seen'), JSON.stringify(all));
  }catch(e){}
};
const unread = () => {
  const seen = seenNotices();
  return notices.filter(n => !seen.includes(n.id));
};

/* ── the popup ─────────────────────────────── */
function showNotices(preview){
  const pending = preview || unread();
  if(!pending.length || document.getElementById('ntc-pop')) return;
  if(document.getElementById('lightbox') &&
     document.getElementById('lightbox').classList.contains('on')) return;

  const el = document.createElement('div');
  el.id = 'ntc-pop';
  el.innerHTML =
    '<div class="ntc-box' +
      (pending.some(n => n.level === 'Urgent') ? ' has-urgent' : '') + '">' +
      '<div class="ntc-head">' +
        (preview ? 'Preview' :
         pending.length === 1 ? 'Notice' : pending.length + ' notices') +
      '</div>' +
      '<div class="ntc-scroll">' +
        pending.map(n =>
          '<div class="ntc-item ' + (n.level || 'Normal').toLowerCase() + '">' +
            '<div class="ntc-lvl">' + esc(n.level || 'Normal') + '</div>' +
            '<div class="ntc-title">' + esc(n.title) + '</div>' +
            (n.body ? '<div class="ntc-body">' + esc(n.body) + '</div>' : '') +
            '<div class="ntc-by">' + esc(n.by || '') + ' \u00b7 ' + esc((n.at || '').slice(0,10)) +
            '</div>' +
          '</div>').join('') +
      '</div>' +
      '<button class="ntc-ok" id="ntc-ok">Got it</button>' +
    '</div>';
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('on'));

  document.getElementById('ntc-ok').addEventListener('click', () => {
    if(!preview) markSeen(pending.map(n => n.id));
    el.classList.remove('on');
    setTimeout(() => {
      el.remove();
      // refresh the menu count only if that is what is on screen

};
const markRepSeen = tags => {
  try{
    const all = [...new Set(repSeen().concat(tags))].slice(-300);
    localStorage.setItem(seenKey('rep-seen'), JSON.stringify(all));
  }catch(e){}
};
const repTag = r => r.oid + ':' + r.date + ':' + (r.at || '');

async function loadNewReports(){
  newReports = [];
  if(!isCPD()) return;                     // never for operators or CPU Admin
  const cutoff = iso(new Date(Date.now() - 3 * 86400000));
  const seen = repSeen();
  const out = [];

/* ── Registering a phone for notifications ─────────────────
   Permission has to be asked for by a tap, never automatically,
   or browsers refuse it and the person is left annoyed. */
const VAPID = () => (window.CORONA_CONFIG || {}).VAPID_PUBLIC || '';

const pushable = () => 'serviceWorker' in navigator && 'PushManager' in window && !!VAPID();

function urlB64(s){
  const pad = '='.repeat((4 - s.length % 4) % 4);
  const raw = atob((s + pad).replace(/-/g,'+').replace(/_/g,'/'));
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}

async function pushState(){
  if(!pushable()) return 'unsupported';
  if(Notification.permission === 'denied') return 'blocked';
  try{
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    return sub ? 'on' : 'off';
  }catch(e){ return 'off'; }
}

async function pushOn(){
  const perm = await Notification.requestPermission();
  if(perm !== 'granted') return perm === 'denied' ? 'blocked' : 'off';
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.subscribe({
    userVisibleOnly: true,
    applicationServerKey: urlB64(VAPID())
  });
  const j = sub.toJSON();
  await savePushSub({
    endpoint: j.endpoint, op_id: opId, name: operator,
    keys: j.keys, platform: navigator.userAgent.slice(0, 120)
  });
  return 'on';
}

async function pushOff(){
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription();
  if(sub){
    await dropPushSub(sub.endpoint);
    await sub.unsubscribe();
  }
  return 'off';
}

async function paintPush(){
  const body = document.getElementById('pn-body');
  const tag  = document.getElementById('pn-state');
  if(!body) return;
  const st = await pushState();
  if(tag) tag.textContent = st === 'on' ? 'on' : st === 'blocked' ? 'blocked' :
                            st === 'unsupported' ? 'not available' : 'off';

  const note = {
    on:  'This device will buzz when a notice is posted, even with the app closed.',
    off: 'Turn this on to be told about notices without opening the app.',
    blocked: 'Notifications were refused for this site. Turn them back on in ' +
             'your phone settings, then come back here.',
    unsupported: 'This device or browser cannot do notifications. On an iPhone, ' +
                 'add the app to your home screen first, then try again.'
  }[st];

  body.innerHTML =
    '<div class="tp-note" style="text-align:left;margin:0 0 10px">' + note + '</div>' +
    (st === 'on'  ? '<button class="tool" id="pn-off">Turn off on this device</button>' :
     st === 'off' ? '<button class="mx-save" id="pn-go">Turn on notifications</button>' : '');

  const go = document.getElementById('pn-go');
  if(go) go.addEventListener('click', async () => {
    go.disabled = true;
    try{ await pushOn(); }catch(e){ console.warn(e); }
    paintPush();
  });
  const off = document.getElementById('pn-off');
  if(off) off.addEventListener('click', async () => {
    try{ await pushOff(); }catch(e){}
    paintPush();
  });
}

   One screen an admin sees on opening the app: what is running,
   who is on, what came out today, and what needs attention.   */
let dash = null;

/* Ask the database for one day or one month, rather than pulling
   everything back and discarding most of it. */
async function scanLike(pattern){
  const out = [];
  try{
    if(window.storage && window.storage.listLike){
      for(const [k, v] of await window.storage.listLike(pattern)) out.push([k, v]);
      return out;
    }
  }catch(e){}
  // no pattern support: fall back to the prefix before the first wildcard
  const prefix = pattern.split('%')[0];
  const rx = new RegExp('^' + pattern.split('%').map(s =>
    s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('.*') + '$');
  for(const [k, v] of await scanAll(prefix)) if(rx.test(k)) out.push([k, v]);
  return out;
}

async function loadDash(){
  const today = iso(now);
  const month = today.slice(0,7);
  const d = {
    machines: [], onShift: [], rolls: 0, kg: 0, scrapKg: 0,
    downMins: 0, downBy: {}, openJobs: 0, lowStock: 0, ready: 0, overdue: 0,
    rough: 0, tgtRolls: 0, tgtDone: 0, tgtLbs: 0, madeLbs: 0
  };

  await prefetch('mst:', true);
  [{id:'m2', label:'Machine 2'}, {id:'m3', label:'Machine 3'},
   {id:'sand', label:'Sander'},  {id:'flam', label:'Flamer'}].forEach(m => {
    const evs = statusOfMac(m.id, today);
    const segs = segments(evs, today);
    d.machines.push({id: m.id, label: m.label, state: stateNow(evs),
                     up: minsIn(segs,'online'), down: minsIn(segs,'offline')});
  });

  for(const [k, v] of await scanLike('shift:%:' + today)){
    const [, oid] = k.split(':');
    try{
      const r = JSON.parse(v);
      if(r.inAt && !r.outAt) d.onShift.push({name: nameOf(oid), since: hhmm(r.inAt)});
    }catch(e){}
  }

  for(const [, v] of await scanLike('lmh:%:' + today)){
    try{ d.rolls += (JSON.parse(v).rolls || []).length; }catch(e){}
  }
  for(const [, v] of await scanLike('mix:%:' + today)){
    try{ (JSON.parse(v).rows || []).forEach(r => d.kg += num(r.kg)); }catch(e){}
  }
  for(const [k, v] of await scanLike('scr:%:' + today)){
    if(k.startsWith('scrrep:')) continue;
    try{
      const r = JSON.parse(v);
      (r.rolls || []).forEach(x => d.scrapKg += num(x.kg));
      (r.waste || []).forEach(x => d.scrapKg += num(x.kg));
    }catch(e){}
  }
  for(const [, v] of await scanLike('dwn:%:' + today)){
    try{
      (JSON.parse(v).rows || []).forEach(x => {
        const mins = num(x.mins);
        d.downMins += mins;
        const k = x.mac || 'other';
        d.downBy[k] = (d.downBy[k] || 0) + mins;
      });
    }catch(e){}
  }
  // the sander and flamer keep their stops on their own sheets
  for(const [, v] of await scanLike('snd:%:' + today)){
    try{ (JSON.parse(v).down || []).forEach(x => {
      d.downMins += num(x.mins);
      d.downBy.sand = (d.downBy.sand || 0) + num(x.mins);
    }); }catch(e){}
  }
  for(const [, v] of await scanLike('flm:%:' + today)){
    try{ (JSON.parse(v).down || []).forEach(x => {
      d.downMins += num(x.mins);
      d.downBy.flam = (d.downBy.flam || 0) + num(x.mins);
    }); }catch(e){}
  }
  for(const [, v] of await scanLike('rep:%:' + today)){
    try{ const r = JSON.parse(v); if(!r.removed && r.run === 'Difficult') d.rough++; }catch(e){}
  }

  pendMonth = month; await loadPend();
  d.openJobs = (pend.jobs || []).filter(j => j.state !== 'Complete').length;
  await loadStore();
  d.lowStock = (stock.items || []).filter(isLow).length + (mach.items || []).filter(isLow).length;
  await loadInv();
  d.ready   = (inv.pallets || []).filter(p => p.state === 'Ready').length;
  d.overdue = (inv.pallets || []).filter(p =>
    p.state !== 'Shipped' && p.due && p.due < today).length;

  const savedT = tgtMonth; tgtMonth = month; await loadTgt(); tgtMonth = savedT;
  d.tgtRolls = tgt.lines.reduce((a,l) => a + num(l.rolls), 0);
  d.tgtDone  = tgt.lines.reduce((a,l) => a + num(l.done), 0);
  d.tgtLbs   = num(tgt.lbs);
  const act = await monthActuals(month);
  d.madeLbs  = matAct(act, 'ALL').kg * KG_TO_LB;

  dash = d;
}

          '</div>' +
          '<div class="fld"><label for="rc-from">Bought from</label>' +
            '<input id="rc-from" list="d-rfrom" placeholder="Supplier name"></div>' +
          '<div class="fld"><label for="rc-mat">Item</label>' +
            '<input id="rc-mat" list="d-rmat" placeholder="What was bought"></div>' +
          '<div class="two">' +
            '<div class="fld"><label for="rc-qty">Quantity</label>' +
              '<input id="rc-qty" class="mono" inputmode="decimal" placeholder="0"></div>' +
            '<div class="fld"><label for="rc-unit">Unit</label>' +
              '<select id="rc-unit">' + RCV_UNITS.map(u =>
                '<option value="' + u + '"' + (recvUnit === u ? ' selected' : '') + '>' +
                u + '</option>').join('') + '</select></div>' +
          '</div>' +
          '<div class="fld"><label for="rc-img">Photo of the receipt</label>' +
            '<div class="img-pick">' +
              (recvImg
                ? '<img class="prev" src="data:image/jpeg;base64,' + recvImg.b64 + '" alt="">'
                : '<span class="none">\u2295</span>') +
              '<input id="rc-img" type="file" accept="image/*" capture="environment">' +
            '</div>' +
            '<div class="img-note" id="rc-imgnote">' +
              (recvImg ? '\u2713 ' + kb(recvImg.size) + ' \u00b7 ready to attach'
                       : 'Photograph the receipt or invoice') + '</div></div>' +
          '<div class="fld"><label for="rc-cmt">Comments</label>' +
            '<textarea id="rc-cmt" placeholder="Condition, shortages, anything unusual"></textarea></div>' +
          '<button class="mx-save" id="rc-add">Log the purchase</button>' +
          '<div class="mx-warn" id="rc-warn"></div>' +
        '</div>' +
      '</div>') +

      (month.length
        ? '<div>' + month.map((r,i) =>
            '<div class="job need">' +
              '<div class="job-top">' +
                '<div class="job-title">' + (esc(r.mat) || 'Item') +
                  (num(r.qty) ? ' <span style="color:var(--ink-soft)">' +
                    tidy(num(r.qty)) + ' ' + esc(r.unit || '') + '</span>' : '') + '</div>' +
                (readOnly ? '' :
                  '<button class="mx-del" data-rcx="' + esc(r.id) +
                  '" aria-label="Remove purchase">\u2715</button>') +
              '</div>' +
              '<div class="job-meta">' +
                (r.from ? '<span class="job-mach">' + esc(r.from) + '</span>' : '') +
                '<span>' + esc(r.date) + '</span>' +
                (r.note ? '<span>note ' + esc(r.note) + '</span>' : '') +
                (r.by ? '<span>by ' + esc(r.by) + '</span>' : '') +
              '</div>' +
              (r.cmt ? '<div class="job-note">' + esc(r.cmt) + '</div>' : '') +
              (r.img
                ? '<div class="rcv-shot"><span data-thumb="' + esc(r.img.id) +
                  '" data-shared="1" data-label="' + esc(r.from || '') + ' \u00b7 ' +
                  esc(r.date) + '">\u2026</span></div>'
                : '<div class="rcv-none">No photo attached</div>') +
            '</div>').join('') + '</div>'
        : '<div class="tbl-wrap"><div class="empty">Nothing bought this month</div></div>') +

      (role === 'admin'
        ? '<div class="tools"><button class="tool go" id="rc-xls">\u2193 Download Excel</button></div>'
        : '') +
      '<div class="rc-note">Shared \u00b7 everyone sees the same list</div>' +
    '</div>';

  document.querySelectorAll('.blk-head').forEach(b =>
    b.addEventListener('click', () => {
      const k = b.parentElement.dataset.blk;
      blkShut[k] = !blkShut[k];
      b.parentElement.classList.toggle('shut', blkShut[k]);
    }));

  document.getElementById('rc-month').addEventListener('change', e => {
    recvMonth = e.target.value || iso(now).slice(0,7); drawRecv();
  });

  const pick = document.getElementById('rc-img');
  if(pick) pick.addEventListener('change', async e => {
    const f = e.target.files && e.target.files[0];
    const note = document.getElementById('rc-imgnote');
    if(!f){ recvImg = null; return; }
    note.textContent = 'Scaling\u2026';
    try{
      const out = await shrinkImage(f);
      recvImg = {b64: out.b64, name: f.name, size: out.size};
      showPicked(e.target, recvImg, 'rc-imgnote', () => { recvImg = null; });
    }catch(err){ recvImg = null; note.textContent = 'Could not read that image'; }
  });

  const unit = document.getElementById('rc-unit');
  if(unit) unit.addEventListener('change', e => { recvUnit = e.target.value; });

  const add = document.getElementById('rc-add');
  if(add) add.addEventListener('click', async () => {
    const v = id => document.getElementById(id).value;
    const warn = document.getElementById('rc-warn');
    if(!v('rc-mat').trim()){ warn.textContent = 'What was bought?'; return; }
    if(!v('rc-from').trim()){ warn.textContent = 'Who was it bought from?'; return; }

    let img = null;
    if(recvImg){
      const id = 'r' + Date.now() + Math.random().toString(36).slice(2,7);
      await put(fileKey(id), recvImg.b64, true);
      img = {id, name: recvImg.name, size: recvImg.size, shared: true};
    }
    const row = {id: newId(), date: v('rc-date') || today, from: v('rc-from').trim(),
                 mat: v('rc-mat').trim(), qty: num(v('rc-qty')), unit: v('rc-unit'),
                 note: v('rc-note').trim(), cmt: v('rc-cmt').trim(),
                 img, by: operator, at: stamp()};
    recv.unshift(row);
    recvImg = null;
    await saveItem(RCV, row);
    drawRecv();
  });

  document.querySelectorAll('[data-rcx]').forEach(b =>
    b.addEventListener('click', async () => {
      const id = b.dataset.rcx;
      const row = recv.find(r => r.id === id);
      if(!confirm('Remove this purchase?')) return;
      if(row && row.img){
        delete memo[fileKey(row.img.id)];
        try{ if(window.storage) await window.storage.delete(fileKey(row.img.id), true); }catch(e){}
      }
      recv = recv.filter(r => r.id !== id);
      await dropItem(RCV, id); drawRecv();
    }));

  const xls = document.getElementById('rc-xls');
  if(xls) xls.addEventListener('click', () => {
    if(!month.length){ alert('Nothing to export for this month.'); return; }
    const aoa = [['Date','Bought from','Item','Quantity','Unit','Receipt no',
                  'Photo','Logged by','Comments']];
    month.slice().sort((a,b) => a.date.localeCompare(b.date)).forEach(r =>
      aoa.push([r.date, r.from || '', r.mat || '', num(r.qty), r.unit || '',
                r.note || '', r.img ? 'yes' : '', r.by || '', r.cmt || '']));
    aoa.push([]);
    Object.keys(byUnit).sort().forEach(u =>
      aoa.push(['TOTAL','','', Math.round(byUnit[u] * 100) / 100, u, '', '', '', '']));
    sheetOut(aoa, [12,24,26,11,8,16,7,18,40], 'Items bought',
             'corona-items-bought-' + recvMonth);
  });

  paintThumbs();
  show('s-page');
}

/* ── Everyone's records ────────────────────────────────────
   Operators can now read what everyone else has logged. Rather
   than a second set of screens, this borrows the admin views
   and puts them in read-only mode, then hands the operator
   back their own role on the way out.                        */
let viewAll = false, realRole = 'operator', realRO = false;

/* An operator viewing everyone's records is temporarily given the admin
   role so the admin screens can be reused. Anything genuinely restricted
   has to ask who they really are. */
const isCPD    = () => !viewAll && role === 'admin' && !readOnly;   // CPD only
const isOffice = () => !viewAll && role === 'admin';                // CPD or CPU

/* Shift reports stay between the operator and the office. People write
   them differently when the whole crew reads them. */
const ALL_PAGES = [
  {id:'prod',  label:'Production Data', blurb:'Mixing, LMH, sander and flamer, all operators.'},
  {id:'qual',  label:'Quality Data',    blurb:'Samples, reports and daily comments.'},
  {id:'scrap', label:'Scrap',           blurb:'Reject rolls and wastage, by machine.'},
];

function enterViewAll(){
  if(viewAll) return;
  viewAll = true; realRole = role; realRO = readOnly;
  role = 'admin'; readOnly = true;
  document.body.classList.add('viewing');     // not 'read-only': that hides whole blocks
}
function leaveViewAll(){
  if(!viewAll) return;
  viewAll = false;
  role = realRole; readOnly = realRO;
  document.body.classList.remove('viewing');
  document.body.classList.toggle('read-only', realRO);
}

/* A switch at the top of a section, so an operator can see what
   everyone logged without leaving the section they are in. */
function everyoneBar(section){
  if(role === 'admin' && !viewAll) return '';        // admins see all already
  return (viewAll ? '<div class="ev-note" id="ev-note"></div>' : '') +
  '<div class="ev-bar">' +
    '<button class="ev' + (viewAll ? '' : ' on') + '" data-ev="mine">Mine</button>' +
    '<button class="ev' + (viewAll ? ' on' : '') + '" data-ev="all">Everyone</button>' +
  '</div>';
}

// If the database has not been opened up, an operator sees only their own
// records and would think the app was broken. Say which it is.
async function checkEveryone(prefix){
  const el = document.getElementById('ev-note');
  if(!el || !viewAll) return;
  try{
    const rows = await scanLike(prefix + '%');
    const mine = rows.filter(([k]) => k.split(':')[1] === opId).length;
    if(rows.length && rows.length === mine){
      el.className = 'ev-note warn';
      el.textContent = 'Only your own records are coming back \u2014 ' +
        'the database has not been opened up yet (run open-records.sql)';
    } else {
      el.className = 'ev-note';
      const who = new Set(rows.map(([k]) => k.split(':')[1]));
      el.textContent = rows.length + ' record' + (rows.length === 1 ? '' : 's') +
        ' from ' + who.size + (who.size === 1 ? ' person' : ' people');
    }
  }catch(e){
    el.className = 'ev-note warn';
    el.textContent = 'Could not read the other operators\u2019 records';
  }
}

function wireEveryone(rerender){
  document.querySelectorAll('[data-ev]').forEach(b =>
    b.addEventListener('click', () => {
      const want = b.dataset.ev === 'all';
      if(want === viewAll) return;
      if(want) enterViewAll(); else leaveViewAll();
      rerender();
    }));
}

async function renderAllRecords(){
  backTo = () => { leaveViewAll(); show('s-app'); };
  $('page-title').textContent = 'Everyone\u2019s Records';
  $('page-who').textContent   = operator + ' \u00b7 view only';
  $('to-menu').textContent    = '\u2190 Menu';

  $('page-body').innerHTML =
    '<div class="mx"><div class="view-tag" style="display:block">' +
      'Read only \u00b7 you cannot change anyone\u2019s entries here</div></div>' +
    '<div class="menu fresh" id="all-list"></div>';

  const host = document.getElementById('all-list');
  ALL_PAGES.forEach((pg,i) => {
    const b = document.createElement('button');
    b.className = 'row done';
    b.innerHTML =
      '<span class="num">' + String(i+1).padStart(2,'0') + '</span>' +
      '<span class="body"><span class="label">' + pg.label + '</span>' +
      '<span class="blurb">' + pg.blurb + '</span></span>' +
      '<span class="chev">\u203a</span>';
    b.style.animationDelay = (i * 55) + 'ms';
    b.addEventListener('click', () => openAllPage(pg));
    host.appendChild(b);
  });
  show('s-page');
}

function openAllPage(pg){
  enterViewAll();                       // borrow the admin views, read only
  const back = () => { leaveViewAll(); renderAllRecords(); };

  if(pg.id === 'prod'){ renderProd().then(() => { backTo = back; }); return; }
  if(pg.id === 'qual'){ renderQualMenu().then(() => { backTo = back; }); return; }
  if(pg.id === 'scrap'){ renderScrapMenu().then(() => { backTo = back; }); return; }
}

function paintTabbar(){
  const bar = $('tabbar');
  if(!bar) return;
  bar.hidden = false;

  // a red pip on "As needed" when something is waiting
  const open = (pend.jobs || []).filter(j => j.state !== 'Complete').length +
               (stock.items || []).filter(isLow).length +
               (mach.items  || []).filter(isLow).length;

  bar.querySelectorAll('[data-mt]').forEach(b => {
    b.classList.toggle('on', b.dataset.mt === menuTab);
    const old = b.querySelector('.pip');
    if(old) old.remove();
    if(b.dataset.mt === 'adhoc' && open){
      const pip = document.createElement('span');
      pip.className = 'pip';
      pip.textContent = open > 99 ? '99+' : open;
      b.appendChild(pip);
    }
  });
}

function buildMenu(){
  paintTabbar();
  const host = $('menu');
  host.classList.toggle('fresh', !host.dataset.drawn);
  host.dataset.drawn = '1';
  host.innerHTML = '';

  // progress across the shift-entry sections only
  const board = dashCard();
  if(board){
    const wrap = document.createElement('div');
    wrap.innerHTML = board;
    host.appendChild(wrap.firstChild);
  }

  const hand = handoverCard();
  if(hand){
    const wrap = document.createElement('div');
    wrap.innerHTML = hand;
    host.appendChild(wrap.firstChild);
    const x = document.getElementById('hand-x');
    if(x) x.addEventListener('click', e => {
      const card = e.target.closest('.hand');
      try{ localStorage.setItem(seenKey('hand-seen'), card.dataset.stamp); }catch(err){}
      card.style.height = card.offsetHeight + 'px';
      requestAnimationFrame(() => card.classList.add('gone'));
      setTimeout(() => card.remove(), 220);
    });
  }

  if(role !== 'admin'){
    const entries = TABS.filter(t => t.k === 'entry');
    const done = entries.filter(t => statusOf(t) === 'Done').length;
    const pct = Math.round(done / entries.length * 100);
    const pr = document.createElement('div');
    pr.className = 'prog';
    pr.innerHTML =
      '<span class="txt">Shift ' + done + '/' + entries.length + '</span>' +
      '<span class="bar-track"><span class="bar-fill" style="width:' + pct + '%"></span></span>' +
      '<span class="txt">' + pct + '%</span>';
    host.appendChild(pr);
  }

  let idx = 0;
  GROUPS.forEach(grp => {
    const items = TABS.filter(t => t.g === grp.g);
    if(!items.length) return;

    const wrap = document.createElement('div');
    wrap.className = 'grp' + (shut[grp.g] ? ' shut' : '');
    wrap.id = 'grp-' + grp.g;

    const head = document.createElement('button');
    head.className = 'grp-head';
    head.innerHTML =
      '<span class="g-lbl">' + grp.label + '</span>' +
      '<span class="g-cnt">' + items.length + ' \u00b7 ' + grp.note + '</span>' +
      '<span class="g-arw">\u25bc</span>';
    head.addEventListener('click', () => { shut[grp.g] = !shut[grp.g]; buildMenu(); });
    wrap.appendChild(head);

    const body = document.createElement('div');
    body.className = 'grp-body';
    items.forEach(t => {
      if(t.id === 'allrec' && role === 'admin') return;   // admins have it already

      const st = statusOf(t);
      const b = document.createElement('button');
      b.className = 'row' + (st === 'Done' || /recs$/.test(st) ? ' done' : '');

      // CPU Admin only ever sees the handover line from a shift report
      const cpuRep = t.id === 'rep' && role === 'admin' && !isCPD();
      const label  = cpuRep ? 'Handover Notes' : t.label;
      const blurb  = cpuRep ? 'What each shift left for the next one.' : t.blurb;

      b.innerHTML =
        '<span class="num">' + String(seqOf(t)).padStart(2,'0') + '</span>' +
        '<span class="body"><span class="label">' + label + '</span>' +
        '<span class="blurb">' + blurb + '</span></span>' +
        '<span class="state' + (t.k === 'ref' ? ' ref' : '') + '"><i></i>' + st + '</span>' +
        '<span class="chev">\u203a</span>';
      b.style.animationDelay = (Math.min(idx++, 9) * 40) + 'ms';
      b.addEventListener('click', () => openPage(t));
      body.appendChild(b);
    });
    wrap.appendChild(body);
    host.appendChild(wrap);
  });

  if(typeof watchGroups === 'function' && 'IntersectionObserver' in window) watchGroups();
}

function openPage(t){
  backTo = null;
  $('to-menu').textContent = '\u2190 Menu';
    $('page-title').textContent = t.label;
  if(t.id === 'prod'){ renderProd(); return; }
  if(t.id === 'qual'){ renderQualMenu(); return; }
  if(t.id === 'maint'){ renderMntMenu(); return; }
  if(t.id === 'store'){ renderStoreMenu(); return; }
  if(t.id === 'items'){ renderPO(); return; }
  if(t.id === 'leave'){ renderLeaveMenu(); return; }
  if(t.id === 'rep'){ renderRepPage(); return; }
  if(t.id === 'scrap'){ renderScrapMenu(); return; }
  if(t.id === 'sched'){ renderSchedule(); return; }
  if(t.id === 'targ'){ renderTargets(); return; }
  if(t.id === 'stats'){ renderStats(); return; }
  if(t.id === 'bonus'){ renderBonus(); return; }
  if(t.id === 'inv'){ renderInvMenu(); return; }
  if(t.id === 'notice'){ renderNotices(); return; }
  if(t.id === 'recv'){ renderRecv(); return; }
  if(t.id === 'allrec'){ renderAllRecords(); return; }
  if(t.id === 'time'){
    if(role === 'admin'){ renderRecords(); show('s-rec'); return; }
    renderTime(); show('s-page'); return;
  }
  const num = String(seqOf(t)).padStart(2,'0');
  if(role === 'admin'){
    $('page-body').innerHTML =
      '<div class="page"><div class="eyebrow">Admin \u00b7 section ' + num + '</div>' +
      '<h2>' + t.label + '</h2>' +
      '<p>Entries collect here \u2014 filterable by operator and date, exportable to Excel.</p>' +
      '<span class="stub">Awaiting section ' + num + '</span></div>';
    show('s-page'); return;
  }
  const kindTxt = t.k === 'ref' ? 'Reference \u00b7 maintained by the office'
                : t.k === 'adhoc' ? 'Logged only when it happens'
                : 'Complete before signing out';
  $('page-body').innerHTML =
    '<div class="page"><div class="eyebrow">Section ' + num + ' \u00b7 ' + kindTxt +
    '</div><h2>' + t.label +
    '</h2><p>' + t.blurb + '</p><span class="stub">Fields to be added</span></div>';
  show('s-page');
}

paint();
buildMenu();
drainOutbox();

$('tabbar').querySelectorAll('[data-mt]').forEach(b =>
  b.addEventListener('click', () => {
    const grp = document.getElementById('grp-' + b.dataset.mt);
    if(!grp) return;
    menuTab = b.dataset.mt;
    shut[b.dataset.mt] = false;             // open it if it was collapsed
    buildMenu();
    document.getElementById('grp-' + b.dataset.mt)
      .scrollIntoView({behavior:'smooth', block:'start'});
  }));

/* highlight whichever group is in view */
function watchGroups(){
  if(groupWatcher) groupWatcher.disconnect();
  groupWatcher = new IntersectionObserver(entries => {
    const seen = entries.filter(e => e.isIntersecting)
                        .sort((a,b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
    if(!seen) return;
    menuTab = seen.target.id.replace('grp-','');
    paintTabbar();
  }, {rootMargin: '-15% 0px -70% 0px', threshold: 0});
  GROUPS.forEach(g => {
    const el = document.getElementById('grp-' + g.g);
    if(el) groupWatcher.observe(el);
  });
}
</script>
