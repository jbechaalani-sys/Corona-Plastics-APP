let alertTimer = null;
function saveFailed(err){
  console.warn('Storage write failed:', err);
  const el = $('save-alert');
  if(!el) return;
  el.classList.add('on');
  clearTimeout(alertTimer);
  alertTimer = setTimeout(() => el.classList.remove('on'), 6000);
}
// Storage is rate limited, so writes are queued one at a time and retried
// with backoff. Memory is updated first, so the UI never waits on the network.
const nap = ms => new Promise(r => setTimeout(r, ms));
let writeChain = Promise.resolve();

async function writeOnce(key, blob, shared, tries = 3){
  for(let i = 0; i < tries; i++){
    try{ await window.storage.set(key, blob, !!shared); return true; }
    catch(e){
      if(i === tries - 1){ saveFailed(e); return false; }
      const rateLimited = /rate limit/i.test(String(e && e.message));
      await nap((rateLimited ? 2500 : 400) * Math.pow(2, i));
    }
  }
  return false;
}

// Writes are coalesced: rapid changes to the same record (tapping five scores,
// setting a run of days) collapse into one write once things go quiet.
const WRITE_DELAY = 900;
const pending = new Map();               // key -> {blob, shared, timer}

function flushKey(key){
  const p = pending.get(key);
  if(!p) return;
  clearTimeout(p.timer);
  pending.delete(key);
  writeChain = writeChain.then(async () => {
    const ok = await writeOnce(key, p.blob, p.shared);
    if(ok) unstash(key);
    return ok;
  });
  return writeChain;
}

function flushAll(){
  [...pending.keys()].forEach(flushKey);
  return writeChain;
}

function put(key, blob, shared){
  if(readOnly) return Promise.resolve(false);   // CPU Admin never writes
  sugVer++;
  freshUntil.clear();                              // suggestion lists may have changed
  memo[key] = blob;                      // memory first, so the UI never waits
  stash(key, blob, shared);              // and on this device, in case we are offline
  if(!window.storage) return Promise.resolve(true);
  const prev = pending.get(key);
  if(prev) clearTimeout(prev.timer);
  pending.set(key, {blob, shared, timer: setTimeout(() => flushKey(key), WRITE_DELAY)});
  return Promise.resolve(true);
}

/* ── Unsent work survives a reload ─────────────────────────
   An entry made with no signal used to live only in memory,
   so closing the app lost it. Anything not yet acknowledged
   by the server is kept on the device and sent when it can. */
const OUTBOX = 'corona.outbox';
let outbox = {};
try{ outbox = JSON.parse(localStorage.getItem(OUTBOX) || '{}'); }catch(e){ outbox = {}; }

function persistOutbox(){
  try{ localStorage.setItem(OUTBOX, JSON.stringify(outbox)); }catch(e){}
  paintOutbox();
}

// a quiet marker while entries are still on their way to the server
function paintOutbox(){
  const n = Object.keys(outbox).length;
  let el = document.getElementById('outbox-tag');
  if(!n){ if(el) el.remove(); return; }
  if(!el){
    el = document.createElement('div');
    el.id = 'outbox-tag';
    document.body.appendChild(el);
  }
  el.textContent = n + (n === 1 ? ' entry waiting to send' : ' entries waiting to send');
}
function stash(key, blob, shared){
  outbox[key] = {blob, shared};
  persistOutbox();
}
function unstash(key){
  if(outbox[key]){ delete outbox[key]; persistOutbox(); }
}

// send anything left over from a previous session
async function drainOutbox(){
  const keys = Object.keys(outbox);
  if(!keys.length || !window.storage) return;
  for(const k of keys){
    const {blob, shared} = outbox[k];
    if(memo[k] === undefined) memo[k] = blob;      // make it visible straight away
    const ok = await writeOnce(k, blob, shared, 2);
    if(ok) unstash(k);
  }
}
window.addEventListener('online', drainOutbox);

// don't leave anything unwritten when the tab is closed or backgrounded
window.addEventListener('beforeunload', flushAll);
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'hidden') flushAll();
});

/* A screen used to fetch each record separately, one after another,
   before anything appeared. Whole groups are now pulled in one request
   and briefly treated as current, so opening a section is instant. */
const freshUntil = new Map();
const FRESH_MS = 20000;

async function prefetch(prefix, shared){
  if(prefix === 'mst:'){                     // machine status can change under us
    Object.keys(statusCache).forEach(k => delete statusCache[k]);
  }
  await scanAll(prefix, shared);
  freshUntil.set(prefix + '|' + !!shared, Date.now() + FRESH_MS);
}
function isFresh(key, shared){
  const now = Date.now();
  for(const [tag, exp] of freshUntil){
    if(exp < now){ freshUntil.delete(tag); continue; }
    const cut = tag.lastIndexOf('|');
    if(tag.slice(cut+1) === String(!!shared) && key.startsWith(tag.slice(0, cut))) return true;
  }
  return false;
}

// read that works for both personal and shared keys
async function grab(key, shared){
  if(isFresh(key, shared)) return memo[key] || null;   // already in hand
  if(window.storage){
    try{
      const g = await window.storage.get(key, !!shared);
      if(g && g.value != null){ memo[key] = g.value; return g.value; }
    }catch(e){ /* not stored yet */ }
  }
  return memo[key] || null;
}
let goingBack = false;

    const jobs = [loadNotices(), loadHandover(), prefetch('mst:', true)];

  window.scrollTo(0, 0);
};

// Date + shift stamps
// The app is open across whole shifts, so "now" has to keep moving.
// Frozen at page load, everything after midnight was filed under the
// day before.
const now = new Date();
let dayTick = null;

function keepTime(){
  clearInterval(dayTick);
  dayTick = setInterval(() => {
    const wasDay   = workDate();
    const wasShift = shift;
    now.setTime(Date.now());
    const isDay   = workDate();
    const isShift = shiftLabel();
    if(isDay === wasDay && isShift === wasShift) return;

    // a new day or a change of shift: refresh what is on screen
    dateStr = now.toLocaleDateString('en-GB',
      {weekday:'short', day:'2-digit', month:'short'}).toUpperCase();
    shift = shiftLabel();
    const t = $('today');  if(t) t.textContent = dateStr;
    const s = $('stamp');  if(s) s.textContent = dateStr + ' \u00b7 ' + shift;
    const o = $('shift-out');
    if(o && opId) o.textContent = (role === 'admin'
      ? (readOnly ? 'View only \u00b7 ' : 'All operators \u00b7 ') + dateStr
      : dateStr + ' \u00b7 ' + shift);

    if(isDay !== wasDay){
      // a new working day begins at 08:00, not at midnight
      mixDate = sndDate = flmDate = quaDate = scrDate = repDate = mntDate = dwnDate = lmhDate = '';
      freshUntil.clear();
      Object.keys(statusCache).forEach(k => delete statusCache[k]);
      if(opId) loadDay();
    }
    if(document.getElementById('s-app').classList.contains('on')) buildMenu();
  }, 30000);
}
keepTime();
let dateStr = now.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short'}).toUpperCase();
// 24/7 operation on two 12-hour shifts
const DAY_START = 8, NIGHT_START = 20;      // 08:00-20:00 day, 20:00-08:00 night

/* Shift times vary, so nothing is assumed about when a day starts.
   While someone is clocked in, everything they log belongs to the day
   their shift began — whether that was 08:00, 23:00 or 02:00. Off
   shift, it is simply today. */
function workDate(){
  if(typeof day === 'object' && day && day.inAt && !day.outAt && dayRef){
    const d = dayRef.split(':')[2];
    if(d) return d;
  }
  return iso(now);
}

/* The label follows the hour they actually started, not a fixed pattern. */
function shiftLabel(){
  const hr = (day && day.inAt) ? new Date(day.inAt).getHours() : now.getHours();
  return shiftAt(hr);
}
const shiftAt = hr => (hr >= DAY_START && hr < NIGHT_START) ? 'DAY SHIFT' : 'NIGHT SHIFT';

/* Reading a whole month at once.
   Scans used to list the keys and then fetch each record separately:
   hundreds of round trips for a single admin screen. This asks for
   keys and values together. */
async function scanAll(prefix, shared){
  const out = [];
  const seen = new Set();

  // if this group was just pulled in, use what we have rather than asking again
  if(isFresh(prefix, shared)){
    Object.keys(memo).forEach(k => { if(k.startsWith(prefix)) out.push([k, memo[k]]); });
    return out;
  }

  try{
    if(window.storage && window.storage.listAll){
      for(const [k, v] of await window.storage.listAll(prefix, shared)){
        memo[k] = v; seen.add(k); out.push([k, v]);
      }
    } else if(window.storage){
      const list = await window.storage.list(prefix, shared);
      for(const k of (list && list.keys) || []){
        try{
          const g = await window.storage.get(k, shared);
          if(g){ memo[k] = g.value; seen.add(k); out.push([k, g.value]); }
        }catch(e){}
      }
    }
  }catch(e){}
  Object.keys(memo).forEach(k => {
    if(k.startsWith(prefix) && !seen.has(k)) out.push([k, memo[k]]);
  });
  return out;
}

let day = {inAt:null, outAt:null};
const memo = {};
// iso() is local. toISOString() is UTC, which put the hours between
// midnight and 4am onto the previous day.
/* Clocking works round the clock. A shift is filed under the day it
   started, whenever that was, and clocking out finds the shift that is
   still open rather than assuming which day it belongs to. */
let dayRef = null;
const shiftKeyFor = d => 'shift:' + opId + ':' + d;
const dayKey = () => dayRef || shiftKeyFor(iso(now));

async function loadDay(){
  day = {inAt:null, outAt:null};
  const today = iso(now);
  const yest  = iso(new Date(now.getTime() - 86400000));
  dayRef = shiftKeyFor(today);

  // an open shift wins, whichever day it started on
  for(const d of [today, yest]){
    const raw = await grab(shiftKeyFor(d));
    if(!raw) continue;
    try{
      const r = JSON.parse(raw);
      if(r.inAt && !r.outAt){ day = r; dayRef = shiftKeyFor(d); break; }
      if(d === today) day = r;                 // today's, already finished
    }catch(e){}
  }
  buildMenu();
}
async function saveDay(){ return put(dayKey(), JSON.stringify(day)); }

const hhmm = iso => {
  const d = new Date(iso);
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
};
function spanMins(){
  if(!day.inAt) return 0;
  const end = day.outAt ? new Date(day.outAt) : new Date();
  let m = Math.floor((end - new Date(day.inAt)) / 60000);
  if(m < 0) m += 1440;               // shift ran past midnight
  return m;
}
const asHrs = m => Math.floor(m/60) + 'h ' + String(m%60).padStart(2,'0') + 'm';


/* ── The report has to be done before clocking out ─────────

async function reportGaps(){
  const raw = await grab('rep:' + opId + ':' + iso(now));
  let r = {};
  if(raw){ try{ r = JSON.parse(raw); }catch(e){} }
  if(r.removed) r = {};
  const gaps = [];
  if(!r.run) gaps.push('An overall rating for the shift');
  REP_QS.forEach(q => { if(!(r[q.k] || '').trim()) gaps.push(q.label); });
  return gaps;
}

function renderTime(){
  const st = !day.inAt ? ['','Not clocked in']
           : !day.outAt ? ['live','On shift']
           : ['done','Shift complete'];

  // the times are what the clock recorded; only CPD Admin can change them
  const slot = (cap,iso,which) =>
    '<div class="tp-slot"><div class="cap">' + cap + '</div>' +
    '<div class="val' + (iso?'':' void') + '">' + (iso ? hhmm(iso) : '\u2013\u2013:\u2013\u2013') + '</div>' +
    '</div>';

  document.getElementById('page-body').innerHTML =
    '<div class="tp">' +
      '<div class="tp-state ' + st[0] + '"><i></i>' + st[1] + '</div>' +
      '<div class="tp-pair">' + slot('Time in', day.inAt, 'inAt') + slot('Time out', day.outAt, 'outAt') + '</div>' +
      '<div class="tp-total"><span class="cap">Hours on shift</span>' +
        '<span class="val" id="tp-run">' + (day.inAt ? asHrs(spanMins()) : '\u2013') + '</span></div>' +
      (!day.inAt
        ? '<button class="tp-act in" id="tp-go">Clock in</button>'
        : !day.outAt
          ? '<button class="tp-act out" id="tp-go">Clock out</button>' +
            '<div class="tp-gate" id="tp-gate"></div>'
          : '<button class="tp-act" disabled>Shift recorded</button>') +
      '<button class="tool" id="tp-rec" style="margin-top:14px">View time records</button>' +
      '<div class="tp-note">' +
        (day.inAt
          ? 'Times are recorded as pressed. Ask the office if one needs changing.'
          : 'Records the time you press it.') +
      '</div>' +
    '</div>';

  const go = document.getElementById('tp-go');
  if(go) go.addEventListener('click', async () => {
    if(!day.inAt){
      dayRef = shiftKeyFor(iso(now));          // a shift belongs to the day it began
      day.inAt = new Date().toISOString();
    } else if(!day.outAt){
      const gaps = await reportGaps();
      if(gaps.length){ needReport(gaps); return; }   // no clocking out yet
      day.outAt = new Date().toISOString();
    }
    shift = shiftLabel();
    const o = $('shift-out');
    if(o && role !== 'admin') o.textContent = dateStr + ' \u00b7 ' + shift;
    await saveDay(); renderTime(); buildMenu();
  });

  const rv = document.getElementById('tp-rec');
  if(rv) rv.addEventListener('click', () => { clearInterval(ticker); renderRecords(); show('s-rec'); });

  // a quiet line under the button, so the requirement is known in advance
  if(day.inAt && !day.outAt){
    reportGaps().then(gaps => {
      const el = document.getElementById('tp-gate');
      if(!el) return;
      el.textContent = gaps.length
        ? 'Your daily report needs finishing before you can clock out'
        : '\u2713 Daily report complete';
      el.className = 'tp-gate' + (gaps.length ? '' : ' ok');
    }).catch(() => {});
  }

  clearInterval(ticker);
  if(day.inAt && !day.outAt){
    ticker = setInterval(() => {
      const el = document.getElementById('tp-run');
      if(el) el.textContent = asHrs(spanMins()); else clearInterval(ticker);
    }, 1000);
  }
}


/* ── Records: daily + monthly ─────────────── */
const STD_MINS = 12 * 60;                 // standard shift = 12h

// Overtime is the exact time past 12h: 13h 15m on shift = 1h 15m OT.
const otOf  = m => Math.max(0, m - STD_MINS);
const regOf = m => Math.min(m, STD_MINS);
const iso   = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0')
                 + '-' + String(d.getDate()).padStart(2,'0');

let recView = 'daily', recWho = 'ALL',
    recDay  = iso(now), recMonth = iso(now).slice(0,7);

function minutesFor(r){
  if(!r.inAt) return 0;
  const end = r.outAt ? new Date(r.outAt) : new Date();
  let m = Math.floor((end - new Date(r.inAt)) / 60000);
  if(m < 0) m += 1440;
  return m;
}

async function allRecords(month){
  const out = [];
  const take = (k, v) => {
    const [, id, date] = k.split(':');
    const name = nameOf(id);
    let r; try{ r = JSON.parse(v); }catch(e){ return; }
    if(r && r.inAt) out.push({oid: id, name, date, ...r});
  };
  for(const [k, v] of await scanLike('shift:%' + (month || recMonth) + '%')) take(k, v);
  const seen = new Set(out.map(r => r.name + r.date));
  Object.keys(memo).filter(k => k.startsWith('shift:')).forEach(k => {
    const [, id, date] = k.split(':');
    if(!seen.has(nameOf(id) + date)) take(k, memo[k]);
  });
  return out.sort((a,b) => a.date.localeCompare(b.date) || a.name.localeCompare(b.name));
}

function cellsFor(r){
  const m = minutesFor(r), ot = otOf(m);
  return {
    inTxt : hhmm(r.inAt),
    outTxt: r.outAt ? hhmm(r.outAt) : '<span class="open">on shift</span>',
    total : asHrs(m),
    reg   : asHrs(regOf(m)),
    ot    : ot ? '<span class="ot">' + asHrs(ot) + '</span>'
               : '<span class="ot zero">\u2013</span>',
    otMins: ot, mins: m
  };
}

/* Only CPD Admin can change a recorded time — a delay in pressing the
   button, or a shift someone forgot to close. */
let timeEdit = null;

async function saveTimeEdit(oid, date, inHHMM, outHHMM){
  const key = 'shift:' + oid + ':' + date;
  let rec = {};
  const raw = await grab(key);
  if(raw){ try{ rec = JSON.parse(raw); }catch(e){} }

  const at = (hhmmStr, base) => {
    if(!hhmmStr) return null;
    const [hr, mi] = hhmmStr.split(':').map(Number);
    const d = new Date((base || date) + 'T00:00:00');
    d.setHours(hr, mi, 0, 0);
    // an end time earlier than the start belongs to the next day
    return d;
  };

  const inD = at(inHHMM);
  if(!inD) return false;
  rec.inAt = inD.toISOString();

  if(outHHMM){
    const outD = at(outHHMM);
    if(outD <= inD) outD.setDate(outD.getDate() + 1);
    rec.outAt = outD.toISOString();
  } else {
    delete rec.outAt;
  }
  rec.fixedBy = operator;
  rec.fixedAt = stamp();
  await put(key, JSON.stringify(rec));
  freshUntil.clear();
  return true;
}

async function renderRecords(){
  const rows = await allRecords();
  const names = CREW.map(c => c.name);

  const isAdmin = isOffice();              // CPD or CPU, never a borrowed role
  if(!isAdmin) recWho = operator;          // an operator only ever sees their own sheet

  const dateBox = recView === 'daily'
    ? '<input type="date" id="rc-day" value="'+recDay+'">'
    : '<input type="month" id="rc-month" value="'+recMonth+'">';

  const pick = isAdmin
    ? '<div class="filters">' +
        '<select id="rc-who">' +
          '<option value="ALL">All operators</option>' +
          names.map(n => '<option value="'+n+'"'+(recWho===n?' selected':'')+'>'+n+'</option>').join('') +
        '</select>' + dateBox +
      '</div>'
    : '<div class="filters" style="grid-template-columns:1fr">' + dateBox + '</div>';

  let body = '', sums = '';
  const scope = rows.filter(r =>
    (recWho === 'ALL' || r.name === recWho) &&
    (recView === 'daily' ? r.date === recDay : r.date.slice(0,7) === recMonth));

  const tot = scope.reduce((a,r) => a + minutesFor(r), 0);
  const otT = scope.reduce((a,r) => a + otOf(minutesFor(r)), 0);
  const regT = scope.reduce((a,r) => a + regOf(minutesFor(r)), 0);

  sums =
    '<div class="sums">' +
      '<div class="sum"><div class="cap">Shifts</div><div class="val">'+scope.length+'</div></div>' +
      '<div class="sum"><div class="cap">Total hours</div><div class="val">'+asHrs(tot)+'</div></div>' +
      '<div class="sum ot"><div class="cap">Overtime</div><div class="val">'+asHrs(otT)+'</div></div>' +
    '</div>';

  if(!scope.length){
    body = '<div class="tbl-wrap"><div class="empty">No shifts recorded for this ' +
           (recView === 'daily' ? 'date' : 'month') + '</div></div>';
  } else if(recView === 'monthly' && recWho === 'ALL'){
    const per = {};
    scope.forEach(r => {
      const m = minutesFor(r);
      per[r.name] = per[r.name] || {days:0, mins:0, ot:0, reg:0};
      per[r.name].days++; per[r.name].mins += m;
      per[r.name].ot += otOf(m); per[r.name].reg += regOf(m);
    });
    body =
      '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
      '<th>Operator</th><th class="r">Days</th><th class="r">Regular</th>' +
      '<th class="r">Overtime</th><th class="r">Total</th></tr></thead><tbody>' +
      Object.keys(per).sort().map(n => {
        const p = per[n];
        return '<tr><td class="who-cell">'+n+'</td><td class="r">'+p.days+'</td>' +
               '<td class="r">'+asHrs(p.reg)+'</td>' +
               '<td class="r">'+(p.ot ? '<span class="ot">'+asHrs(p.ot)+'</span>'
                                      : '<span class="ot zero">\u2013</span>')+'</td>' +
               '<td class="r">'+asHrs(p.mins)+'</td></tr>';
      }).join('') +
      '</tbody><tfoot><tr><td>Total</td><td class="r">'+scope.length+'</td>' +
      '<td class="r">'+asHrs(regT)+'</td><td class="r">'+asHrs(otT)+'</td>' +
      '<td class="r">'+asHrs(tot)+'</td></tr></tfoot></table></div>';
  } else {
    const showName = recWho === 'ALL';
    body =
      '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
      (recView === 'monthly' ? '<th>Date</th>' : '') +
      (showName ? '<th>Operator</th>' : '') +
      '<th>In</th><th>Out</th><th class="r">Regular</th>' +
      '<th class="r">Overtime</th><th class="r">Total</th>' +
      (isCPD() ? '<th></th>' : '') + '</tr></thead><tbody>' +
      scope.map(r => {
        const c = cellsFor(r);
        return '<tr>' +
          (recView === 'monthly' ? '<td>'+r.date.slice(8)+'/'+r.date.slice(5,7)+'</td>' : '') +
          (showName ? '<td class="who-cell">'+r.name+'</td>' : '') +
          '<td>'+c.inTxt + (r.fixedBy ? '<br><span class="edited">corrected</span>' : '') + '</td>' +
          '<td>'+c.outTxt+'</td>' +
          '<td class="r">'+c.reg+'</td><td class="r">'+c.ot+'</td>' +
          '<td class="r">'+c.total+'</td>' +
          (isCPD()
            ? '<td class="r"><button class="row-ed" data-te="' + esc(r.oid) + '|' + esc(r.date) +
              '" aria-label="Correct the times">\u270e</button></td>'
            : '') +
          '</tr>';
      }).join('') +
      '</tbody></table></div>';
  }

  document.getElementById('rec-body').innerHTML =
    '<div class="rc">' +
      '<div class="seg">' +
        '<button data-v="daily"'  +(recView==='daily'  ?' class="on"':'')+'>Daily</button>' +
        '<button data-v="monthly"'+(recView==='monthly'?' class="on"':'')+'>Monthly</button>' +
      '</div>' + pick + timeEditPanel() + sums + body +
      (isAdmin
        ? '<div class="tools">' +
            '<button class="tool go" id="rc-xls">\u2193 Download Excel</button>' +
            '<button class="tool" id="rc-seed">Load sample month</button>' +
            '<button class="tool" id="rc-wipe">Clear all records</button>' +
          '</div>'
        : '') +
      '<div class="rc-note">Standard shift 12h 00m \u00b7 anything beyond counts as overtime</div>' +
    '</div>';

  document.querySelectorAll('.seg button').forEach(b =>
    b.addEventListener('click', () => { recView = b.dataset.v; renderRecords(); }));
  const w = document.getElementById('rc-who');
  if(w) w.addEventListener('change', () => { recWho = w.value; renderRecords(); });
  const dd = document.getElementById('rc-day');
  if(dd) dd.addEventListener('change', () => { recDay = dd.value; renderRecords(); });
  const mm = document.getElementById('rc-month');
  if(mm) mm.addEventListener('change', () => { recMonth = mm.value; renderRecords(); });

  document.querySelectorAll('[data-te]').forEach(b =>
    b.addEventListener('click', () => {
      const [oid, date] = b.dataset.te.split('|');
      const row = scope.find(r => r.oid === oid && r.date === date);
      if(!row) return;
      timeEdit = {oid, date, name: row.name,
                  inHH: row.inAt ? hhmm(row.inAt) : '',
                  outHH: row.outAt ? hhmm(row.outAt) : ''};
      renderRecords();
    }));

  const tv = document.getElementById('te-save');
  if(tv) tv.addEventListener('click', async () => {
    const inV = document.getElementById('te-in').value;
    const outV = document.getElementById('te-out').value;
    if(!inV){ alert('A time in is needed.'); return; }
    await saveTimeEdit(timeEdit.oid, timeEdit.date, inV, outV);
    timeEdit = null;
    if(timeEdit === null && opId) await loadDay();
    renderRecords();
  });
  const tc = document.getElementById('te-cancel');
  if(tc) tc.addEventListener('click', () => { timeEdit = null; renderRecords(); });

  const sd = document.getElementById('rc-seed');
  if(sd) sd.addEventListener('click', seedMonth);
  const wp = document.getElementById('rc-wipe');
  if(wp) wp.addEventListener('click', wipeAll);
  const xl = document.getElementById('rc-xls');
  if(xl) xl.addEventListener('click', () => exportSheet(scope));
}


/* ── Excel export (admin only) ────────────── */
const decHrs = m => Math.round(m / 60 * 100) / 100;   // 12h 45m -> 12.75, for payroll maths

function buildRows(scope){
  const detail = [['Date','Operator','Time in','Time out','Regular (h)','Overtime (h)',
                   'Total (h)','Corrected by','Corrected at']];
  const per = {};
  scope.forEach(r => {
    const m = minutesFor(r), o = otOf(m);
    detail.push([r.date, r.name, hhmm(r.inAt), r.outAt ? hhmm(r.outAt) : 'OPEN',
                 decHrs(regOf(m)), decHrs(o), decHrs(m),
                 r.fixedBy || '', r.fixedAt || '']);
    per[r.name] = per[r.name] || {days:0, mins:0, ot:0, reg:0};
    per[r.name].days++; per[r.name].mins += m; per[r.name].ot += o; per[r.name].reg += regOf(m);
  });

  const summary = [['Operator','Shifts','Regular (h)','Overtime (h)','Total (h)']];
  let d=0, reg=0, ot=0, tot=0;
  Object.keys(per).sort().forEach(n => {
    const q = per[n];
    summary.push([n, q.days, decHrs(q.reg), decHrs(q.ot), decHrs(q.mins)]);
    d += q.days; reg += q.reg; ot += q.ot; tot += q.mins;
  });
  summary.push(['TOTAL', d, decHrs(reg), decHrs(ot), decHrs(tot)]);

  return {detail, summary};
}

function exportSheet(scope){
  if(!scope.length){ alert('Nothing to export for this selection.'); return; }

  const {detail, summary} = buildRows(scope);
  const stamp = recView === 'daily' ? recDay : recMonth;
  const whoTag = recWho === 'ALL' ? 'all' : recWho.replace(/[^\w]+/g,'-').toLowerCase();
  const base = 'corona-timesheet-' + whoTag + '-' + stamp;

  if(window.XLSX){
    const wb = XLSX.utils.book_new();
    const s1 = XLSX.utils.aoa_to_sheet(summary);
    const s2 = XLSX.utils.aoa_to_sheet(detail);
    s1['!cols'] = [{wch:20},{wch:8},{wch:12},{wch:13},{wch:10}];
    s2['!cols'] = [{wch:12},{wch:20},{wch:10},{wch:10},{wch:12},{wch:13},{wch:10},{wch:18},{wch:18}];
    XLSX.utils.book_append_sheet(wb, s1, 'Summary');
    XLSX.utils.book_append_sheet(wb, s2, 'Shifts');
    XLSX.writeFile(wb, base + '.xlsx');
    return;
  }

  // library didn't load — CSV still opens in Excel
  const q = v => /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g,'""') + '"' : v;
  const csv = [...summary, [], ...detail].map(r => r.map(q).join(',')).join('\r\n');
  const url = URL.createObjectURL(new Blob(['\ufeff' + csv], {type:'text/csv;charset=utf-8'}));
  const a = document.createElement('a');
  a.href = url; a.download = base + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

/* sample data so the views have something to show */
async function seedMonth(){
  const base = new Date(now.getFullYear(), now.getMonth(), 1);
  for(let d = 0; d < now.getDate(); d++){
    const day = new Date(base); day.setDate(base.getDate() + d);
    if(day.getDay() === 5) continue;                 // Friday off
    for(const c of CREW){
      if(Math.random() < 0.12) continue;             // absence
      const startH = 6, jitter = Math.floor(Math.random()*11) - 5;
      const inD  = new Date(day); inD.setHours(startH, 30 + jitter, 0, 0);
      const extra = Math.random() < 0.3 ? Math.floor(Math.random()*150) : 0;
      const outD = new Date(inD.getTime() + (STD_MINS + extra) * 60000);
      memo['shift:' + c.id + ':' + iso(day)] =
        JSON.stringify({inAt: inD.toISOString(), outAt: outD.toISOString()});
    }
  }
  countShifts();
  renderRecords();
}

async function wipeAll(){
  try{
    if(window.storage){
      const list = await window.storage.list('shift:');
      for(const k of (list && list.keys) || []){
        try{ await window.storage.delete(k); }catch(e){}
      }
    }
  }catch(e){}
  Object.keys(memo).forEach(k => delete memo[k]);
  day = {inAt:null, outAt:null};
  shiftCount = 0;
  buildMenu(); renderRecords();
}

/* ── Move first, load after ────────────────────────────────
   Waiting for the network before drawing is what makes a web
   page feel like a web page. The screen appears at once from
   what is already held, fills in when the data lands, and a
   thin bar shows that something is still coming.            */
function busy(on){
  let el = document.getElementById('loading-bar');
  if(!on){ if(el) el.remove(); return; }
  if(el) return;
  el = document.createElement('div');
  el.id = 'loading-bar';
  document.body.appendChild(el);
}

async function openWith(draw, load){
  draw();                       // instant, from what we have
  busy(true);
  try{ await load(); }catch(e){}
  busy(false);
  document.body.classList.add('no-anim');   // refill without replaying anything
  draw();
  requestAnimationFrame(() => document.body.classList.remove('no-anim'));
}

/* ── Rolls made, day by day ────────────────────────────────
   The sheet only ever shows one date, so at midnight the work
   just done leaves the screen. This keeps the last few weeks
   in view.                                                   */
let rollDays = [];

function buildRollDays(){
  const byDay = {};
  Object.keys(memo).forEach(k => {
    if(!k.startsWith('lmh:' + opId + ':')) return;
    const [, , mac, date] = k.split(':');
    if(!date) return;
    try{
      const r = JSON.parse(memo[k]);
      const d = byDay[date] || (byDay[date] = {date, n:0, pass:0, rej:0, q:0, macs:{}});
      (r.rolls || []).forEach(x => {
        d.n++;
        const res = normRes(x.result);
        if(res === 'Pass') d.pass++;
        else if(res === 'Rejected') d.rej++;
        else if(res === 'Questionable') d.q++;
        d.macs[mac] = (d.macs[mac] || 0) + 1;
      });
    }catch(e){}
  });
  rollDays = Object.values(byDay).filter(d => d.n)
    .sort((a,b) => b.date.localeCompare(a.date)).slice(0, 21);
}

function rollDaysBlock(){
  if(role === 'admin' || !rollDays.length) return '';
  const today = iso(now);
  const total = rollDays.reduce((a,d) => a + d.n, 0);

  return '<div class="blk' + (blkShut.rolldays ? ' shut' : '') + '" data-blk="rolldays">' +
    '<button class="blk-head"><span class="b-lbl">Rolls you have made</span>' +
      '<span class="b-cnt">' + total + ' over ' + rollDays.length +
        (rollDays.length === 1 ? ' day' : ' days') + '</span>' +
      '<span class="b-arw">\u25bc</span></button>' +
    '<div class="blk-body"><div class="rd-list">' +
      rollDays.map(d =>
        '<div class="rd' + (d.date === today ? ' now' : '') + '">' +
          '<span class="rd-day">' + d.date.slice(8) + '/' + d.date.slice(5,7) +
            (d.date === today ? ' <b>today</b>' : '') + '</span>' +
          '<span class="rd-n">' + d.n + '</span>' +
          '<span class="rd-mix">' +
            Object.keys(d.macs).sort().map(m => macLabel(m).replace('Machine ','M') +
              ' ' + d.macs[m]).join(' \u00b7 ') +
          '</span>' +
          '<span class="rd-res">' +
            (d.rej ? '<i class="bad">' + d.rej + ' rej</i>' : '') +
            (d.q ? '<i class="warn">' + d.q + ' q</i>' : '') +
            (!d.rej && !d.q ? '<i class="ok">all passed</i>' : '') +
          '</span>' +
        '</div>').join('') +
    '</div></div></div>';
}

async function renderProd(){
  backTo = () => { leaveViewAll(); show('s-app'); };
  return openWith(drawProd, async () => {
    if(role === 'admin') return;
    // every stage in one parallel burst rather than a trip each
    await Promise.all([
      prefetch('mix:' + opId + ':'),
      prefetch('lmh:' + opId + ':'),
      prefetch('snd:' + opId + ':'),
      prefetch('flm:' + opId + ':'),
      prefetch('mst:', true)
    ]);
    if(mixDate !== workDate()){ mixDate = workDate(); await loadMix(); }
    if(sndDate !== workDate()){ sndDate = workDate(); await loadSnd(); }
    if(flmDate !== workDate()){ flmDate = workDate(); await loadFlm(); }

    lmhCount = 0;
    for(const mc of MACHINES){
      try{
        const raw = memo[lmhKey(opId, mc.id, iso(now))];
        if(raw){ const r = JSON.parse(raw); lmhCount += (r.rolls || []).length; }
      }catch(e){}
    }
    buildRollDays();
  });
}

function drawProd(){
  $('page-title').textContent = 'Production Data';
  $('page-who').textContent   = operator + ' \u00b7 ' + shift;
  $('to-menu').textContent    = '\u2190 Menu';

  $('page-body').innerHTML =
    '<div class="mx" style="padding-bottom:0">' + everyoneBar('prod') + '</div>' +
    '<div class="menu fresh" id="stage-list"></div>' +
    '<div class="mx" id="roll-days">' + (viewAll ? '' : rollDaysBlock()) + '</div>';
  wireEveryone(() => renderProd());
  if(viewAll) checkEveryone('lmh:');
  const host = document.getElementById('stage-list');

  document.querySelectorAll('#roll-days .blk-head').forEach(b =>
    b.addEventListener('click', () => {
      const k = b.parentElement.dataset.blk;
      blkShut[k] = !blkShut[k];
      b.parentElement.classList.toggle('shut', blkShut[k]);
    }));

  STAGES.forEach((s,i) => {
    const b = document.createElement('button');
    b.className = 'row';
    b.innerHTML =
      '<span class="num">' + String(i+1).padStart(2,'0') + '</span>' +
      '<span class="body"><span class="label">' + s.label + '</span>' +
      '<span class="blurb">' + s.blurb + '</span></span>' +
      '<span class="state"><i></i>' + (mixDone(s) ? 'Done' : 'Empty') + '</span>' +
      '<span class="chev">\u203a</span>';
    if(mixDone(s)) b.classList.add('done');
    b.style.animationDelay = (i * 55) + 'ms';
    b.addEventListener('click', () => openStage(s));
    host.appendChild(b);
  });
  show('s-page');
}

async function openStage(s){
  backTo = renderProd;
  mixEdit = null; mixDraftLoaded = false; rollEdit = null; flmEdit = null; dwnEdit = null;
  stage = s.id;
  const i = STAGES.findIndex(x => x.id === s.id) + 1;
  $('page-title').textContent = s.label;
  $('page-who').textContent   = role === 'admin'
    ? 'Production Data \u00b7 all operators'
    : 'Production Data \u00b7 stage ' + i + ' of ' + STAGES.length;
  $('to-menu').textContent    = '\u2190 Production';

  if(s.id === 'mix'){
    if(role === 'admin'){ await renderMixAdmin(); show('s-page'); return; }
    await loadMix(); renderMix(); show('s-page'); return;
  }
  if(s.id === 'lmh'){ await renderLmh(); return; }
  if(s.id === 'sand'){ await renderSandMenu(); return; }
  if(s.id === 'flam'){ await renderFlmMenu(); return; }

  $('page-body').innerHTML =
    '<div class="page"><div class="eyebrow">Production \u00b7 stage ' +
    String(i).padStart(2,'0') + '</div><h2>' + s.label + '</h2>' +
    '<p>' + s.blurb + '</p><span class="stub">Fields to be added</span></div>';
  show('s-page');
}

let mix = {material:'', rows:[]};

const mixKey = (who, d) => 'mix:' + (who || opId) + ':' + (d || mixDate || workDate());
const num = v => { const n = parseFloat(v); return isFinite(n) && n >= 0 ? n : 0; };

// older entries stored a single resin; present everything as blend lines
function lines(r){
  if(Array.isArray(r.lines)) return r.lines;
  return r.resin ? [{resin:r.resin, bags:num(r.bags)}] : [];
}
const bagsOf = r => lines(r).reduce((a,l) => a + num(l.bags), 0);

async function loadMix(){
  mix = {material:'', rows:[]};
  try{
    if(window.storage){
      const r = await window.storage.get(mixKey());
      if(r && r.value) mix = JSON.parse(r.value);
    } else if(memo[mixKey()]) mix = JSON.parse(memo[mixKey()]);
  }catch(e){ /* nothing logged yet today */ }
  if(!Array.isArray(mix.rows)) mix.rows = [];
}
async function saveMix(){ return put(mixKey(), JSON.stringify(mix)); }

const sum  = (rows, f) => rows.reduce((a,r) => a + num(r[f]), 0);
const tidy = n => Number.isInteger(n) ? n : Math.round(n*100)/100;

function seenValues(field, seed){
 return cachedList('sv:' + field, () => {
  const out = new Set(seed || []);
  Object.keys(memo).filter(k => k.startsWith('mix:')).forEach(k => {
    try{
      const r = JSON.parse(memo[k]);
      (r.rows || []).forEach(row => {
        if(field === 'mat' && row.mat) out.add(row.mat);
        if(field === 'resin') lines(row).forEach(l => l.resin && out.add(l.resin));
      });
      if(field === 'mat' && r.material) out.add(r.material);
    }catch(e){}
  });
  return [...out].filter(Boolean).sort();
 });
}

function readDraft(){
  const names = [...document.querySelectorAll('.rz-name')];
  const bags  = [...document.querySelectorAll('.rz-bags')];
  draft = names.map((n,i) => ({resin: n.value, bags: bags[i] ? bags[i].value : ''}));

}

function paintResins(){
  const host = document.getElementById('rz-lines');
  if(!host) return;
  host.innerHTML = draft.map((l,i) =>
    '<div class="rz-line">' +
      '<input class="rz-name" list="d-resin" placeholder="Resin" value="' + esc(l.resin) + '">' +
      '<input class="rz-bags" inputmode="numeric" placeholder="Bags" value="' + esc(l.bags) + '">' +
      '<button class="rz-x" data-i="' + i + '"' + (draft.length < 2 ? ' disabled' : '') +
        ' aria-label="Remove resin">\u2715</button>' +
    '</div>').join('');

  const total = draft.reduce((a,l) => a + num(l.bags), 0);
  const tot = document.getElementById('rz-total');
  if(tot) tot.innerHTML = 'Total bags <b>' + tidy(total) + '</b>';

  host.querySelectorAll('.rz-bags').forEach(inp =>
    inp.addEventListener('input', () => { readDraft(); 
      const t = draft.reduce((a,l) => a + num(l.bags), 0);
      const el = document.getElementById('rz-total');
      if(el) el.innerHTML = 'Total bags <b>' + tidy(t) + '</b>';
    }));
  host.querySelectorAll('.rz-x').forEach(b =>
    b.addEventListener('click', () => {
      readDraft();
      draft.splice(+b.dataset.i, 1);
      if(!draft.length) draft = [{resin:'', bags:''}];
      paintResins();
    }));
}

/* ── Mixing: admin monthly view ───────────── */
let mixMonth = iso(now).slice(0,7), mixWho = 'ALL';

async function allMix(month){
  const out = [];
  const take = (key, val) => {
    const [, id, date] = key.split(':');
    const name = nameOf(id);
    let r; try{ r = JSON.parse(val); }catch(e){ return; }
    if(!r || !Array.isArray(r.rows) || !r.rows.length) return;
    r.rows.forEach(row => out.push({
      name, date,
      mat: row.mat || r.material || '',
      t: row.t || '', lines: lines(row),
      kg: num(row.kg), gay: num(row.gay), bags: bagsOf(row)
    }));
  };
  for(const [k, v] of await scanLike('mix:%' + (month || mixMonth) + '%')) take(k, v);
  const seen = new Set(out.map(r => r.name + r.date));
  Object.keys(memo).filter(k => k.startsWith('mix:')).forEach(k => {
    const [, id, date] = k.split(':');
    if(!seen.has(nameOf(id) + date)) take(k, memo[k]);
  });
  return out.sort((a,b) => a.date.localeCompare(b.date) || (a.t||'').localeCompare(b.t||''));
}

function exportMix(scope){
  if(!scope.length){ alert('Nothing to export for this month.'); return; }
  const blendTxt = r => r.lines.map(l => (l.resin || '?') + ' \u00d7' + num(l.bags)).join(' + ');

  // 1. one row per batch
  const batches = [['Date','Operator','Time','Material','Resin blend','Bags used','Kg','Gaylords']];
  scope.forEach(r => batches.push([r.date, r.name, r.t, r.mat, blendTxt(r),
                                   r.bags, r.kg, r.gay]));

  // 2. one row per resin line — kg and gaylords stay on the batch to avoid double counting
  const rlines = [['Date','Operator','Time','Material','Resin','Bags used','Batch kg','Batch gaylords']];
  scope.forEach(r => r.lines.forEach((l,i) =>
    rlines.push([r.date, r.name, r.t, r.mat, l.resin, num(l.bags),
                 i === 0 ? r.kg : '', i === 0 ? r.gay : ''])));

  // 3. resin consumption for the month
  const byRes = {};
  scope.forEach(r => r.lines.forEach(l => {
    const k = l.resin || '\u2013';
    byRes[k] = byRes[k] || {bags:0, batches:0};
    byRes[k].bags += num(l.bags); byRes[k].batches++;
  }));
  const resin = [['Resin','Batches','Bags used']];
  Object.keys(byRes).sort().forEach(k => resin.push([k, byRes[k].batches, byRes[k].bags]));
  resin.push(['TOTAL', scope.length, sum(scope,'bags')]);

  // 4. daily totals
  const grp = {};
  scope.forEach(r => {
    const k = [r.date, r.name, r.mat].join('|');
    grp[k] = grp[k] || {batches:0, bags:0, kg:0, gay:0};
    grp[k].batches++; grp[k].bags += r.bags; grp[k].kg += r.kg; grp[k].gay += r.gay;
  });
  const daily = [['Date','Operator','Material','Batches','Bags used','Kg','Gaylords']];
  Object.keys(grp).sort().forEach(k => {
    const [d,n,mt] = k.split('|'), v = grp[k];
    daily.push([d, n, mt, v.batches, v.bags, v.kg, v.gay]);
  });
  daily.push(['TOTAL','','', scope.length, sum(scope,'bags'), sum(scope,'kg'), sum(scope,'gay')]);

  const tag = mixWho === 'ALL' ? 'all' : mixWho.replace(/[^\w]+/g,'-').toLowerCase();
  const base = 'corona-mixing-' + tag + '-' + mixMonth;

  if(window.XLSX){
    const wb = XLSX.utils.book_new();
    const sh = (aoa, cols, name) => {
      const s = XLSX.utils.aoa_to_sheet(aoa);
      s['!cols'] = cols.map(w => ({wch:w}));
      XLSX.utils.book_append_sheet(wb, s, name);
    };
    sh(daily,   [12,20,14,9,11,10,11],       'Daily totals');
    sh(resin,   [18,9,11],                   'By resin');
    sh(batches, [12,20,8,14,30,11,10,11],    'Batches');
    sh(rlines,  [12,20,8,14,18,11,10,14],    'Resin lines');
    XLSX.writeFile(wb, base + '.xlsx');
    return;
  }
  const q = v => /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g,'""') + '"' : v;
  const csv = [...daily, [], ...resin, [], ...batches, [], ...rlines]
                .map(r => r.map(q).join(',')).join('\r\n');
  const url = URL.createObjectURL(new Blob(['\ufeff' + csv], {type:'text/csv;charset=utf-8'}));
  const a = document.createElement('a');
  a.href = url; a.download = base + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

  'lmh:' + (who || opId) + ':' + (mac || lmhMac) + ':' + (d || lmhDate || workDate());

async function loadLmh(){
  lmh = {settings:'', rolls:[], down:[]};
  try{
    if(window.storage){
      const r = await window.storage.get(lmhKey());
      if(r && r.value) lmh = JSON.parse(r.value);
    } else if(memo[lmhKey()]) lmh = JSON.parse(memo[lmhKey()]);
  }catch(e){ /* nothing logged yet */ }
  if(!Array.isArray(lmh.rolls)) lmh.rolls = [];
  if(!Array.isArray(lmh.down))  lmh.down  = [];
  if(!Array.isArray(lmh.status)) lmh.status = [];
  // settings used to be one note per day — move it onto the rolls
  if(typeof lmh.settings === 'string' && lmh.settings.trim() && lmh.rolls.length){
    lmh.rolls.forEach(r => { if(!r.set) r.set = lmh.settings; });
    lmh.settings = '';
    saveLmh();                           // queued, not awaited — UI shouldn't wait
  }
}

let lmhMonth = iso(now).slice(0,7), lmhWho = 'ALL';

async function allLmh(mac, month){
  const out = [];
  const take = (key, val) => {
    const [, id, m, date] = key.split(':');
    const name = nameOf(id);
    if(mac && m !== mac) return;
    let r; try{ r = JSON.parse(val); }catch(e){ return; }
    if(!r) return;
    (r.rolls || []).forEach(x => out.push({kind:'roll', name, mac:m, date, ...x}));
    (r.down  || []).forEach(x => out.push({kind:'down', name, mac:m, date, ...x}));
    if(Array.isArray(r.status) && r.status.length)
      out.push({kind:'status', name, mac:m, date, events:r.status});
  };
  for(const [k, v] of await scanLike('lmh:%' + (month || lmhMonth) + '%')) take(k, v);
  const seen = new Set(out.map(r => r.name + r.mac + r.date));
  Object.keys(memo).filter(k => k.startsWith('lmh:')).forEach(k => {
    const [, id, m, date] = k.split(':');
    if(!seen.has(nameOf(id) + m + date)) take(k, memo[k]);
  });
  return out.sort((a,b) => a.date.localeCompare(b.date) || (a.t||'').localeCompare(b.t||''));
}

function exportLmh(m, rolls, downs, upDays, statusRecs){
  if(!rolls.length && !downs.length && !(upDays || []).length){
    alert('Nothing to export for this month.'); return;
  }
  const rSheet = [['Date','Operator','Machine','Roll #','Time','Material','Result','Machine settings','Comments']];
  rolls.forEach(r => rSheet.push([r.date, r.name, m.label, r.roll, r.t, r.mat || '',
                                  normRes(r.result), r.set || '', r.note || '']));

  const dSheet = [['Date','Operator','Machine','Reason','Minutes','Hours','Comments']];
  downs.forEach(d => dSheet.push([d.date, d.name, m.label, d.reason,
                                  num(d.mins), Math.round(num(d.mins)/60*100)/100, d.note || '']));

  const uSheet = [['Date','Operator','Machine','Online (h)','Offline (h)','Availability %']];
  (upDays || []).forEach(d => uSheet.push([d.date, d.name, m.label,
    Math.round(d.up/60*100)/100, Math.round(d.down/60*100)/100,
    (d.up+d.down) ? Math.round(d.up/(d.up+d.down)*1000)/10 : '']));

  // per-day roll pass rate
  const byDay = {};
  const blank = () => ({n:0, pass:0, rej:0, q:0, down:0});
  rolls.forEach(r => {
    byDay[r.date] = byDay[r.date] || blank();
    const v = byDay[r.date]; v.n++;
    const res = normRes(r.result);
    if(res === 'Pass') v.pass++;
    else if(res === 'Rejected') v.rej++;
    else if(res === 'Questionable') v.q++;
  });
  downs.forEach(d => {
    byDay[d.date] = byDay[d.date] || blank();
    byDay[d.date].down += num(d.mins);
  });
  const sum1 = [['Date','Rolls','Passed','Rejected','Questionable','Pass rate %','Downtime (min)']];
  Object.keys(byDay).sort().forEach(d => {
    const v = byDay[d];
    sum1.push([d, v.n, v.pass, v.rej, v.q,
               v.n ? Math.round(v.pass / v.n * 1000)/10 : '', v.down]);
  });

  const tag = lmhWho === 'ALL' ? 'all' : lmhWho.replace(/[^\w]+/g,'-').toLowerCase();
  const base = 'corona-lmh-' + m.id + '-' + tag + '-' + lmhMonth;

  if(window.XLSX){
    const wb = XLSX.utils.book_new();
    const sh = (aoa, cols, name) => {
      const s = XLSX.utils.aoa_to_sheet(aoa);
      s['!cols'] = cols.map(w => ({wch:w}));
      XLSX.utils.book_append_sheet(wb, s, name);
    };
    sh(sum1,   [12,8,9,10,14,12,15],        'Daily summary');
    sh(uSheet, [12,20,11,11,11,14],         'Uptime');
    sh(statusSheet(statusRecs, m.label), statusCols(), 'Status log');
    sh(rSheet, [12,20,11,9,8,14,9,40,40],   'Rolls');
    sh(dSheet, [12,20,11,22,10,9,40],       'Downtime');
    XLSX.writeFile(wb, base + '.xlsx');
    return;
  }
  const q = v => /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g,'""') + '"' : v;
  const csv = [...sum1, [], ...uSheet, [], ...statusSheet(statusRecs, m.label), [], ...rSheet, [], ...dSheet]
                .map(r => r.map(q).join(',')).join('\r\n');
  const url = URL.createObjectURL(new Blob(['\ufeff' + csv], {type:'text/csv;charset=utf-8'}));
  const a = document.createElement('a');
  a.href = url; a.download = base + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

/* ── Machine status: shared, not per operator ──────────────
   Whether a machine is running is a fact about the plant, so
   it lives in one record per machine per day that everyone
   reads and writes.                                          */
const MST = (mac, d) => 'mst:' + mac + ':' + (d || iso(now));
const statusCache = {};

async function loadStatus(mac, date, legacy){
  const key = MST(mac, date);
  let evs = [];
  const raw = await grab(key, true);
  if(raw){ try{ evs = JSON.parse(raw).events || []; }catch(e){} }

  // first time on this machine and day, carry across anything an
  // operator recorded under the old per-person record
  if(!evs.length && Array.isArray(legacy) && legacy.length){
    evs = legacy.slice();
    await put(key, JSON.stringify({events: evs}), true);
  }
  statusCache[key] = evs;
  return evs;
}
// The machine sheets fill statusCache; the dashboard and the handover
// card fetch in bulk into memo. Read either, so a machine that is on
// never shows as "not set".
const statusOfMac = (mac, date) => {
  const key = MST(mac, date);
  if(statusCache[key]) return statusCache[key];
  const raw = memo[key];
  if(raw){
    try{
      const evs = JSON.parse(raw).events || [];
      statusCache[key] = evs;
      return evs;
    }catch(e){}
  }
  return [];
};
const saveStatus = (mac, date, evs) => {
  statusCache[MST(mac, date)] = evs;
  return put(MST(mac, date), JSON.stringify({events: evs}), true);
};

// every machine-day status record in a month, for the admin views
async function statusMonth(mac, month){
  const out = [];
  const seen = new Set();
  const take = (k, v) => {
    const [, m, date] = k.split(':');
    if(m !== mac || date.slice(0,7) !== month) return;
    try{ const r = JSON.parse(v); if((r.events || []).length) out.push({date, events:r.events}); }
    catch(e){}
  };
  for(const [k, v] of await scanAll('mst:' + mac + ':', true)){ seen.add(k); take(k, v); }
  Object.keys(memo).filter(k => k.startsWith('mst:' + mac + ':') && !seen.has(k))
    .forEach(k => take(k, memo[k]));
  return out.sort((a,b) => a.date.localeCompare(b.date));
}

/* ── Machine online / offline tracking ────── */
let statusTick = null;

// each toggle appends {state, at}; durations are the gaps between them
function segments(events, dateStr){
  if(!events || !events.length) return [];
  const today = iso(now);
  const cap = dateStr === today
    ? new Date()
    : new Date(dateStr + 'T23:59:59');
  const out = [];
  events.forEach((e,i) => {
    const from = new Date(e.at);
    const to   = events[i+1] ? new Date(events[i+1].at) : cap;
    const mins = Math.max(0, Math.floor((to - from) / 60000));
    out.push({state: e.state, from, to, mins, open: !events[i+1]});
  });
  return out;
}
const minsIn = (segs, state) =>
  segs.filter(s => s.state === state).reduce((a,s) => a + s.mins, 0);
const stateNow = events => events && events.length
  ? events[events.length-1].state : 'unknown';

function statusPanel(evs, dateStr){
  evs = evs || [];
  const segs = segments(evs, dateStr);
  const cur  = stateNow(evs);
  const up   = minsIn(segs, 'online');
  const down = minsIn(segs, 'offline');
  const span = up + down;
  const last = segs[segs.length-1];

  const lampCls = cur === 'online' ? 'up' : cur === 'offline' ? 'down' : '';
  const label   = cur === 'unknown' ? 'Not set' : cur === 'online' ? 'Online' : 'Offline';
  const since   = last
    ? (last.open ? 'Since ' + hhmm(last.from.toISOString()) + ' \u00b7 ' + asHrs(last.mins)
                 : 'Last change ' + hhmm(last.from.toISOString()))
    : 'No status recorded today';

  return '<div class="st-panel">' +
    '<div class="st-lamp ' + lampCls + '"><i></i><b>' + label + '</b></div>' +
    '<div class="st-since" id="st-since">' + since + '</div>' +

    (cur === 'online'
      ? '<button class="st-btn go-off" id="st-toggle">Set offline</button>'
      : '<button class="st-btn go-on"  id="st-toggle">Set online</button>') +

    '<div class="st-split">' +
      '<div class="st-cell up"><div class="cap">Online</div>' +
        '<div class="val" id="st-up">' + asHrs(up) + '</div></div>' +
      '<div class="st-cell down"><div class="cap">Offline</div>' +
        '<div class="val" id="st-down">' + asHrs(down) + '</div></div>' +
    '</div>' +

    (span
      ? '<div class="st-bar">' +
          '<i class="up" style="width:' + (up/span*100) + '%"></i>' +
          '<i class="down" style="width:' + (down/span*100) + '%"></i>' +
        '</div>'
      : '') +

    (segs.length
      ? '<div class="st-log">' +
          segs.map(s => hhmm(s.from.toISOString()) + '  <b>' +
            (s.state === 'online' ? 'Online' : 'Offline') + '</b>  ' +
            asHrs(s.mins) + (s.open ? ' \u2026' : '')).join('<br>') +
          '<button class="st-undo" id="st-undo">Undo last</button>' +
        '</div>'
      : '') +
  '</div>';
}

function wireStatus(ctx){
  const btn = document.getElementById('st-toggle');
  if(btn) btn.addEventListener('click', async () => {
    const cur = stateNow(ctx.get() || []);
    const next = cur === 'online' ? 'offline' : 'online';
    ctx.set((ctx.get() || []).concat([{state: next, at: new Date().toISOString()}]));
    await ctx.save(); ctx.redraw();
  });

  const undo = document.getElementById('st-undo');
  if(undo) undo.addEventListener('click', async () => {
    const a = (ctx.get() || []).slice(); a.pop(); ctx.set(a);
    await ctx.save(); ctx.redraw();
  });

  clearInterval(statusTick);
  if((ctx.get() || []).length && ctx.date === iso(now)){
    statusTick = setInterval(() => {
      const segs = segments(ctx.get() || [], ctx.date);
      const last = segs[segs.length-1];
      const u = document.getElementById('st-up'), d = document.getElementById('st-down'),
            s = document.getElementById('st-since');
      if(!u || !d){ clearInterval(statusTick); return; }
      u.textContent = asHrs(minsIn(segs,'online'));
      d.textContent = asHrs(minsIn(segs,'offline'));
      if(s && last && last.open)
        s.textContent = 'Since ' + hhmm(last.from.toISOString()) + ' \u00b7 ' + asHrs(last.mins);
    }, 1000);
  }
}


// Every online/offline change, one row per segment
function statusSheet(recs, machineLabel){
  const aoa = [['Date','Machine','State','From','To','Minutes','Hours','Still open']];
  (recs || []).forEach(r => {
    segments(r.events, r.date).forEach(s => {
      const row = [r.date, machineLabel || r.name || ''];
      row.push(s.state === 'online' ? 'Online' : 'Offline',
               hhmm(s.from.toISOString()), hhmm(s.to.toISOString()),
               s.mins, Math.round(s.mins/60*100)/100, s.open ? 'yes' : '');
      aoa.push(row);
    });
  });
  return aoa;
}

/* ── Downtime: its own log, either machine ── */
let dwn = {rows:[]}, dwnDate = '', dwnMac = 'm2';

const dwnKey = (who, d) => 'dwn:' + (who || opId) + ':' + (d || dwnDate || workDate());
const macLabel = id => (MACHINES.find(m => m.id === id) || {}).label || id;

// length of a stoppage from its clock times; wraps past midnight
function gapMins(start, end){
  if(!start || !end) return 0;
  const [sh,sm] = start.split(':').map(Number);
  const [eh,em] = end.split(':').map(Number);
  let m = (eh*60 + em) - (sh*60 + sm);
  if(m < 0) m += 1440;
  return m;
}

async function loadDwn(){
  dwn = {rows:[]};
  try{
    if(window.storage){
      const r = await window.storage.get(dwnKey());
      if(r && r.value) dwn = JSON.parse(r.value);
    } else if(memo[dwnKey()]) dwn = JSON.parse(memo[dwnKey()]);
  }catch(e){ /* nothing logged yet */ }
  if(!Array.isArray(dwn.rows)) dwn.rows = [];
  dwn.rows.forEach(d => {
    if(!d.start && d.t){                       // older row: one time plus a length
      d.start = d.t;
      const [hh,mm] = d.t.split(':').map(Number);
      const e = (hh*60 + mm + num(d.mins)) % 1440;
      d.end = String(Math.floor(e/60)).padStart(2,'0') + ':' + String(e%60).padStart(2,'0');
    }
  });

  // downtime used to live inside each machine sheet — pull it across
  let moved = false;
  for(const mc of MACHINES){
    const k = lmhKey(opId, mc.id, dwnDate || iso(now));
    let raw = memo[k];
    if(!raw && window.storage){
      try{ const g = await window.storage.get(k); raw = g && g.value; }catch(e){}
    }
    if(!raw) continue;
    try{
      const sheet = JSON.parse(raw);
      if(Array.isArray(sheet.down) && sheet.down.length){
        sheet.down.forEach(d => dwn.rows.push({...d, mac: mc.id}));
        sheet.down = [];
        const blob = JSON.stringify(sheet);
        await put(k, blob);
        moved = true;
      }
    }catch(e){}
  }
  if(moved) saveDwn();
}
async function saveDwn(){ return put(dwnKey(), JSON.stringify(dwn)); }

function seenReasons(){
  const out = new Set();
  Object.keys(memo).forEach(k => {
    if(!k.startsWith('dwn:') && !k.startsWith('snd:')) return;
    try{
      const r = JSON.parse(memo[k]);
      (r.rows || []).forEach(d => d.reason && out.add(d.reason));
      (r.down || []).forEach(d => d.reason && out.add(d.reason));
    }catch(e){}
  });
  return [...out].sort();
}

/* ── Downtime: admin ──────────────────────── */
let dwnMonth = iso(now).slice(0,7), dwnWho = 'ALL';

async function allDwn(month){
  const out = [];
  const take = (key, val) => {
    const [, id, date] = key.split(':');
    const name = nameOf(id);
    let r; try{ r = JSON.parse(val); }catch(e){ return; }
    (r.rows || []).forEach(d => out.push({name, date, ...d}));
  };
  for(const [k, v] of await scanLike('dwn:%' + (month || dwnMonth) + '%')) take(k, v);
  const seen = new Set(out.map(r => r.name + r.date));
  Object.keys(memo).filter(k => k.startsWith('dwn:')).forEach(k => {
    const [, id, date] = k.split(':');
    if(!seen.has(nameOf(id) + date)) take(k, memo[k]);
  });
  return out.sort((a,b) => a.date.localeCompare(b.date) || (a.start||'').localeCompare(b.start||''));
}

function exportDwn(scope, byReason, ranked, total){
  if(!scope.length){ alert('Nothing to export for this month.'); return; }

  const pareto = [['Reason','Events','Minutes','Hours','Share %']];
  ranked.forEach(k => pareto.push([k, byReason[k].n, byReason[k].mins,
    Math.round(byReason[k].mins/60*100)/100,
    total ? Math.round(byReason[k].mins/total*1000)/10 : 0]));
  pareto.push(['TOTAL', scope.length, total, Math.round(total/60*100)/100, 100]);

  const byMac = [['Machine','Events','Minutes','Hours']];
  MACHINES.forEach(m => {
    const rows = scope.filter(d => d.mac === m.id);
    const t = rows.reduce((a,d) => a + num(d.mins), 0);
    byMac.push([m.label, rows.length, t, Math.round(t/60*100)/100]);
  });

  const detail = [['Date','Operator','Machine','Start','End','Reason','Minutes','Hours','Photo','Comments']];
  scope.forEach(d => detail.push([d.date, d.name, macLabel(d.mac), d.start || '', d.end || '', d.reason,
    num(d.mins), Math.round(num(d.mins)/60*100)/100, d.img ? 'yes' : '', d.note || '']));

  const tag = dwnWho === 'ALL' ? 'all' : dwnWho.replace(/[^\w]+/g,'-').toLowerCase();
  const base = 'corona-downtime-' + tag + '-' + dwnMonth;

  if(window.XLSX){
    const wb = XLSX.utils.book_new();
    const sh = (aoa, cols, name) => {
      const s = XLSX.utils.aoa_to_sheet(aoa);
      s['!cols'] = cols.map(w => ({wch:w}));
      XLSX.utils.book_append_sheet(wb, s, name);
    };
    sh(pareto, [24,9,10,9,10],           'By reason');
    sh(byMac,  [14,9,10,9],              'By machine');
    sh(detail, [12,20,12,8,8,24,10,9,7,40], 'Events');
    XLSX.writeFile(wb, base + '.xlsx');
    return;
  }
  const q = v => /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g,'""') + '"' : v;
  const csv = [...pareto, [], ...byMac, [], ...detail].map(r => r.map(q).join(',')).join('\r\n');
  const url = URL.createObjectURL(new Blob(['\ufeff' + csv], {type:'text/csv;charset=utf-8'}));
  const a = document.createElement('a');
  a.href = url; a.download = base + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

// books: [[aoa, colWidths, sheetName], ...]
function booksOut(books, base){
  if(window.XLSX){
    const wb = XLSX.utils.book_new();
    books.forEach(([aoa, cols, name]) => {
      const s = XLSX.utils.aoa_to_sheet(aoa);
      s['!cols'] = cols.map(w => ({wch:w}));
      XLSX.utils.book_append_sheet(wb, s, name);
    });
    XLSX.writeFile(wb, base + '.xlsx');
    return;
  }
  const q = v => /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g,'""') + '"' : v;
  const rows = [];
  books.forEach(([aoa], i) => { if(i) rows.push([]); aoa.forEach(r => rows.push(r)); });
  const csv = rows.map(r => r.map(q).join(',')).join('\r\n');
  const url = URL.createObjectURL(new Blob(['\ufeff' + csv], {type:'text/csv;charset=utf-8'}));
  const a = document.createElement('a');
  a.href = url; a.download = base + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
const sheetOut = (aoa, cols, name, base) => booksOut([[aoa, cols, name]], base);

const belts = r => Array.isArray(r.belts) ? r.belts : [];
const beltCount = r => belts(r).reduce((a,b) => a + num(b.count), 0);

async function loadSnd(){
  snd = {rows:[], status:[], down:[], comments:[]};
  try{
    if(window.storage){
      const r = await window.storage.get(sndKey());
      if(r && r.value) snd = JSON.parse(r.value);
    } else if(memo[sndKey()]) snd = JSON.parse(memo[sndKey()]);
  }catch(e){ /* nothing logged yet */ }
  ['rows','status','down','comments'].forEach(k => {
    if(!Array.isArray(snd[k])) snd[k] = [];
  });
  snd.rows.forEach(r => {
    if(r.todo === undefined && r.left !== undefined) r.todo = r.left;   // old field name
    if(r.under === undefined) r.under = 0;
  });
}
const saveSnd = () => put(sndKey(), JSON.stringify(snd));

function seenGrits(){
 return cachedList('grits', () => {
  const out = new Set(['120','240']);
  Object.keys(memo).filter(k => k.startsWith('snd:')).forEach(k => {
    try{
      (JSON.parse(memo[k]).rows || []).forEach(r =>
        belts(r).forEach(b => b.grit && out.add(String(b.grit))));
    }catch(e){}
  });
  return [...out].sort((a,b) => (parseFloat(a)||0) - (parseFloat(b)||0));
 });
}
function sndMaterials(){
  const out = new Set(['Natural','Black','STS']);
  Object.keys(memo).forEach(k => {
    if(!/^(snd|mix|flm|lmh):/.test(k)) return;
    try{
      const r = JSON.parse(memo[k]);
      (r.rows  || []).forEach(x => { if(x.mat) out.add(x.mat); });
      (r.rolls || []).forEach(x => { if(x.mat) out.add(x.mat); });
    }catch(e){}
  });
  return [...out].filter(Boolean).sort();
}

let sndMonth = iso(now).slice(0,7), sndWho = 'ALL';

async function allSnd(month){
  const out = [];
  const take = (key, val) => {
    const [, id, date] = key.split(':');
    const name = nameOf(id);
    let r; try{ r = JSON.parse(val); }catch(e){ return; }
    (r.rows     || []).forEach(x => out.push({kind:'row',  name, date, ...x}));
    (r.down     || []).forEach(x => out.push({kind:'down', name, date, ...x}));
    (r.comments || []).forEach(x => out.push({kind:'comm', name, date, ...x}));
    if(Array.isArray(r.status) && r.status.length)
      out.push({kind:'status', name, date, events:r.status});
  };
  for(const [k, v] of await scanLike('snd:%' + (month || sndMonth) + '%')) take(k, v);
  const seen = new Set(out.map(r => r.name + r.date));
  Object.keys(memo).filter(k => k.startsWith('snd:')).forEach(k => {
    const [, id, date] = k.split(':');
    if(!seen.has(nameOf(id) + date)) take(k, memo[k]);
  });
  return out.sort((a,b) => a.date.localeCompare(b.date) ||
                           ((a.t||a.start||'').localeCompare(b.t||b.start||'')));
}

function exportSnd(scope, byGrit, grits, upDays, notes, statusRecs){
  if(!scope.length && !(upDays || []).length && !(notes || []).length){
    alert('Nothing to export for this month.'); return;
  }
  const beltTxt = r => belts(r).map(b => b.grit + (num(b.count) ? ' \u00d7' + num(b.count) : '')).join(' + ');

  const daily = {};
  scope.forEach(r => {
    const k = r.date + '|' + r.name;
    daily[k] = daily[k] || {done:0, belts:0, under:0, todo:0};
    daily[k].done += num(r.done); daily[k].belts += beltCount(r);
    daily[k].under = num(r.under); daily[k].todo = num(r.todo);   // closing snapshot
  });
  const dSheet = [['Date','Operator','Rolls completed','Under process (end)',
                   'Not processed (end)','Belts used']];
  Object.keys(daily).sort().forEach(k => {
    const [d,n] = k.split('|'), v = daily[k];
    dSheet.push([d, n, v.done, v.under, v.todo, v.belts]);
  });
  dSheet.push(['TOTAL','', scope.reduce((a,r) => a + num(r.done), 0), '', '',
               scope.reduce((a,r) => a + beltCount(r), 0)]);

  const gSheet = [['Grit','Times used','Belts used']];
  grits.forEach(g => gSheet.push([g, byGrit[g].n, byGrit[g].count]));

  const uSheet = [['Date','Machine','Online (h)','Offline (h)','Availability %']];
  (upDays || []).forEach(d => uSheet.push([d.date, d.name,
    Math.round(d.up/60*100)/100, Math.round(d.down/60*100)/100,
    (d.up+d.down) ? Math.round(d.up/(d.up+d.down)*1000)/10 : '']));

  const eSheet = [['Date','Operator','Time','Material','Rolls completed','Under process','Not processed','Belts']];
  scope.forEach(r => eSheet.push([r.date, r.name, r.t, r.mat || '',
                                  num(r.done), num(r.under), num(r.todo), beltTxt(r)]));

  const bSheet = [['Date','Operator','Time','Grit','Belts used']];
  scope.forEach(r => belts(r).forEach(b =>
    bSheet.push([r.date, r.name, r.t, b.grit, num(b.count)])));

  const cSheet = [['Date','Operator','Time','Subject','Comment']];
  (notes || []).forEach(c => cSheet.push([c.date, c.name, c.t, c.tag || '', c.text]));

  booksOut([
    [dSheet, [12,20,16,19,20,12], 'Daily totals'],
    [gSheet, [10,13,12],          'By grit'],
    [uSheet, [12,20,11,11,14],    'Uptime'],
    [statusSheet(statusRecs, 'Sander'), statusCols(), 'Status log'],
    [eSheet, [12,20,8,14,16,15,15,24],'Entries'],
    [bSheet, [12,20,8,10,12],     'Belt lines'],
    [cSheet, [12,20,8,20,60],     'Comments']
  ], 'corona-sanding-' + (sndWho === 'ALL' ? 'all' :
      sndWho.replace(/[^\w]+/g,'-').toLowerCase()) + '-' + sndMonth);
}

let flmMonth = iso(now).slice(0,7), flmWho = 'ALL';

async function allFlm(month){
  const out = [];
  const take = (key, val) => {
    const [, id, date] = key.split(':');
    const name = nameOf(id);
    let r; try{ r = JSON.parse(val); }catch(e){ return; }
    (r.rolls || []).forEach(x => out.push({kind:'roll', name, date, ...x}));
    (r.down  || []).forEach(x => out.push({kind:'down', name, date, ...x}));
    (r.peel  || []).forEach(x => out.push({kind:'peel', name, date, ...x}));
    if(Array.isArray(r.status) && r.status.length)
      out.push({kind:'status', name, date, events:r.status});
    if(num(r.todo)) out.push({kind:'todo', name, date, todo:num(r.todo)});
  };
  for(const [k, v] of await scanLike('flm:%' + (month || flmMonth) + '%')) take(k, v);
  const seen = new Set(out.map(r => r.name + r.date));
  Object.keys(memo).filter(k => k.startsWith('flm:')).forEach(k => {
    const [, id, date] = k.split(':');
    if(!seen.has(nameOf(id) + date)) take(k, memo[k]);
  });
  return out.sort((a,b) => a.date.localeCompare(b.date) ||
                           ((a.t||a.start||'').localeCompare(b.t||b.start||'')));
}

  }catch(e){ /* nothing logged yet */ }

/* ── Quality: report attachments ───────────── */
// Storage holds text, so the file is base64'd into its own key and the
// day record keeps only the metadata. Keeps day saves small and fast.
const kb = n => n < 1024*1024
  ? Math.round(n/1024) + ' KB'
  : Math.round(n/1024/1024*10)/10 + ' MB';

function readAsBase64(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1] || '');
    r.onerror = () => rej(new Error('Could not read the file'));
    r.readAsDataURL(file);
  });
}

async function fetchFile(id, shared){
  if(memo[fileKey(id)]) return memo[fileKey(id)];
  if(window.storage){
    try{
      const g = await window.storage.get(fileKey(id), !!shared);
      if(g && g.value != null){ memo[fileKey(id)] = g.value; return g.value; }
    }catch(e){}
  }
  return null;
}

async function downloadFile(meta){
  const b64 = await fetchFile(meta.id, meta.shared);
  if(!b64){ alert('That file is no longer available on this device.'); return; }
  try{
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([bytes], {type: meta.type || 'application/octet-stream'}));
    const a = document.createElement('a');
    a.href = url; a.download = meta.name;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }catch(e){ alert('That file could not be opened.'); }
}

      (qua.files.length
        ? '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
            '<th>File</th><th>Size</th><th>Added</th><th></th><th></th>' +
          '</tr></thead><tbody>' +
          qua.files.map((f,i) =>

          '</tbody></table></div>'
        : '<div class="tbl-wrap"><div class="empty">No report attached today</div></div>') +
    '</div>';

  wireQuaDate(renderQuaReport);

  document.getElementById('qr-add').addEventListener('click', async () => {
    const inp = document.getElementById('qr-file');
    const warn = document.getElementById('qr-warn');
    const file = inp.files && inp.files[0];
    warn.textContent = '';
    if(!file){ warn.textContent = 'Choose a file first'; return; }
    if(file.size > MAX_UPLOAD){
      warn.textContent = 'File is ' + kb(file.size) + ' \u2014 limit is ' + kb(MAX_UPLOAD);

    }
    try{
      const b64 = await readAsBase64(file);
      const id = 'f' + Date.now() + Math.random().toString(36).slice(2,7);
      const ok = await put(fileKey(id), b64);
      qua.files.push({id, name: file.name, size: file.size, type: file.type,
                      t: String(new Date().getHours()).padStart(2,'0') + ':' +
                         String(new Date().getMinutes()).padStart(2,'0')});
      await saveQua();
      renderQuaReport();
      const okEl = document.getElementById('qr-ok');
      if(okEl) okEl.textContent = ok ? '\u2713 Saved' : '\u2713 Held on this device';
    }catch(e){ warn.textContent = 'Could not read that file'; }
  });

  document.querySelectorAll('[data-qdl]').forEach(b =>
    b.addEventListener('click', () => downloadFile(qua.files[+b.dataset.qdl])));

  document.querySelectorAll('[data-qrm]').forEach(b =>
    b.addEventListener('click', async () => {
      const f = qua.files[+b.dataset.qrm];
      qua.files.splice(+b.dataset.qrm, 1);
      delete memo[fileKey(f.id)];
      try{ if(window.storage) await window.storage.delete(fileKey(f.id)); }catch(e){}
      await saveQua(); renderQuaReport();
    }));
}

// Phone photos run 2–5 MB, far too big for text storage, so every image is
// scaled down and re-encoded as JPEG before it is saved.
const IMG_MAX_PX = 1280, IMG_QUALITY = 0.72;
let pendingImg = null;                    // {b64, name, size} for the sample being added


/* Picking a photo used to redraw the whole form, which rebuilt every
   field from what was last saved — so anything typed and not yet saved
   was wiped. Update the preview in place instead. */
function clearPicked(input, noteId, reset){
  const wrap = input.closest('.img-pick');
  if(wrap && wrap.firstElementChild){
    const span = document.createElement('span');
    span.className = 'none';
    span.textContent = '\u2295';
    wrap.replaceChild(span, wrap.firstElementChild);
  }
  const x = wrap && wrap.querySelector('.pick-x');
  if(x) x.remove();
  input.value = '';                       // so the same file can be picked again
  const note = document.getElementById(noteId);
  if(note) note.textContent = 'Optional';
  reset();
}

function showPicked(input, img, noteId, reset){
  const wrap = input.closest('.img-pick');
  if(wrap && wrap.firstElementChild){
    const el = document.createElement('img');
    el.className = 'prev';
    el.src = 'data:image/jpeg;base64,' + img.b64;
    el.alt = '';
    wrap.replaceChild(el, wrap.firstElementChild);
  }
  const wrap2 = input.closest('.img-pick');
  if(wrap2 && !wrap2.querySelector('.pick-x')){
    const x = document.createElement('button');
    x.className = 'pick-x';
    x.type = 'button';
    x.textContent = '\u2715';
    x.title = 'Remove this photo';
    x.addEventListener('click', () => clearPicked(input, noteId, reset));
    wrap2.appendChild(x);
  }
  const note = document.getElementById(noteId);
  if(note) note.textContent = '\u2713 ' + kb(img.size) +
    ' \u00b7 ready to attach \u00b7 tap \u2715 to take another';
}

function shrinkImage(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight;
      const scale = Math.min(1, IMG_MAX_PX / Math.max(w, h));
      w = Math.max(1, Math.round(w * scale));
      h = Math.max(1, Math.round(h * scale));
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      const b64 = c.toDataURL('image/jpeg', IMG_QUALITY).split(',')[1] || '';
      res({b64, w, h, size: Math.round(b64.length * 0.75)});
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Could not read image')); };
    img.src = url;
  });
}

function lightbox(src, caption){
  let el = document.getElementById('lightbox');
  if(!el){
    el = document.createElement('div');
    el.id = 'lightbox';
    el.innerHTML = '<button class="lb-x" aria-label="Close">\u2715</button>' +
                   '<img alt=""><div class="lb-cap"></div>';
    document.body.appendChild(el);
    const close = () => el.classList.remove('on');
    el.addEventListener('click', e => { if(e.target === el) close(); });
    el.querySelector('.lb-x').addEventListener('click', close);
    document.addEventListener('keydown', e => { if(e.key === 'Escape') close(); });
  }
  el.querySelector('img').src = 'data:image/jpeg;base64,' + src;
  el.querySelector('.lb-cap').textContent = caption || '';
  el.classList.add('on');
}

async function showPhoto(meta){
  const b64 = await fetchFile(meta.id);
  if(!b64){ alert('That photo is no longer available on this device.'); return; }
  lightbox(b64, meta.label || '');
}

// fills in thumbnails after the table has rendered
async function paintThumbs(){
  const cells = [...document.querySelectorAll('[data-thumb]')];
  for(const c of cells){
    const b64 = await fetchFile(c.dataset.thumb, c.dataset.shared === '1');
    if(!b64){ c.textContent = '\u2013'; continue; }
    const im = document.createElement('img');
    im.className = 'thumb';
    im.src = 'data:image/jpeg;base64,' + b64;
    im.alt = 'Sample photo';
    im.addEventListener('click', () => lightbox(b64, c.dataset.label || ''));
    c.innerHTML = '';
    c.appendChild(im);
  }
}

let quaMonth = iso(now).slice(0,7), quaWho = 'ALL';

async function allQua(month){
  const out = [];
  const take = (key, val) => {
    const [, id, date] = key.split(':');
    const name = nameOf(id);
    let r; try{ r = JSON.parse(val); }catch(e){ return; }
    (r.samples  || []).forEach(x => out.push({kind:'samp', name, date, ...x}));
    (r.comments || []).forEach(x => out.push({kind:'comm', name, date, ...x}));
    // x.name is the filename, so the operator goes in `by`
    (r.files    || []).forEach(x => out.push({kind:'file', by:name, date, ...x}));
  };
  for(const [k, v] of await scanLike('qua:%' + (month || quaMonth) + '%')) take(k, v);
  const seen = new Set(out.map(r => (r.by || r.name) + r.date));
  Object.keys(memo).filter(k => k.startsWith('qua:')).forEach(k => {
    const [, id, date] = k.split(':');
    if(!seen.has(nameOf(id) + date)) take(k, memo[k]);
  });
  return out.sort((a,b) => a.date.localeCompare(b.date) || (a.t||'').localeCompare(b.t||''));
}

function dueLabel(target){
  if(!target) return '';
  const today = new Date(iso(now) + 'T00:00:00');
  const d = new Date(target + 'T00:00:00');
  const days = Math.round((d - today) / 86400000);
  if(days < 0)  return {txt: Math.abs(days) + 'd overdue', cls: 'due-late'};
  if(days === 0) return {txt: 'Due today', cls: 'due-soon'};
  if(days <= 3) return {txt: 'In ' + days + 'd', cls: 'due-soon'};
  return {txt: 'In ' + days + 'd', cls: ''};
}

let mntMonth = iso(now).slice(0,7), mntWho = 'ALL';

async function allMnt(month){
  const out = [];
  const take = (key, val) => {
    const [, id, date] = key.split(':');
    const name = nameOf(id);
    let r; try{ r = JSON.parse(val); }catch(e){ return; }
    (r.logs || []).forEach(x => out.push({name, date, ...x}));
  };
  for(const [k, v] of await scanLike('mnt:%' + (month || mntMonth) + '%')) take(k, v);
  const seen = new Set(out.map(r => r.name + r.date));
  Object.keys(memo).filter(k => k.startsWith('mnt:')).forEach(k => {
    const [, id, date] = k.split(':');
    if(!seen.has(nameOf(id) + date)) take(k, memo[k]);
  });
  return out.sort((a,b) => a.date.localeCompare(b.date) || (a.start||'').localeCompare(b.start||''));
}

/* ── Collections that several people edit at once ──────────
   A whole list in one record means the last person to save
   wipes out everyone else's changes. These lists are stored
   one row per item instead, so two people editing different
   items never collide.                                      */

/* Suggestion lists walk every record held in memory. Doing that on
   every redraw is what made the forms feel heavy, so the result is
   kept until something is written. */
let sugVer = 0, sugAt = -1;
const sugCache = new Map();
function cachedList(key, build){
  if(sugAt !== sugVer){ sugCache.clear(); sugAt = sugVer; }
  if(!sugCache.has(key)) sugCache.set(key, build());
  return sugCache.get(key);
}

const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

async function loadItems(prefix, legacyKey, pluck){
  const out = [];

  // carry across anything still held in the old single-record form
  if(legacyKey){
    const old = await grab(legacyKey, true);
    if(old){
      try{
        const items = pluck(JSON.parse(old)) || [];
        for(const it of items){
          if(!it.id) it.id = newId();
          await put(prefix + it.id, JSON.stringify(it), true);
          out.push(it);
        }
      }catch(e){}
      try{ if(window.storage) await window.storage.delete(legacyKey); }catch(e){}
      memo[legacyKey] = JSON.stringify(pluck({}) ? {} : {});
      delete memo[legacyKey];
      if(out.length) return out;
    }
  }

  for(const [, raw] of await scanAll(prefix, true)){
    try{ const it = JSON.parse(raw); if(it && it.id) out.push(it); }catch(e){}
  }
  return out;
}

const saveItem = (prefix, item) => {
  if(!item.id) item.id = newId();
  return put(prefix + item.id, JSON.stringify(item), true);
};
async function dropItem(prefix, id){
  delete memo[prefix + id];
  try{ if(window.storage) await window.storage.delete(prefix + id, true); }catch(e){}
}

async function loadPO(){

function renderPOLock(msg){
  $('page-body').innerHTML =
    '<div class="lockwrap">' +
      '<div class="lk-ico">\u26bf</div>' +
      '<h3>Locked</h3>' +
      '<p>Enter the purchase order code</p>' +
      '<div class="readout" id="po-dots">' +
        Array.from({length: CODE_LEN}, () => '<div class="cell"><span></span></div>').join('') +
      '</div>' +
      '<div class="err" id="po-err">' + (msg || '') + '</div>' +
      '<div class="keys">' +
        [1,2,3,4,5,6,7,8,9].map(n => '<button class="key po-k">' + n + '</button>').join('') +
        '<button class="key fn" id="po-clr">Clear</button>' +
        '<button class="key po-k">0</button>' +
        '<button class="key ok" id="po-ent">Enter</button>' +
      '</div>' +
    '</div>';

  const paintPin = () => document.querySelectorAll('#po-dots .cell')
    .forEach((c,i) => c.classList.toggle('set', i < poPin.length));
  paintPin();

  document.querySelectorAll('.po-k').forEach(k =>
    k.addEventListener('click', () => {
      if(poPin.length < CODE_LEN){ poPin += k.textContent; paintPin();
        document.getElementById('po-err').textContent = ''; }
    }));
  document.getElementById('po-clr').addEventListener('click', () => {
    poPin = ''; paintPin(); document.getElementById('po-err').textContent = '';
  });
  document.getElementById('po-ent').addEventListener('click', () => {
    if(poPin.length < CODE_LEN){ renderPOLock('Enter all ' + CODE_LEN + ' digits'); return; }
    if(poPin !== PO_CODE){
      poPin = '';
      const d = document.getElementById('po-dots');
      d.classList.add('bad'); setTimeout(() => d.classList.remove('bad'), 360);
      renderPOLock('Code not recognised');
      return;
    }
    poPin = ''; poOpen = true; renderPO();
  });

  show('s-page');
}

/* ── Order lines ───────────────────────────────────────────
   The running register: what each order is, how much has been
   produced, what is still to make, and what has shipped.
   One record per line, so two people can update at once.      */
let poLines = [];
const POL = 'pol:i:';

async function loadPOLines(){
  poLines = await loadItems(POL, null, o => o.items || []);
  // what used to be "produced" is the order quantity now
  poLines.forEach(l => {
    if(l.ordered === undefined && l.produced !== undefined) l.ordered = num(l.produced);
    delete l.produced;
  });
  poLines.sort((a,b) => (a.po || '').localeCompare(b.po || '') ||
                        (a.code || '').localeCompare(b.code || ''));
}
